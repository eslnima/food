function macroGroup(f) {
  const calCarb = (f.carbs100 + f.soluble100 + f.insoluble100) * 4;
  const calProtein = f.protein100 * 4;
  const calFat = f.fat100 * 9;
  const total = calCarb + calProtein + calFat || 1;
  const shares = { carb: calCarb / total, protein: calProtein / total, fat: calFat / total };
  const sorted = Object.entries(shares).sort((a, b) => b[1] - a[1]);
  if (sorted[0][1] < 0.5 && sorted[0][1] - sorted[1][1] < 0.15) return "mixed";
  return sorted[0][0];
}

function portionInfo(food, mode, overrideGrams) {
  let grams;
  if (overrideGrams != null && overrideGrams > 0) {
    grams = overrideGrams;
  } else if (mode === "100g") {
    grams = 100;
  } else if (mode === "50c") {
    grams = food.carbs100 > 0 ? (50 / food.carbs100) * 100 : 100;
  } else {
    grams = food.fdaG;
  }
  const carbsAtPortion = (food.carbs100 * grams) / 100;
  const gl = (food.gi * carbsAtPortion) / 100;
  return { grams, carbsAtPortion, gl };
}

function macrosAtPortion(food, grams) {
  const k = grams / 100;
  return {
    sugar: food.sugar100 * k,
    starch: starch(food) * k,
    soluble: food.soluble100 * k,
    insoluble: food.insoluble100 * k,
    protein: food.protein100 * k,
    satFat: food.satFat100 * k,
    mono: food.mono100 * k,
    poly: food.poly100 * k,
  };
}

function microsAtPortion(food, grams) {
  const k = grams / 100;
  return {
    sodium: food.sodium100 * k,
    potassium: food.potassium100 * k,
    calcium: food.calcium100 * k,
    iron: food.iron100 * k,
    vitC: food.vitC100 * k,
    magnesium: food.magnesium100 * k,
    zinc: food.zinc100 * k,
    vitA: food.vitA100 * k,
    vitB12: food.vitB12_100 * k,
    folate: food.folate100 * k,
  };
}

function curvePoints(food, gl) {
  const peak = 1.55 * gl;
  const sigmaRise = food.ttp / 2.3;
  const slowFallCats = { fat: 1.5, legume: 1.4, veg: 1.15, grain: 1.15, protein: 1.3 };
  const sigmaFall = (food.ttp / 1.35) * (slowFallCats[food.cat] || 1.1);
  const pts = [];
  for (let t = 0; t <= 200; t += 5) {
    const sigma = t <= food.ttp ? sigmaRise : sigmaFall;
    pts.push(Math.max(0, peak * Math.exp(-((t - food.ttp) ** 2) / (2 * sigma * sigma))));
  }
  return pts;
}

function round(n, d = 0) {
  const m = 10 ** d;
  return Math.round(n * m) / m;
}

// Colors are shades within 3 hue families so the pie reads at a glance:
// amber = carbs (4 shades: sugar -> starch -> soluble fiber -> insoluble fiber),
// teal = protein (1 shade), rose = fat (3 shades: sat -> mono -> poly).
function findSimilarFoods(food, limit) {
  const scored = FOODS.filter((f) => f.id !== food.id).map((f) => {
    let score = f.cat === food.cat ? 0 : 40;
    score += Math.abs(f.gi - food.gi) * 0.5;
    score += Math.abs(f.carbs100 - food.carbs100) * 0.3;
    score += Math.abs(f.protein100 - food.protein100) * 0.5;
    score += Math.abs(f.fat100 - food.fat100) * 0.3;
    return { f, score };
  });
  scored.sort((a, b) => a.score - b.score);
  return scored.slice(0, limit).map((s) => s.f);
}

const LEGUME_LIKE_PROTEIN_IDS = ["tofu", "tempeh"];

function aminoProfileKey(food) {
  if (LEGUME_LIKE_PROTEIN_IDS.includes(food.id)) return "legume";
  if (food.cat === "protein") return "complete_animal";
  if (food.cat === "legume") return "legume";
  if (food.cat === "grain") return "grain";
  if (food.cat === "fat") return NUT_SEED_IDS.includes(food.id) ? "nut_seed" : "complete_animal";
  return "legume";
}

function aminoAcidsAtPortion(food, grams) {
  const proteinG = (food.protein100 * grams) / 100;
  const profile = AMINO_PROFILES[aminoProfileKey(food)];
  const result = {};
  let essentialSum = 0;
  AMINO_KEYS_ORDERED.forEach((k) => {
    if (k === "other") return;
    const v = proteinG * (profile[k] || 0);
    result[k] = v;
    essentialSum += v;
  });
  result.other = Math.max(0, proteinG - essentialSum);
  return result;
}

// Simplified Amino Acid Score: each essential amino acid's fraction (g per g
// protein) is compared to the FAO/WHO/UNU (2007) suggested adult reference
// pattern; the lowest ratio across all nine is the "limiting" amino acid and
// becomes the overall score (capped at 100%) — the same logic PDCAAS uses,
// minus the digestibility correction. This scores the protein SOURCE TYPE
// (animal/dairy, legume, grain, or nut/seed), not a lab assay of this food.
const REFERENCE_AA_PATTERN = { his: 0.015, ile: 0.03, leu: 0.059, lys: 0.045, met: 0.022, phe: 0.038, thr: 0.023, trp: 0.006, val: 0.039 };

function proteinQualityScore(food) {
  const profile = AMINO_PROFILES[aminoProfileKey(food)];
  let minRatio = Infinity;
  let limitingKey = null;
  Object.keys(REFERENCE_AA_PATTERN).forEach((k) => {
    const ratio = (profile[k] || 0) / REFERENCE_AA_PATTERN[k];
    if (ratio < minRatio) {
      minRatio = ratio;
      limitingKey = k;
    }
  });
  return { score: Math.min(1, minRatio), limitingKey, rawRatio: minRatio };
}

function qualityTier(score) {
  if (score >= 1) return { label: { en: "Complete", fa: "کامل" }, color: "#1d9e75" };
  if (score >= 0.8) return { label: { en: "Good", fa: "خوب" }, color: "#8bc24a" };
  if (score >= 0.6) return { label: { en: "Moderate", fa: "متوسط" }, color: "#e0a83c" };
  return { label: { en: "Limited", fa: "محدود" }, color: "#d4534f" };
}

// Combine several foods into one "plate": macro grams sum directly (they're
// additive), but the glucose *curve* is not a simple point-wise average —
// combining foods raises total glycemic load (more carbs = more total
// glucose) while fat/fiber typically blunts and delays the peak. This model
// sums glycemic load, then applies a simple blunting/delay heuristic based
// on how much fat and fiber ride along with the carbs — a simplification,
// not a clinical prediction (real mixed-meal responses depend on much more).
function computePlate(plateFoods, mode, customGrams) {
  const cg = customGrams || {};
  const macros = Object.fromEntries(MACRO_KEYS_ORDERED.map((k) => [k, 0]));
  const micros = Object.fromEntries(MICRO_KEYS_ORDERED.map((k) => [k, 0]));
  let totalCarb = 0;
  let totalGL = 0;
  let ttpWeightedSum = 0;
  let totalFatG = 0;
  let totalFiberG = 0;

  plateFoods.forEach((f) => {
    const { grams, gl, carbsAtPortion } = portionInfo(f, mode, cg[f.id]);
    const m = macrosAtPortion(f, grams);
    const mi = microsAtPortion(f, grams);
    MACRO_KEYS_ORDERED.forEach((k) => (macros[k] += m[k]));
    MICRO_KEYS_ORDERED.forEach((k) => (micros[k] += mi[k]));
    totalCarb += carbsAtPortion;
    totalGL += gl;
    ttpWeightedSum += f.ttp * Math.max(gl, 0.1);
    totalFatG += (f.fat100 * grams) / 100;
    totalFiberG += m.soluble + m.insoluble;
  });

  const weightGlSum = plateFoods.reduce((s, f) => s + Math.max(portionInfo(f, mode, cg[f.id]).gl, 0.1), 0);
  const weightedTtp = weightGlSum > 0 ? ttpWeightedSum / weightGlSum : 60;
  const fatFiberRatio = (totalFatG + totalFiberG) / (totalCarb + 5);
  const bluntFactor = Math.max(0.55, 1 - 0.18 * fatFiberRatio);
  const delayBonus = (1 - bluntFactor) * 55;
  const pseudo = { ttp: weightedTtp + delayBonus, cat: totalFatG > totalCarb * 0.25 ? "fat" : "grain" };
  const curve = curvePoints(pseudo, totalGL * bluntFactor);

  const totalProteinG = macros.protein;
  const totalFatGAll = macros.satFat + macros.mono + macros.poly;
  const totalCarbG = totalCarb + macros.soluble + macros.insoluble;
  const totalCal = totalCarbG * 4 + totalProteinG * 4 + totalFatGAll * 9;

  const aminos = Object.fromEntries(AMINO_KEYS_ORDERED.map((k) => [k, 0]));
  plateFoods.forEach((f) => {
    const { grams } = portionInfo(f, mode, cg[f.id]);
    const a = aminoAcidsAtPortion(f, grams);
    AMINO_KEYS_ORDERED.forEach((k) => (aminos[k] += a[k]));
  });

  return {
    macros,
    micros,
    aminos,
    totalCarb,
    totalGL,
    ttp: Math.round(pseudo.ttp),
    curve,
    bluntFactor,
    totalCarbG,
    totalProteinG,
    totalFatG: totalFatGAll,
    totalCal,
  };
}

function buildShareText(selected, plateIds, mode, lang, customGrams) {
  const cg = customGrams || {};
  const t = (en, fa) => (lang === "fa" ? fa : en);
  const modeLabel = t(PORTION_MODES[mode].label, PORTION_MODES[mode].labelFa);
  const lines = [t("Glycemic comparison", "مقایسه گلایسمی"), `(${modeLabel})`, ""];
  selected.forEach((f) => {
    const { gl, carbsAtPortion, grams } = portionInfo(f, mode, cg[f.id]);
    const customTag = cg[f.id] != null ? ` [${round(grams)}g]` : "";
    lines.push(
      `${t(f.name, f.nameFa)}${customTag}: GI ${f.gi}, GL ${round(gl, 1)}, ${t("carbs", "کربوهیدرات")} ${round(carbsAtPortion)}g, ${t("peak", "اوج")} ${f.ttp}min`
    );
  });
  const plateFoods = selected.filter((f) => plateIds.includes(f.id));
  if (plateFoods.length > 1) {
    const plate = computePlate(plateFoods, mode, cg);
    lines.push("", `${t("Plate total", "جمع بشقاب")}: GL ${round(plate.totalGL, 1)}, ${t("carbs", "کربوهیدرات")} ${round(plate.totalCarb)}g, ${t("est. peak", "اوج تخمینی")} ${plate.ttp}min`);
  }
  if (typeof window !== "undefined" && /^https?:/.test(window.location.protocol)) {
    const url = new URL(window.location.href);
    url.searchParams.set("foods", selected.map((f) => f.id).join(","));
    url.searchParams.set("plate", plateIds.join(","));
    url.searchParams.set("mode", mode);
    url.searchParams.set("lang", lang);
    lines.push("", url.toString());
  }
  return lines.join("\n");
}

function copyText(text) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    return navigator.clipboard.writeText(text).catch(() => fallbackCopy(text));
  }
  return fallbackCopy(text);
}

function fallbackCopy(text) {
  return new Promise((resolve) => {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    try {
      document.execCommand("copy");
    } catch (e) {
      // ignore
    }
    document.body.removeChild(ta);
    resolve();
  });
}

function readInitialState() {
  if (typeof window === "undefined") return null;
  try {
    const params = new URLSearchParams(window.location.search);
    const foodsParam = params.get("foods");
    const modeParam = params.get("mode");
    const langParam = params.get("lang");
    const plateParam = params.get("plate");
    if (!foodsParam) return null;
    const ids = foodsParam.split(",").filter((id) => FOOD_BY_ID[id]).slice(0, MAX_SELECT);
    if (ids.length === 0) return null;
    const plateIds = plateParam ? plateParam.split(",").filter((id) => ids.includes(id)) : ids;
    return {
      ids,
      plateIds,
      mode: modeParam && PORTION_MODES[modeParam] ? modeParam : "fda",
      lang: langParam === "fa" ? "fa" : "en",
    };
  } catch (e) {
    return null;
  }
}

// A bigger pie with the gram amount written directly in each slice
// (no separate legend list beside it).
function NutrientPie({ values, size, lang, keysOrdered, colors, labels, minSlicePct }) {
  const canvasRef = useRef(null);
  const chartRef = useRef(null);
  const [, setTick] = useState(0);
  const readyRef = useRef(false);

  useEffect(() => {
    function bothReady() {
      return window.Chart && window.ChartDataLabels;
    }
    if (bothReady()) {
      readyRef.current = true;
      setTick((x) => x + 1);
      return;
    }
    const check = setInterval(() => {
      if (bothReady()) {
        readyRef.current = true;
        clearInterval(check);
        setTick((x) => x + 1);
      }
    }, 150);
    return () => clearInterval(check);
  }, []);

  useEffect(() => {
    if (!readyRef.current || !canvasRef.current) return;
    const t = (en, fa) => (lang === "fa" ? fa : en);
    const data = keysOrdered.map((k) => round(values[k], 1));
    const nonZero = data.some((v) => v > 0);
    const total = data.reduce((a, b) => a + b, 0) || 1;
    const threshold = minSlicePct != null ? minSlicePct : 0.045;

    if (chartRef.current) chartRef.current.destroy();
    // NOTE: the datalabels plugin self-registers globally once its script
    // loads after Chart.js — do NOT also pass a per-chart `plugins: [...]`
    // array here, or labels get drawn twice (slightly offset), which looks
    // like grams showing up in the wrong spot on the slice.
    chartRef.current = new window.Chart(canvasRef.current, {
      type: "pie",
      data: {
        labels: keysOrdered.map((k) => t(labels[k].en, labels[k].fa)),
        datasets: [
          {
            data: nonZero ? data : [1],
            backgroundColor: nonZero ? keysOrdered.map((k) => colors[k]) : ["#2a2c2d"],
            borderColor: "#0d0f10",
            borderWidth: 2,
          },
        ],
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        animation: false,
        plugins: {
          legend: { display: false },
          tooltip: {
            enabled: nonZero,
            titleColor: "#e8e6df",
            bodyColor: "#e8e6df",
            backgroundColor: "#16181a",
            borderColor: "#3a3d3e",
            borderWidth: 1,
            callbacks: { label: (ctx) => `${ctx.label}: ${ctx.parsed}g` },
          },
          datalabels: {
            anchor: "center",
            align: "center",
            clamp: true,
            color: "#f5f4f0",
            backgroundColor: "rgba(13,15,16,0.6)",
            borderRadius: 4,
            padding: { top: 2, bottom: 2, left: 4, right: 4 },
            font: { size: 10, weight: "600" },
            formatter: (value) => {
              if (!nonZero || value <= 0) return "";
              const pct = value / total;
              if (pct < threshold) return "";
              return `${round(value, value < 10 ? 1 : 0)}g`;
            },
          },
        },
      },
    });
    return () => chartRef.current && chartRef.current.destroy();
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [values, lang, readyRef.current]);

  return (
    <div style={{ width: size, height: size, margin: "0 auto" }}>
      <canvas ref={canvasRef} />
    </div>
  );
}

  // newest-selected food first
  const selected = useMemo(
    () => selectedIds.map((id) => FOOD_BY_ID[id]).filter(Boolean),
    [selectedIds]
  );

  const plateFoods = useMemo(() => selected.filter((f) => plateIds.includes(f.id)), [selected, plateIds]);

  // Browse-all list is grouped by macro dominance and independent of the
  // search box — it's a separate way to explore, not a filtered view.
  const browseGroups = useMemo(() => {
    const groups = { carb: [], protein: [], fat: [], mixed: [] };
    FOODS.forEach((f) => groups[macroGroup(f)].push(f));
    return groups;
  }, []);

  // Autocomplete suggestions for the search box (top N matches)
  const suggestions = useMemo(() => {
    const q = query.trim().toLowerCase();
    if (!q) return [];
    return FOODS.filter((f) => f.name.toLowerCase().includes(q) || f.nameFa.includes(query.trim())).slice(0, 8);
  }, [query]);

  function toggle(id) {
    setSelectedIds((prev) => {
      if (prev.includes(id)) {
        setPlateIds((p) => p.filter((x) => x !== id));
        return prev.filter((x) => x !== id);
      }
      const next = [id, ...prev];
      if (next.length > MAX_SELECT) {
        const dropped = next.pop();
        setPlateIds((p) => p.filter((x) => x !== dropped).concat(id));
      } else {
        setPlateIds((p) => [...p, id]);
      }
      return next;
    });
  }

  function togglePlateMembership(id) {
    setPlateIds((p) => (p.includes(id) ? p.filter((x) => x !== id) : [...p, id]));
  }

  function selectSuggestion(f) {
    toggle(f.id);
    setQuery("");
    setShowSuggestions(false);
    setActiveIndex(-1);
  }

  function handleSearchKeyDown(e) {
    if (!showSuggestions || suggestions.length === 0) return;
    if (e.key === "ArrowDown") {
      e.preventDefault();
      setActiveIndex((i) => (i + 1) % suggestions.length);
    } else if (e.key === "ArrowUp") {
      e.preventDefault();
      setActiveIndex((i) => (i - 1 + suggestions.length) % suggestions.length);
    } else if (e.key === "Enter") {
      e.preventDefault();
      const pick = suggestions[activeIndex] || suggestions[0];
      if (pick) selectSuggestion(pick);
    } else if (e.key === "Escape") {
      setShowSuggestions(false);
    }
  }

  function toggleDetails(id) {
    setOpenDetails((o) => ({ ...o, [id]: !o[id] }));
  }

  function swapFood(oldId, newId) {
    if (oldId === newId || !FOOD_BY_ID[newId]) {
      setSwapOpenId(null);
      return;
    }
    setSelectedIds((prev) => prev.map((id) => (id === oldId ? newId : id)));
    setPlateIds((prev) => prev.map((id) => (id === oldId ? newId : id)));
    setCustomGrams((prev) => {
      if (!(oldId in prev)) return prev;
      const next = { ...prev };
      next[newId] = next[oldId];
      delete next[oldId];
      return next;
    });
    setOpenDetails((prev) => {
      if (!(oldId in prev)) return prev;
      const next = { ...prev };
      next[newId] = next[oldId];
      delete next[oldId];
      return next;
    });
    setSwapOpenId(null);
    setSwapQuery("");
  }

  function applyPreset(preset) {
    // presets are allowed to exceed MAX_SELECT — a dish's real ingredient
    // list shouldn't be truncated just to fit the manual-pick cap
    setSelectedIds(preset.foods);
    setPlateIds(preset.foods);
  }

  useEffect(() => {
    if (typeof window === "undefined" || !/^https?:/.test(window.location.protocol)) return;
    try {
      const url = new URL(window.location.href);
      url.searchParams.set("foods", selectedIds.join(","));
      url.searchParams.set("plate", plateIds.join(","));
      url.searchParams.set("mode", mode);
      url.searchParams.set("lang", lang);
      window.history.replaceState({}, "", url.toString());
    } catch (e) {
      // ignore
    }
  }, [selectedIds, plateIds, mode, lang]);

  async function handleShare() {
    const text = buildShareText(selected, plateIds, mode, lang, customGrams);
    await copyText(text);
    setShareStatus("copied");
    setTimeout(() => setShareStatus("idle"), 2000);
  }

  function startTour() {
    setPresetsOpen(false);
    setBrowseOpen(false);
    setTourStep(0);
  }

  useEffect(() => {
    if (tourStep < 0) return;
    const step = TOUR_STEPS[tourStep];
    if (!step) return;
    const el = document.getElementById(step.id);
    if (!el) {
      setTourRect(null);
      return;
    }
    el.scrollIntoView({ behavior: "smooth", block: "center" });
    const measure = () => {
      const r = el.getBoundingClientRect();
      setTourRect({ top: r.top, left: r.left, width: r.width, height: r.height });
    };
    const timer = setTimeout(measure, 320);
    window.addEventListener("resize", measure);
    return () => {
      clearTimeout(timer);
      window.removeEventListener("resize", measure);
    };
  }, [tourStep]);

  function setGramsFor(id, grams) {
    setCustomGrams((prev) => ({ ...prev, [id]: grams }));
  }
  function resetGramsFor(id) {
    setCustomGrams((prev) => {
      const next = { ...prev };
      delete next[id];
      return next;
    });
  }

  // Load Chart.js + the datalabels plugin (for in-slice gram labels)
  useEffect(() => {
    function ready() {
      chartJsLoaded.current = true;
      setTick((x) => x + 1);
    }
    if (window.Chart && window.ChartDataLabels) {
      ready();
      return;
    }
    const s1 = document.createElement("script");
    s1.src = "https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js";
    s1.onload = () => {
      const s2 = document.createElement("script");
      s2.src = "https://cdnjs.cloudflare.com/ajax/libs/chartjs-plugin-datalabels/2.2.0/chartjs-plugin-datalabels.min.js";
      s2.onload = ready;
      document.body.appendChild(s2);
    };
    document.body.appendChild(s1);
  }, []);

  // Response curve chart
  useEffect(() => {
    if (!chartJsLoaded.current || !window.Chart || !canvasRef.current) return;
    const labels = [];
    for (let tt = 0; tt <= 200; tt += 5) labels.push(tt);

    const datasets = selected.map((f) => {
      const { gl } = portionInfo(f, mode, customGrams[f.id]);
      return {
        label: lang === "fa" ? f.nameFa : f.name,
        data: curvePoints(f, gl),
        borderColor: f.color,
        backgroundColor: "transparent",
        borderWidth: 2.5,
        pointRadius: 0,
        tension: 0.3,
      };
    });

    if (chartRef.current) chartRef.current.destroy();
    chartRef.current = new window.Chart(canvasRef.current, {
      type: "line",
      data: { labels, datasets },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        interaction: { mode: "index", intersect: false },
        plugins: {
          legend: { display: true, labels: { color: "#c7c5bc", font: { size: 12 }, usePointStyle: true, boxWidth: 8 } },
          tooltip: { titleColor: "#e8e6df", bodyColor: "#e8e6df", backgroundColor: "#16181a", borderColor: "#3a3d3e", borderWidth: 1 },
          datalabels: { display: false },
        },
        scales: {
          x: {
            title: { display: true, text: t("minutes after eating", "دقیقه پس از خوردن"), color: "#8a8f8f" },
            ticks: { color: "#797d7d", maxTicksLimit: 9 },
            grid: { color: "#222425" },
          },
          y: {
            title: { display: true, text: t("blood glucose rise", "افزایش قند خون"), color: "#8a8f8f" },
            ticks: { color: "#797d7d" },
            grid: { color: "#222425" },
            beginAtZero: true,
          },
        },
      },
    });
    return () => chartRef.current && chartRef.current.destroy();
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [selected, lang, mode, customGrams, chartJsLoaded.current]);

  const plate = useMemo(() => (plateFoods.length > 0 ? computePlate(plateFoods, mode, customGrams) : null), [plateFoods, mode, customGrams]);

  // Plate response curve
  useEffect(() => {
    if (!chartJsLoaded.current || !window.Chart || !plateCanvasRef.current || !plate) return;
    const labels = [];
    for (let tt = 0; tt <= 200; tt += 5) labels.push(tt);

    if (plateChartRef.current) plateChartRef.current.destroy();
    plateChartRef.current = new window.Chart(plateCanvasRef.current, {
      type: "line",
      data: {
        labels,
        datasets: [
          {
            label: t("Whole plate", "کل بشقاب"),
            data: plate.curve,
            borderColor: "#e8e6df",
            backgroundColor: "rgba(232,230,223,0.08)",
            fill: true,
            borderWidth: 2.5,
            pointRadius: 0,
            tension: 0.3,
          },
        ],
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: { display: false },
          tooltip: { titleColor: "#e8e6df", bodyColor: "#e8e6df", backgroundColor: "#16181a", borderColor: "#3a3d3e", borderWidth: 1 },
          datalabels: { display: false },
        },
        scales: {
          x: {
            title: { display: true, text: t("minutes after eating", "دقیقه پس از خوردن"), color: "#8a8f8f" },
            ticks: { color: "#797d7d", maxTicksLimit: 9 },
            grid: { color: "#222425" },
          },
          y: {
            title: { display: true, text: t("blood glucose rise", "افزایش قند خون"), color: "#8a8f8f" },
            ticks: { color: "#797d7d" },
            grid: { color: "#222425" },
            beginAtZero: true,
          },
        },
      },
    });
    return () => plateChartRef.current && plateChartRef.current.destroy();
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [plate, lang, chartJsLoaded.current]);

  return (
    <div
      dir={lang === "fa" ? "rtl" : "ltr"}
      style={{
        fontFamily: "var(--font-sans)",
        background: "#0d0f10",
        color: "#e8e6df",
        borderRadius: 14,
        overflow: "hidden",
        border: "0.5px solid #2a2c2d",
        display: "flex",
        flexDirection: "column",
        width: "100%",
      }}
    >
      {/* Search + menu */}
      <div style={{ borderBottom: "0.5px solid #2a2c2d", padding: "16px 14px", display: "flex", flexDirection: "column", gap: 14, overflowY: "auto" }}>
        <div style={{ display: "flex", gap: 8, alignItems: "flex-start" }}>
          <div id="tour-search" style={{ position: "relative", flex: 1 }}>
            <input
              value={query}
              onChange={(e) => {
                setQuery(e.target.value);
                setShowSuggestions(true);
                setActiveIndex(0);
              }}
              onFocus={() => query && setShowSuggestions(true)}
              onBlur={() => setTimeout(() => setShowSuggestions(false), 120)}
              onKeyDown={handleSearchKeyDown}
              placeholder={t("Search foods (e.g. \"onion\")...", "جست‌وجوی خوراکی (مثلا «پیاز»)...")}
              style={{ width: "100%", background: "#16181a", border: "0.5px solid #3a3d3e", color: "#e8e6df", borderRadius: 10, padding: "12px 12px", fontSize: 15, minHeight: 44 }}
            />
            {showSuggestions && suggestions.length > 0 && (
              <div
                style={{
                  position: "absolute",
                  top: "calc(100% + 4px)",
                  left: 0,
                  right: 0,
                  background: "#16181a",
                  border: "0.5px solid #3a3d3e",
                  borderRadius: 8,
                  overflow: "hidden",
                  zIndex: 20,
                  boxShadow: "0 6px 16px rgba(0,0,0,0.4)",
                }}
              >
                {suggestions.map((f, i) => (
                  <div
                    key={f.id}
                    onMouseDown={(e) => {
                      e.preventDefault();
                      selectSuggestion(f);
                    }}
                    onMouseEnter={() => setActiveIndex(i)}
                    style={{
                      display: "flex",
                      alignItems: "center",
                      gap: 8,
                      padding: "12px 12px",
                      cursor: "pointer",
                      background: i === activeIndex ? "#1c2b25" : "transparent",
                      fontSize: 14,
                      minHeight: 44,
                    }}
                  >
                    <span style={{ width: 8, height: 8, borderRadius: "50%", background: f.color, flexShrink: 0 }} />
                    <span style={{ flex: 1 }}>{t(f.name, f.nameFa)}</span>
                    {selectedIds.includes(f.id) && <span style={{ fontSize: 11, color: "#8a8f8f" }}>✓</span>}
                  </div>
                ))}
              </div>
            )}
          </div>

          <div style={{ position: "relative" }}>
            <button
              id="tour-menu"
              onClick={() => setMenuOpen((o) => !o)}
              aria-label={t("Settings", "تنظیمات")}
              style={{
                background: menuOpen ? "#1c2b25" : "#16181a",
                border: `0.5px solid ${menuOpen ? "#1d9e75" : "#3a3d3e"}`,
                color: "#e8e6df",
                borderRadius: 8,
                width: 44,
                height: 44,
                fontSize: 18,
                cursor: "pointer",
                flexShrink: 0,
              }}
            >
              ☰
            </button>
          </div>
        </div>

        <div id="tour-preset-browse" style={{ display: "flex", gap: 8 }}>
          <button
            onClick={() => {
              setPresetsOpen((o) => !o);
              setBrowseOpen(false);
            }}
            style={{
              flex: 1,
              display: "flex",
              alignItems: "center",
              justifyContent: "center",
              gap: 6,
              background: presetsOpen ? "#1c2b25" : "#1a1c1d",
              border: `0.5px solid ${presetsOpen ? "#1d9e75" : "#3a3d3e"}`,
              color: presetsOpen ? "#8fd9bb" : "#c7c5bc",
              borderRadius: 8,
              padding: "11px 10px",
              fontSize: 12.5,
              fontWeight: 500,
              cursor: "pointer",
              minHeight: 40,
            }}
          >
            🍽️ {t("Preset plates", "بشقاب‌های آماده")}
          </button>
          <button
            onClick={() => {
              setBrowseOpen((o) => !o);
              setPresetsOpen(false);
            }}
            style={{
              flex: 1,
              display: "flex",
              alignItems: "center",
              justifyContent: "center",
              gap: 6,
              background: browseOpen ? "#1c2b25" : "#1a1c1d",
              border: `0.5px solid ${browseOpen ? "#1d9e75" : "#3a3d3e"}`,
              color: browseOpen ? "#8fd9bb" : "#c7c5bc",
              borderRadius: 8,
              padding: "11px 10px",
              fontSize: 12.5,
              fontWeight: 500,
              cursor: "pointer",
              minHeight: 40,
            }}
          >
            📋 {t("Ingredients list", "فهرست مواد غذایی")}
          </button>
        </div>

        {presetsOpen && (
          <div style={{ display: "flex", flexDirection: "column", gap: 4 }}>
            {PLATE_PRESETS.map((p) => (
              <button
                key={p.id}
                onClick={() => applyPreset(p)}
                style={{
                  textAlign: lang === "fa" ? "right" : "left",
                  background: "transparent",
                  border: "0.5px solid #2a2c2d",
                  color: "#c7c5bc",
                  borderRadius: 8,
                  padding: "10px 10px",
                  fontSize: 13,
                  cursor: "pointer",
                  minHeight: 40,
                }}
              >
                {t(p.label, p.labelFa)}
              </button>
            ))}
          </div>
        )}

        {browseOpen && (
          <div style={{ display: "flex", flexDirection: "column", gap: 10, maxHeight: 380, overflowY: "auto" }}>
            {Object.entries(MACRO_GROUPS).map(([gk, gm]) => {
              const items = browseGroups[gk] || [];
              if (items.length === 0) return null;
              return (
                <div key={gk}>
                  <div style={{ fontSize: 10.5, letterSpacing: "0.06em", color: "#6f7373", textTransform: "uppercase", margin: "4px 2px" }}>
                    {t(gm.label, gm.labelFa)}
                  </div>
                  <div style={{ display: "flex", flexDirection: "column", gap: 3 }}>
                    {items.map((f) => {
                      const isSel = selectedIds.includes(f.id);
                      return (
                        <button
                          key={f.id}
                          onClick={() => toggle(f.id)}
                          style={{
                            display: "flex",
                            alignItems: "center",
                            gap: 8,
                            textAlign: lang === "fa" ? "right" : "left",
                            background: isSel ? "#1c1f21" : "transparent",
                            border: isSel ? `0.5px solid ${f.color}` : "0.5px solid transparent",
                            borderRadius: 8,
                            padding: "10px 10px",
                            cursor: "pointer",
                            color: "#e8e6df",
                            fontSize: 13.5,
                            minHeight: 40,
                          }}
                        >
                          <span style={{ width: 8, height: 8, borderRadius: "50%", background: f.color, flexShrink: 0 }} />
                          <span style={{ flex: 1 }}>{t(f.name, f.nameFa)}</span>
                          {isSel && <span style={{ fontSize: 11, color: "#8a8f8f" }}>✓</span>}
                        </button>
                      );
                    })}
                  </div>
                </div>
              );
            })}
          </div>
        )}
      </div>

      {/* Main */}
      <div style={{ padding: "14px 12px", display: "flex", flexDirection: "column", gap: 16, minWidth: 0 }}>
        {selected.length === 0 ? (
          <div style={{ color: "#8a8f8f", fontSize: 13, padding: "40px 0", textAlign: "center" }}>
            {t(`Select up to ${MAX_SELECT} foods to compare their glucose response.`, `برای مقایسه، حداکثر ${MAX_SELECT} خوراکی انتخاب کنید.`)}
          </div>
        ) : (
          <>
            <div id="tour-first-card">
              <FoodCard
                food={selected[0]}
                mode={mode}
                customGrams={customGrams}
                plateIds={plateIds}
                openDetails={openDetails}
                lang={lang}
                setGramsFor={setGramsFor}
                resetGramsFor={resetGramsFor}
                togglePlateMembership={togglePlateMembership}
                toggleDetails={toggleDetails}
                pieSize={140}
                swapOpenId={swapOpenId}
                setSwapOpenId={setSwapOpenId}
                swapQuery={swapQuery}
                setSwapQuery={setSwapQuery}
                onSwapFood={swapFood}
              />
            </div>

            <div id="tour-chart">
              <div style={{ fontSize: 11, letterSpacing: "0.06em", color: "#6f7373", textTransform: "uppercase", marginBottom: 6 }}>
                {t("Individual glucose response", "پاسخ قندی هر خوراکی")}
              </div>
              <div style={{ position: "relative", height: 260 }}>
                <canvas ref={canvasRef} />
              </div>
            </div>

            {selected.length > 1 && (
              <div style={{ display: "grid", gridTemplateColumns: "1fr", gap: 12 }}>
                {selected.slice(1).map((f) => (
                  <FoodCard
                    key={f.id}
                    food={f}
                    mode={mode}
                    customGrams={customGrams}
                    plateIds={plateIds}
                    openDetails={openDetails}
                    lang={lang}
                    setGramsFor={setGramsFor}
                    resetGramsFor={resetGramsFor}
                    togglePlateMembership={togglePlateMembership}
                    toggleDetails={toggleDetails}
                    pieSize={140}
                    swapOpenId={swapOpenId}
                    setSwapOpenId={setSwapOpenId}
                    swapQuery={swapQuery}
                    setSwapQuery={setSwapQuery}
                    onSwapFood={swapFood}
                  />
                ))}
              </div>
            )}

            <div id="tour-plate" style={{ borderTop: "0.5px solid #2a2c2d", paddingTop: 16, marginTop: 4 }}>
              <div style={{ fontSize: 11, letterSpacing: "0.06em", color: "#6f7373", textTransform: "uppercase", marginBottom: 2 }}>
                {t("Meal plate", "بشقاب غذا")}
              </div>
              {plateFoods.length === 0 ? (
                <div style={{ fontSize: 12.5, color: "#8a8f8f" }}>
                  {t('No foods checked "in plate" — tick at least one food above to build a plate.', 'هیچ خوراکی‌ای در «در بشقاب» تیک نخورده — حداقل یکی را از بالا انتخاب کنید.')}
                </div>
              ) : (
                <>
                  <div style={{ fontSize: 13, fontWeight: 500, marginBottom: 4 }}>
                    {t("Combined response of your checked foods eaten together", "پاسخ ترکیبی خوراکی‌های تیک‌خورده در صورت خوردن با هم")}
                  </div>
                  <div style={{ fontSize: 11.5, color: "#8a8f8f", marginBottom: 12, lineHeight: 1.6 }}>
                    {plateFoods.map((f) => t(f.name, f.nameFa)).join(" + ")}
                    {" — "}
                    {t(
                      "combined, not averaged: total glycemic load adds up, while fat and fiber blunt and delay the peak.",
                      "ترکیبی، نه میانگین: بار گلایسمی کل جمع می‌شود، در حالی که چربی و فیبر اوج را کند و به‌تأخیر می‌اندازند."
                    )}
                  </div>

                  <div style={{ display: "grid", gridTemplateColumns: "1fr", gap: 16, alignItems: "start" }}>
                    <div>
                      <div style={{ position: "relative", height: 240 }}>
                        <canvas ref={plateCanvasRef} />
                      </div>
                      <div style={{ display: "flex", gap: 16, marginTop: 10, flexWrap: "wrap" }}>
                        <Row label={t("Plate glycemic load", "بار گلایسمی بشقاب")} value={round(plate.totalGL, 1)} />
                        <Row label={t("Available carbs (for GI/GL)", "کربوهیدرات قابل‌جذب (برای GI/GL)")} value={`${round(plate.totalCarb)}g`} />
                        <Row label={t("Estimated peak", "اوج تخمینی")} value={`${plate.ttp} min`} />
                      </div>
                    </div>
                    <div style={{ background: "#16181a", border: "0.5px solid #2a2c2d", borderRadius: 12, padding: 14 }}>
                      <div style={{ fontSize: 12.5, fontWeight: 500, marginBottom: 8, textAlign: "center" }}>
                        {t("Plate macronutrients", "درشت‌مغذی‌های بشقاب")}
                      </div>
                      <div style={{ display: "flex", alignItems: "center", justifyContent: "center", gap: 14, flexWrap: "wrap" }}>
                        <MacroPie macros={plate.macros} size={170} lang={lang} />
                        <MacroTotals macros={plate.macros} lang={lang} />
                      </div>
                    </div>
                  </div>

                  <Collapsible
                    open={plateInfoOpen}
                    onToggle={() => setPlateInfoOpen((o) => !o)}
                    showLabel={t("Show more nutrition info", "نمایش اطلاعات تغذیه‌ای بیشتر")}
                    hideLabel={t("Hide extra nutrition info", "پنهان کردن اطلاعات اضافی")}
                  >
                    <div style={{ display: "grid", gridTemplateColumns: "1fr", gap: 12, marginTop: 8 }}>
                      <div style={{ background: "#16181a", border: "0.5px solid #2a2c2d", borderRadius: 12, padding: 14 }}>
                        <div style={{ fontSize: 12, fontWeight: 500, marginBottom: 8 }}>{t("Macronutrients", "درشت‌مغذی‌ها")}</div>
                        <Row label={t("Total carbohydrate", "کل کربوهیدرات")} value={`${round(plate.totalCarbG)}g`} />
                        <div style={{ paddingInlineStart: 12 }}>
                          <Row label={t("– sugars", "– قندها")} value={`${round(plate.macros.sugar)}g`} />
                          <Row label={t("– starch", "– نشاسته")} value={`${round(plate.macros.starch)}g`} />
                          <Row label={t("– fiber", "– فیبر")} value={`${round(plate.macros.soluble + plate.macros.insoluble)}g`} />
                        </div>
                        <Row label={t("Protein", "پروتئین")} value={`${round(plate.totalProteinG)}g`} />
                        <Row label={t("Fat", "چربی")} value={`${round(plate.totalFatG)}g`} />
                        <Row label={t("Estimated calories", "کالری تخمینی")} value={`${round(plate.totalCal)} kcal`} />
                      </div>
                      <div style={{ background: "#16181a", border: "0.5px solid #2a2c2d", borderRadius: 12, padding: 14 }}>
                        <div style={{ fontSize: 12, fontWeight: 500, marginBottom: 8 }}>{t("Micronutrients (approx.)", "ریزمغذی‌ها (تقریبی)")}</div>
                        {MICRO_KEYS_ORDERED.map((k) => (
                          <MicroRow key={k} label={t(MICRO_LABELS[k].en, MICRO_LABELS[k].fa)} value={plate.micros[k]} unit={MICRO_LABELS[k].unit} dvPct={microDvPct(k, plate.micros[k])} />
                        ))}
                      </div>
                    </div>
                    {plate.totalProteinG >= 0.5 && (
                      <div style={{ marginTop: 12 }}>
                        <Collapsible
                          open={plateAminoOpen}
                          onToggle={() => setPlateAminoOpen((o) => !o)}
                          showLabel={t("Show plate amino acid profile", "نمایش نمایه اسیدهای آمینه بشقاب")}
                          hideLabel={t("Hide amino acid profile", "پنهان کردن نمایه اسیدهای آمینه")}
                        >
                          <div style={{ background: "#16181a", border: "0.5px solid #2a2c2d", borderRadius: 12, padding: 14 }}>
                            <div style={{ fontSize: 11, color: "#797d7d", marginBottom: 8, lineHeight: 1.5 }}>
                              {t(
                                "Combined estimate from each food's typical protein-source pattern, not lab-measured.",
                                "برآورد ترکیبی بر اساس الگوی معمول منبع پروتئین هر خوراکی، نه اندازه‌گیری آزمایشگاهی."
                              )}
                            </div>
                            <AminoPie aminos={plate.aminos} size={160} lang={lang} />
                          </div>
                        </Collapsible>
                      </div>
                    )}
                  </Collapsible>
                </>
              )}
            </div>
          </>
        )}
      </div>

      {menuOpen && (
        <div
          style={{
            position: "absolute",
            inset: 0,
            background: "rgba(10,11,12,0.96)",
            zIndex: 40,
            display: "flex",
            flexDirection: "column",
            padding: 18,
            overflowY: "auto",
          }}
        >
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 18 }}>
            <div style={{ fontSize: 16, fontWeight: 500 }}>{t("Settings", "تنظیمات")}</div>
            <button
              onClick={() => setMenuOpen(false)}
              aria-label={t("Close", "بستن")}
              style={{ background: "transparent", border: "0.5px solid #3a3d3e", color: "#e8e6df", borderRadius: 8, width: 40, height: 40, fontSize: 16, cursor: "pointer" }}
            >
              ✕
            </button>
          </div>

          <div style={{ width: "100%" }}>
            <div style={{ marginBottom: 18 }}>
              <div style={{ fontSize: 12.5, color: "#8a8f8f", marginBottom: 8 }}>🌐 {t("Language", "زبان")}</div>
              <button
                onClick={() => setLang((l) => (l === "en" ? "fa" : "en"))}
                style={{ background: "transparent", border: "0.5px solid #3a3d3e", color: "#e8e6df", borderRadius: 10, padding: "11px 10px", fontSize: 14, cursor: "pointer", width: "100%", minHeight: 44 }}
              >
                {t("فارسی", "English")}
              </button>
            </div>

            <div style={{ marginBottom: 18 }}>
              <div style={{ fontSize: 12.5, color: "#8a8f8f", marginBottom: 8 }}>⚖️ {t("Portion", "مقدار مصرف")}</div>
              <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
                {Object.entries(PORTION_MODES).map(([k, m]) => (
                  <button
                    key={k}
                    onClick={() => setMode(k)}
                    style={{
                      flex: "1 1 auto",
                      textAlign: "center",
                      background: mode === k ? "#1c2b25" : "transparent",
                      border: mode === k ? "0.5px solid #1d9e75" : "0.5px solid #2a2c2d",
                      color: "#e8e6df",
                      borderRadius: 10,
                      padding: "11px 8px",
                      fontSize: 12.5,
                      cursor: "pointer",
                      minHeight: 44,
                    }}
                  >
                    {t(m.label, m.labelFa)}
                  </button>
                ))}
              </div>
            </div>
            {mode === "50c" && (
              <div style={{ fontSize: 11, color: "#797d7d", marginBottom: 18, lineHeight: 1.5 }}>
                {t(
                  "Standard GI test dose — GL always equals GI ÷ 2 at 50g carbs.",
                  "دوز استاندارد آزمایش شاخص گلایسمی — بار گلایسمی همیشه برابر شاخص تقسیم بر ۲ است."
                )}
              </div>
            )}

            <div style={{ borderTop: "0.5px solid #2a2c2d", paddingTop: 14, marginBottom: 18 }}>
              <div style={{ fontSize: 12.5, color: "#8a8f8f", marginBottom: 10 }}>🎨 {t("Pie color guide", "راهنمای رنگ نمودار دایره‌ای")}</div>
              <ColorLegend lang={lang} />
            </div>

            <div style={{ display: "flex", flexDirection: "column", gap: 8, borderTop: "0.5px solid #2a2c2d", paddingTop: 14 }}>
              <button
                onClick={() => {
                  setMenuOpen(false);
                  handleShare();
                }}
                style={{
                  display: "flex",
                  alignItems: "center",
                  gap: 8,
                  background: shareStatus === "copied" ? "#1c2b25" : "transparent",
                  border: `0.5px solid ${shareStatus === "copied" ? "#1d9e75" : "#3a3d3e"}`,
                  color: "#e8e6df",
                  borderRadius: 10,
                  padding: "12px 12px",
                  fontSize: 14,
                  cursor: "pointer",
                  textAlign: lang === "fa" ? "right" : "left",
                  minHeight: 44,
                }}
              >
                🔗 {shareStatus === "copied" ? t("Copied!", "کپی شد!") : t("Share comparison", "اشتراک‌گذاری مقایسه")}
              </button>
              <button
                onClick={() => {
                  setMenuOpen(false);
                  startTour();
                }}
                style={{
                  display: "flex",
                  alignItems: "center",
                  gap: 8,
                  background: "transparent",
                  border: "0.5px solid #3a3d3e",
                  color: "#e8e6df",
                  borderRadius: 10,
                  padding: "12px 12px",
                  fontSize: 14,
                  cursor: "pointer",
                  textAlign: lang === "fa" ? "right" : "left",
                  minHeight: 44,
                }}
              >
                🧭 {t("Guide me", "راهنمای من")}
              </button>
            </div>
          </div>
        </div>
      )}


      {tourStep >= 0 && (() => {
        const step = TOUR_STEPS[tourStep];
        const vw = typeof window !== "undefined" ? window.innerWidth : 1024;
        const vh = typeof window !== "undefined" ? window.innerHeight : 768;
        const tipWidth = step.colorLegend ? 320 : 280;
        let tipStyle;
        if (tourRect) {
          const spaceBelow = vh - (tourRect.top + tourRect.height);
          const top = spaceBelow > 200 ? tourRect.top + tourRect.height + 14 : Math.max(12, tourRect.top - 190);
          const left = Math.max(12, Math.min(tourRect.left, vw - tipWidth - 12));
          tipStyle = { top, left };
        } else {
          tipStyle = { top: "40%", left: "50%", transform: "translate(-50%, -50%)" };
        }
        return (
          <div style={{ position: "fixed", inset: 0, zIndex: 1000 }}>
            {tourRect ? (
              <div
                style={{
                  position: "fixed",
                  top: tourRect.top - 6,
                  left: tourRect.left - 6,
                  width: tourRect.width + 12,
                  height: tourRect.height + 12,
                  borderRadius: 10,
                  border: "2px solid #1d9e75",
                  boxShadow: "0 0 0 9999px rgba(0,0,0,0.75)",
                  pointerEvents: "none",
                  transition: "top 0.2s ease, left 0.2s ease, width 0.2s ease, height 0.2s ease",
                }}
              />
            ) : (
              <div style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.75)" }} />
            )}
            <div
              dir={lang === "fa" ? "rtl" : "ltr"}
              style={{
                position: "fixed",
                ...tipStyle,
                width: tipWidth,
                background: "#16181a",
                border: "0.5px solid #3a3d3e",
                borderRadius: 12,
                padding: 16,
                fontFamily: "var(--font-sans)",
                color: "#e8e6df",
                boxShadow: "0 10px 24px rgba(0,0,0,0.5)",
              }}
            >
              <div style={{ fontSize: 11, color: "#8a8f8f", marginBottom: 4 }}>
                {tourStep + 1} / {TOUR_STEPS.length}
              </div>
              <div style={{ fontSize: 14, fontWeight: 500, marginBottom: 6 }}>{t(step.title.en, step.title.fa)}</div>
              <div style={{ fontSize: 12.5, color: "#c7c5bc", lineHeight: 1.6, marginBottom: 14 }}>{t(step.text.en, step.text.fa)}</div>
              {step.colorLegend && (
                <div style={{ marginBottom: 14, padding: "10px 0", borderTop: "0.5px solid #2a2c2d", borderBottom: "0.5px solid #2a2c2d" }}>
                  <ColorLegend lang={lang} compact />
                </div>
              )}
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", gap: 8 }}>
                <button
                  onClick={() => setTourStep(-1)}
                  style={{ background: "transparent", border: "none", color: "#8a8f8f", fontSize: 12, cursor: "pointer", padding: "6px 4px" }}
                >
                  {t("Skip", "رد شدن")}
                </button>
                <div style={{ display: "flex", gap: 8 }}>
                  {tourStep > 0 && (
                    <button
                      onClick={() => setTourStep((s) => s - 1)}
                      style={{ background: "transparent", border: "0.5px solid #3a3d3e", color: "#e8e6df", borderRadius: 8, padding: "6px 12px", fontSize: 12.5, cursor: "pointer" }}
                    >
                      {t("Back", "قبلی")}
                    </button>
                  )}
                  <button
                    onClick={() => (tourStep === TOUR_STEPS.length - 1 ? setTourStep(-1) : setTourStep((s) => s + 1))}
                    style={{ background: "#1c2b25", border: "0.5px solid #1d9e75", color: "#8fd9bb", borderRadius: 8, padding: "6px 12px", fontSize: 12.5, cursor: "pointer", fontWeight: 500 }}
                  >
                    {tourStep === TOUR_STEPS.length - 1 ? t("Done", "پایان") : t("Next", "بعدی")}
                  </button>
                </div>
              </div>
            </div>
          </div>
        );
      })()}
    </div>
  );
}

function Row({ label, value }) {
  return (
    <div style={{ display: "flex", justifyContent: "space-between", gap: 8, fontSize: 12.5, padding: "3px 0" }}>
      <span style={{ color: "#8a8f8f" }}>{label}</span>
      <span style={{ fontWeight: 500 }}>{value}</span>
    </div>
  );
}

function MicroRow({ label, value, unit, dvPct }) {
  return (
    <div style={{ display: "flex", justifyContent: "space-between", gap: 8, fontSize: 12.5, padding: "3px 0" }}>
      <span style={{ color: "#8a8f8f" }}>{label}</span>
      <span style={{ fontWeight: 500 }}>
        {round(value, value < 10 ? 1 : 0)} {unit}
        <span style={{ color: "#6f7373", fontWeight: 400 }}> · {dvPct}% DV</span>
      </span>
    </div>
  );
}

function Advice({ label, text }) {
  return (
    <div style={{ marginTop: 8, borderTop: "0.5px solid #2a2c2d", paddingTop: 8 }}>
      <div style={{ fontSize: 10.5, letterSpacing: "0.04em", color: "#6f7373", textTransform: "uppercase", marginBottom: 2 }}>{label}</div>
      <div style={{ fontSize: 12, color: "#c7c5bc", lineHeight: 1.6 }}>{text}</div>
    </div>
  );
}


const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<Compare />);
</script>
</body>
</html>

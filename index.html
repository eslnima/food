// ---------------------------------------------------------------------------
// Data notes:
// gi                  glycemic index (0-100, glucose=100), portion-independent
// carbs100            grams of AVAILABLE carbohydrate (starch+sugar, excl. fiber) per 100g
// sugar100            grams of sugar per 100g (subset of carbs100)
// fiber100            grams of total fiber per 100g (soluble100 + insoluble100)
// soluble100/insoluble100  fiber subtypes per 100g
// protein100, fat100  grams per 100g
// satFat100           grams of saturated fat per 100g
// mono100/poly100     grams of mono/polyunsaturated fat per 100g (mono100+poly100 = unsaturated fat)
// sodium100/potassium100/calcium100/iron100 (mg per 100g), vitC100 (mg per 100g)
// fdaG                typical FDA-style reference serving, in grams (or ml for drinks)
// ttp                 estimated time-to-peak blood glucose response, minutes
// All values are illustrative approximations from published GI tables and
// typical nutrition-label data (including composite/mixed dishes, which don't
// have a single lab-tested GI — those are the roughest estimates here).

// A "look this up" link for the food, since this app's own numbers are
// estimates, not lab measurements. Uses a hardcoded direct Wikipedia link
// where one is confidently known (see FOOD_REFERENCE_URLS above);
// otherwise falls back to a scoped USDA FoodData Central search (the
// standard reference this app's simple-ingredient nutrition figures are
// broadly modeled on) rather than guessing at a specific record that may
// not exist or may not match. Always resolves to *something*, even for
// composite dishes without a clean single match — "when possible" here
// means "a real, working link", not "a guaranteed exact record".
function foodSourceUrl(food) {
  if (FOOD_REFERENCE_URLS[food.id]) return FOOD_REFERENCE_URLS[food.id];
  const q = encodeURIComponent(`${food.name} site:fdc.nal.usda.gov`);
  return `https://www.google.com/search?q=${q}`;
}

// Golden-angle hue distribution so every food gets a visually distinct color
// on the response chart, independent of category.
let FOODS = null;
let FOOD_BY_ID = null;

// Called once, right after foods.json resolves (see the bootstrap at the
// bottom of this file). Kept as a plain function rather than inline
// top-level consts so this file has no working food database on its own
// until real data is supplied at runtime.
function buildFoodIndexes(rawFoods) {
  RAW_FOODS = rawFoods;
  FOODS = rawFoods.map((f, i) => ({
    ...f,
    color: `hsl(${Math.round((i * 137.508) % 360)}, 68%, 56%)`,
  }));
  FOOD_BY_ID = Object.fromEntries(FOODS.map((f) => [f.id, f]));
}

// ---------------------------------------------------------------------------
// Natural-language plate commands typed into the search box, e.g.
// "combine Russian olive, Jujube and hemp into a plate". Deliberately
// requires BOTH an action verb (combine/add/make/mix/...) AND a "plate"-ish
// word (plate/meal/dish/bowl, or their Farsi equivalents) to appear
// somewhere in the text before treating it as a command at all — this is
// what keeps an ordinary food search like "chicken and rice" from ever
// being misread as a command.
// ---------------------------------------------------------------------------
const PLATE_COMMAND_VERB_RE = /\b(combine|add|make|create|build|assemble|put|mix|prepare|gather|compose|form|load|fill|arrange|stack|toss|set(?:\s+up)?)\b/i;
const PLATE_COMMAND_FA_VERB_RE = /ترکیب|اضافه|بساز|درست|بریز|بذار|بگذار|آماده|جمع/;
const PLATE_COMMAND_PLATE_RE = /\b(plate|meal|dish|bowl)\b/i;
const PLATE_COMMAND_FA_PLATE_RE = /بشقاب|وعده|کاسه|ظرف/;

function parsePlateCommand(rawText) {
  let text = (rawText || "").trim();
  if (!text) return null;
  const hasVerb = PLATE_COMMAND_VERB_RE.test(text) || PLATE_COMMAND_FA_VERB_RE.test(text);
  const hasPlateWord = PLATE_COMMAND_PLATE_RE.test(text) || PLATE_COMMAND_FA_PLATE_RE.test(text);
  if (!hasVerb || !hasPlateWord) return null;

  // Peel off a leading verb phrase ("combine ", "add ", "please mix ", "set up ", ...)
  text = text.replace(/^\s*(please\s+)?(combine|add|create|make|build|assemble|put|mix|prepare|gather|compose|form|load|fill|arrange|stack|toss|set\s+up|set)\s+/i, "");
  // Peel off a leading "(a/my) plate/meal/dish/bowl with/of/out of " phrase
  // ("make A PLATE WITH X, Y" / "make a bowl OUT OF X, Y")
  text = text.replace(/^\s*(a\s+|my\s+)?(plate|meal|dish|bowl)\s+(with|of|out of)\s+/i, "");
  // Peel off a trailing "... into/onto/on/in/to (a/my) plate/meal/dish/bowl" phrase
  text = text.replace(/\s+(into|onto|on|in|to)\s+(a\s+|my\s+)?(plate|meal|dish|bowl)\.?\s*$/i, "");
  // Farsi: peel off a leading/trailing "به بشقاب" / "بشقاب"/"وعده"/"کاسه"/"ظرف" wrapper loosely
  text = text.replace(/^\s*(به\s+)?(بشقاب|وعده|کاسه|ظرف)\s*/g, "").replace(/\s*(بشقاب|وعده|کاسه|ظرف)\s*$/g, "");
  text = text.replace(/[.!]+$/, "").trim();
  return text || null;
}

function splitFoodTerms(str) {
  return (str || "")
    .split(/\s*,\s*|\s+and\s+|\s+و\s+|،\s*/i)
    .map((s) => s.trim())
    .filter(Boolean);
}

// Same matching priority as the search suggestions dropdown (exact, then
// starts-with, then contains) so a command resolves a name the same way
// typing it into search would.
function findFoodByTerm(term) {
  const q = term.trim().toLowerCase();
  const qFa = term.trim();
  if (!q) return null;
  return (
    FOODS.find((f) => f.name.toLowerCase() === q || f.nameFa === qFa) ||
    FOODS.find((f) => f.name.toLowerCase().startsWith(q) || f.nameFa.startsWith(qFa)) ||
    FOODS.find((f) => f.name.toLowerCase().includes(q) || f.nameFa.includes(qFa)) ||
    null
  );
}

function macroGroup(f) {
  const calCarb = (f.carbs100 + f.soluble100 + f.insoluble100) * 4;
  const calProtein = f.protein100 * 4;
  const calFat = f.fat100 * 9;
  const total = calCarb + calProtein + calFat || 1;
  const shares = { carb: calCarb / total, protein: calProtein / total, fat: calFat / total };
  const sorted = Object.entries(shares).sort((a, b) => b[1] - a[1]);
  if (sorted[0][1] < 0.5 && sorted[0][1] - sorted[1][1] < 0.15) return "mixed";
  return sorted[0][0];
}

function portionInfo(food, mode, overrideGrams) {
  let grams;
  if (overrideGrams != null && overrideGrams > 0) {
    grams = overrideGrams;
  } else if (mode === "100g") {
    grams = 100;
  } else if (mode === "50c") {
    grams = food.carbs100 > 0 ? (50 / food.carbs100) * 100 : 100;
  } else {
    grams = food.fdaG;
  }
  const carbsAtPortion = (food.carbs100 * grams) / 100;
  const gl = (food.gi * carbsAtPortion) / 100;
  return { grams, carbsAtPortion, gl };
}

function macrosAtPortion(food, grams) {
  const k = grams / 100;
  return {
    sugar: food.sugar100 * k,
    starch: starch(food) * k,
    soluble: food.soluble100 * k,
    insoluble: food.insoluble100 * k,
    protein: food.protein100 * k,
    satFat: food.satFat100 * k,
    mono: food.mono100 * k,
    poly: food.poly100 * k,
  };
}

function microsAtPortion(food, grams) {
  const k = grams / 100;
  return {
    sodium: food.sodium100 * k,
    potassium: food.potassium100 * k,
    calcium: food.calcium100 * k,
    iron: food.iron100 * k,
    vitC: food.vitC100 * k,
    magnesium: food.magnesium100 * k,
    zinc: food.zinc100 * k,
    vitA: food.vitA100 * k,
    vitB12: food.vitB12_100 * k,
    folate: food.folate100 * k,
  };
}

function curvePoints(food, gl) {
  const peak = 1.55 * gl;
  const sigmaRise = food.ttp / 2.3;
  const slowFallCats = { fat: 1.5, legume: 1.4, veg: 1.15, grain: 1.15, protein: 1.3 };
  const sigmaFall = (food.ttp / 1.35) * (slowFallCats[food.cat] || 1.1);
  const pts = [];
  for (let t = 0; t <= 200; t += 5) {
    const sigma = t <= food.ttp ? sigmaRise : sigmaFall;
    pts.push(Math.max(0, peak * Math.exp(-((t - food.ttp) ** 2) / (2 * sigma * sigma))));
  }
  return pts;
}

// Each note now carries a notability score (1 = generic/expected, 3 = the
// kind of thing worth actually telling someone) so the UI can surface only
// the most useful 1-2 tips per food instead of three boilerplate paragraphs.
function sleepNote(food, gl, lang) {
  const fast = food.ttp <= 35;
  const mid = food.ttp > 35 && food.ttp <= 70;
  const high = gl >= 15;
  const low = gl < 5;
  let en, fa, notability;
  if (gl < 1.5) {
    en = "Negligible blood sugar effect on its own — unlikely to disturb sleep through glucose alone.";
    fa = "به‌تنهایی اثر ناچیزی بر قند خون دارد — بعید است به‌خاطر قند خواب را مختل کند.";
    notability = 1;
  } else if (fast && high) {
    en = "Fast, high spike — likely to crash before bed, but the dip can still wake you.";
    fa = "افزایش سریع و بالا — احتمال افت قبل خواب هست، اما همان افت می‌تواند بیدارتان کند.";
    notability = 3;
  } else if (fast && !high) {
    en = "Fast but modest rise — usually settles before bedtime issues start.";
    fa = "افزایش سریع ولی محدود — معمولاً قبل از مشکل‌ساز شدن آرام می‌شود.";
    notability = 1;
  } else if (mid && high) {
    en = "Moderate-to-high spike landing mid-sleep window — can fragment early sleep.";
    fa = "افزایش متوسط تا زیاد درست در بازه‌ی اول خواب — می‌تواند خواب اولیه را مختل کند.";
    notability = 3;
  } else if (food.cat === "fat" || (food.ttp > 70 && gl >= 8)) {
    en = "Delayed, lingering rise — often peaks after you're already asleep.";
    fa = "افزایش دیرهنگام و طولانی — اغلب وقتی خوابید به اوج می‌رسد.";
    notability = 3;
  } else if (low) {
    en = "Minimal, gentle rise — least likely to disturb sleep.";
    fa = "افزایش کم و آرام — کمترین احتمال اختلال در خواب.";
    notability = 1;
  } else {
    en = "Slow, steady rise — generally sleep-friendly.";
    fa = "افزایش آهسته و پایدار — عموماً برای خواب مناسب است.";
    notability = 1;
  }
  return { text: lang === "fa" ? fa : en, notability };
}

function exerciseNote(food, gl, lang) {
  const fast = food.ttp <= 35;
  const fatHeavy = food.cat === "fat" || food.fat100 >= 20;
  const proteinHeavy = food.cat === "protein";
  let en, fa, notability;
  if (gl < 1.5 && (fatHeavy || proteinHeavy)) {
    en = "Minimal quick fuel — better suited to post-workout recovery (protein/fat) than pre-workout energy.";
    fa = "سوخت سریع کمی دارد — برای ریکاوری بعد از ورزش (پروتئین/چربی) مناسب‌تر است تا انرژی قبل از تمرین.";
    notability = 2;
  } else if (fast && gl >= 12) {
    en = "Quick-digesting energy — good 30-60 min before a workout, or right after to rapidly refill glycogen.";
    fa = "انرژی سریع‌الهضم — مناسب ۳۰ تا ۶۰ دقیقه قبل تمرین یا بلافاصله بعد از آن برای پر کردن سریع ذخایر گلیکوژن.";
    notability = 2;
  } else if (!fast && gl >= 10) {
    en = "Slower-release energy — better eaten 2-3 hours before endurance exercise for steady fuel without a crash.";
    fa = "انرژی با آزادسازی کندتر — بهتر است ۲ تا ۳ ساعت قبل از ورزش استقامتی مصرف شود تا سوخت پایدار بدون افت ناگهانی بدهد.";
    notability = 2;
  } else if (fatHeavy) {
    en = "High-fat and slow to digest — best eaten well before training, not right before, to avoid GI discomfort.";
    fa = "چرب و کندهضم — بهتر است مدتی قبل از تمرین خورده شود، نه درست قبل از آن، تا ناراحتی گوارشی ایجاد نشود.";
    notability = 2;
  } else {
    en = "Light glucose contribution — fine as a small pre- or post-workout addition, not a primary fuel source.";
    fa = "سهم کمی در قند خون دارد — به‌عنوان افزودنی کوچک قبل یا بعد تمرین مناسب است، نه منبع اصلی انرژی.";
    notability = 1;
  }
  return { text: lang === "fa" ? fa : en, notability };
}

function fastingNote(food, gl, lang) {
  const proteinHeavy = food.protein100 >= 15;
  const fatHeavy = food.fat100 >= 20 && food.carbs100 < 5;
  let en, fa, notability;
  if (gl < 1 && fatHeavy) {
    en = "Very low glucose/insulin impact — some intermittent-fasting approaches allow small amounts of pure fat like this, though strictly any calories end a true fast.";
    fa = "اثر بسیار کمی بر قند و انسولین دارد — برخی روش‌های روزه‌داری متناوب مقدار کمی چربی خالص مانند این را مجاز می‌دانند، هرچند از نظر دقیق هر کالری روزه را می‌شکند.";
    notability = 3;
  } else if (gl < 1.5 && proteinHeavy) {
    en = "Low glucose impact, but protein still triggers a real insulin response — not glucose-neutral for strict fasting purposes.";
    fa = "اثر کمی بر قند دارد، اما پروتئین همچنان پاسخ انسولینی واقعی ایجاد می‌کند — از نظر روزه‌داری دقیق، خنثی از نظر انسولین نیست.";
    notability = 2;
  } else if (gl >= 15) {
    en = "Strong insulin/glucose spike — the most disruptive kind of food to break a fast with if a gentle re-entry is the goal.";
    fa = "افزایش قوی قند و انسولین — اگر هدف بازگشت آرام باشد، مخرب‌ترین نوع غذا برای شکستن روزه است.";
    notability = 3;
  } else if (food.cat === "legume" || food.cat === "veg") {
    en = "Fiber-rich and gentle — a comparatively steadier way to break a fast than refined carbs.";
    fa = "سرشار از فیبر و ملایم — نسبت به کربوهیدرات‌های تصفیه‌شده، روش پایدارتری برای شکستن روزه است.";
    notability = 2;
  } else {
    en = "Moderate glucose response — a middle-of-the-road choice for breaking a fast.";
    fa = "پاسخ متوسط قندی دارد — گزینه‌ای میانه برای شکستن روزه.";
    notability = 1;
  }
  return { text: lang === "fa" ? fa : en, notability };
}

const TIP_META = {
  sleep: { icon: "😴", label: { en: "Sleep", fa: "خواب" } },
  exercise: { icon: "🏃", label: { en: "Exercise", fa: "ورزش" } },
  fasting: { icon: "⏳", label: { en: "Fasting", fa: "روزه‌داری" } },
};

// Surfaces only the most worthwhile tip(s) instead of always showing all
// three — a second tip is included only if it's still genuinely notable.
function getTopTips(food, gl, lang) {
  const candidates = [
    { key: "sleep", ...sleepNote(food, gl, lang) },
    { key: "exercise", ...exerciseNote(food, gl, lang) },
    { key: "fasting", ...fastingNote(food, gl, lang) },
  ].sort((a, b) => b.notability - a.notability);
  const top = [candidates[0]];
  if (candidates[1] && candidates[1].notability >= 2) top.push(candidates[1]);
  return top;
}

// ---------------------------------------------------------------------------
// Time-of-day aware suggestions: rather than making sleep/fasting notes
// something a person has to open per-food to find, proactively surface
// them at the top of a meal tab when that meal's own approximate clock
// time (see MEAL_SLOTS above) makes them relevant — a high-GL food lands
// differently in Breakfast (right after an overnight fast) than in Dinner
// close to a typical bedtime. General reference points, not personalized
// to the person's actual sleep or eating schedule.
// ---------------------------------------------------------------------------
const TYPICAL_BEDTIME_MIN = 23 * 60; // 11:00 PM, a common reference bedtime
const BEDTIME_PROXIMITY_WINDOW_MIN = 240; // flag a meal within ~4h of that

const TIME_FLAG_META = {
  fasting: { icon: "🌅", label: { en: "Breaking an overnight fast", fa: "شکستن روزه شبانه" } },
  bedtime: { icon: "🌙", label: { en: "Close to a typical bedtime", fa: "نزدیک به زمان معمول خواب" } },
};

function computeTimeOfDayFlags(slotId, foods, mode, customGrams, lang) {
  const cg = customGrams || {};
  const slot = MEAL_SLOTS.find((s) => s.id === slotId);
  if (!slot || !foods || foods.length === 0) return [];

  const flags = [];

  // Breakfast is literally "breaking a fast" — a strong spike right after
  // waking is the specific case fastingNote's own text calls out as the
  // most disruptive way to do that, so gate on that exact condition rather
  // than a generic notability threshold (which also covers a merely
  // informational low-GL branch that isn't a caution at all).
  if (slotId === "breakfast") {
    foods.forEach((f) => {
      const { gl } = portionInfo(f, mode, cg[f.id]);
      if (gl >= 15) {
        flags.push({ food: f, text: fastingNote(f, gl, lang).text, reason: "fasting" });
      }
    });
  }

  // Dinner/snack close enough to the reference bedtime that a notably
  // disruptive sleep profile (sleepNote's own notability>=3 cases — all
  // genuine cautions, not informational asides) is worth a heads-up.
  const minutesToBedtime = TYPICAL_BEDTIME_MIN - slot.startMin;
  if ((slotId === "dinner" || slotId === "snack") && minutesToBedtime >= 0 && minutesToBedtime <= BEDTIME_PROXIMITY_WINDOW_MIN) {
    foods.forEach((f) => {
      const { gl } = portionInfo(f, mode, cg[f.id]);
      const note = sleepNote(f, gl, lang);
      if (note.notability >= 3) flags.push({ food: f, text: note.text, reason: "bedtime" });
    });
  }

  return flags.slice(0, 3);
}

function round(n, d = 0) {
  const m = 10 ** d;
  return Math.round(n * m) / m;
}

// Standard published thresholds — GI: low <=55, medium 56-69, high >=70.
// GL: low <10, medium 10-19, high >=20. Gives the raw number an at-a-glance
// read instead of requiring the person to remember the cutoffs themselves.
function giTier(gi) {
  if (gi <= 55) return { label: { en: "Low", fa: "کم" }, color: "#1d9e75" };
  if (gi <= 69) return { label: { en: "Medium", fa: "متوسط" }, color: "#e0a83c" };
  return { label: { en: "High", fa: "بالا" }, color: "#d4534f" };
}
function glTier(gl) {
  if (gl < 10) return { label: { en: "Low", fa: "کم" }, color: "#1d9e75" };
  if (gl < 20) return { label: { en: "Medium", fa: "متوسط" }, color: "#e0a83c" };
  return { label: { en: "High", fa: "بالا" }, color: "#d4534f" };
}
// Same fast/moderate/slow thresholds already used to color the time-to-peak
// gauge — kept here as a proper tier (label + color) so "time to peak" can
// carry a dynamic badge the same way GI and GL do. No red: a slow rise
// isn't "bad" the way a high GI/GL reading is, just different.
function ttpTier(ttp) {
  if (ttp <= 35) return { label: { en: "Fast", fa: "سریع" }, color: "#1d9e75" };
  if (ttp <= 70) return { label: { en: "Moderate", fa: "متوسط" }, color: "#e0a83c" };
  return { label: { en: "Slow", fa: "کند" }, color: "#7fa3d1" };
}

// Continuous green -> amber -> red spectrum for glycemic index, anchored on
// the same three brand colors used by giTier's discrete Low/Medium/High
// badges (so a curve's color always agrees with its GI badge), but
// interpolated smoothly instead of stepping in three flat bands.
const GI_COLOR_STOPS = [
  { at: 0, rgb: [29, 158, 117] }, // #1d9e75 — low GI, green
  { at: 55, rgb: [224, 168, 60] }, // #e0a83c — medium GI, amber
  { at: 100, rgb: [212, 83, 79] }, // #d4534f — high GI, red
];
function giToColor(gi, alpha = 1) {
  const clamped = Math.max(0, Math.min(100, gi || 0));
  let lo = GI_COLOR_STOPS[0];
  let hi = GI_COLOR_STOPS[GI_COLOR_STOPS.length - 1];
  for (let i = 0; i < GI_COLOR_STOPS.length - 1; i++) {
    if (clamped >= GI_COLOR_STOPS[i].at && clamped <= GI_COLOR_STOPS[i + 1].at) {
      lo = GI_COLOR_STOPS[i];
      hi = GI_COLOR_STOPS[i + 1];
      break;
    }
  }
  const span = hi.at - lo.at || 1;
  const frac = (clamped - lo.at) / span;
  const [r, g, b] = lo.rgb.map((c, i) => Math.round(c + (hi.rgb[i] - c) * frac));
  return alpha >= 1 ? `rgb(${r}, ${g}, ${b})` : `rgba(${r}, ${g}, ${b}, ${alpha})`;
}

// Heuristic 0-10 "Daily glycemic response score" — not a clinical or
// personalized score. Combines four ingredients that recur across
// glycemic-response literature: (1) cumulative daily glycemic load,
// (2) how tall the day's blood-glucose peak is, (3) whether fiber/fat/
// protein ride along with the carbs (known to blunt and delay the rise
// vs. carbs eaten alone), and (4) whether meals are spread across the day
// rather than clustered into one sitting (meal regularity/spacing is
// associated with steadier postprandial glucose in the meal-timing
// literature). The exact weights are a simplification for this app, not
// a validated clinical index.
function computeDailyScore(plate, mealCardData, dailyCurveInfo) {
  if (!plate) return null;
  let score = 10;
  const notes = [];

  const gl = plate.totalGL;
  if (gl >= 150) {
    score -= 3.5;
    notes.push({
      ok: false,
      text: { en: "Daily glycemic load is high (≥150) — a lot of high-GI carbs stacked across the day.", fa: "بار گلایسمی روزانه بالا است (≥۱۵۰) — کربوهیدرات با GI بالا در طول روز انباشته شده." },
    });
  } else if (gl >= 100) {
    score -= 1.5;
    notes.push({ ok: null, text: { en: "Daily glycemic load is in a moderate range (100–150).", fa: "بار گلایسمی روزانه در محدوده متوسط است (۱۰۰ تا ۱۵۰)." } });
  } else {
    notes.push({ ok: true, text: { en: "Daily glycemic load stays in a lower range (<100).", fa: "بار گلایسمی روزانه در محدوده پایین‌تری است (کمتر از ۱۰۰)." } });
  }

  const peak = dailyCurveInfo && dailyCurveInfo.curve.length ? Math.max(...dailyCurveInfo.curve, 0) : 0;
  if (peak >= 90) {
    score -= 2.5;
    notes.push({ ok: false, text: { en: "At least one steep spike stands out in the day's combined curve.", fa: "حداقل یک جهش تند در منحنی ترکیبی روز دیده می‌شود." } });
  } else if (peak >= 55) {
    score -= 1;
    notes.push({ ok: null, text: { en: "The day has a noticeable but moderate peak.", fa: "روز یک اوج قابل‌توجه اما متوسط دارد." } });
  } else if (peak > 0) {
    notes.push({ ok: true, text: { en: "No sharp spikes — the combined curve stays fairly flat.", fa: "جهش تندی وجود ندارد — منحنی ترکیبی نسبتاً صاف است." } });
  }

  const blunt = plate.bluntFactor; // ~0.55 (well blunted) .. 1 (unblunted)
  score += (1 - blunt) * 2;
  if (blunt <= 0.7) {
    notes.push({ ok: true, text: { en: "Fiber, fat, and protein alongside the carbs are blunting and delaying the rise.", fa: "فیبر، چربی و پروتئین همراه کربوهیدرات‌ها اوج را کند و به‌تأخیر می‌اندازند." } });
  } else if (blunt >= 0.9) {
    notes.push({ ok: false, text: { en: "Carbs are mostly eaten with little fat, fiber, or protein alongside them.", fa: "کربوهیدرات‌ها بیشتر بدون همراهی چربی، فیبر یا پروتئین خورده شده‌اند." } });
  }

  const filledCount = mealCardData.filter((m) => m.plate).length;
  if (filledCount >= 3) {
    score += 0.5;
    notes.push({ ok: true, text: { en: "Food is spread across several meals rather than one big sitting.", fa: "غذا در چند وعده پخش شده، نه یک وعده بزرگ." } });
  } else if (filledCount <= 1) {
    score -= 0.5;
    notes.push({ ok: null, text: { en: "Everything logged so far is in a single sitting.", fa: "همه چیز تاکنون در یک وعده ثبت شده." } });
  }

  score = Math.max(0, Math.min(10, score));
  return { score: Math.round(score * 10) / 10, notes };
}

function dailyScoreTier(score) {
  if (score >= 8) return { label: { en: "Great", fa: "عالی" }, color: "#1d9e75" };
  if (score >= 6) return { label: { en: "Good", fa: "خوب" }, color: "#7fa3d1" };
  if (score >= 4) return { label: { en: "Could be better", fa: "قابل بهبود" }, color: "#e0a83c" };
  return { label: { en: "High glycemic burden", fa: "بار گلایسمی بالا" }, color: "#d4534f" };
}

function scoreTierColor(score) {
  if (score >= 8) return "#1d9e75";
  if (score >= 6) return "#7fa3d1";
  if (score >= 4) return "#e0a83c";
  return "#d4534f";
}

function genericScoreLabel(score) {
  if (score >= 8) return { en: "Great", fa: "عالی" };
  if (score >= 6) return { en: "Good", fa: "خوب" };
  if (score >= 4) return { en: "Could be better", fa: "قابل بهبود" };
  return { en: "Low", fa: "کم" };
}

// Heuristic 0-10 "Micronutrient DV coverage" score: how broadly the day's
// food covers the 9 non-limit micronutrients this app tracks (sodium is
// excluded — it's a "limit" nutrient, not a "get more of" one), relative
// to the FDA's adult Daily Values. Dietary-adequacy and diet-quality
// research (e.g. work behind indices like the Healthy Eating Index) tends
// to reward breadth of coverage across many nutrients over a huge dose of
// just one or two, so this blends average %DV coverage with how many
// nutrients individually clear a 50%-DV bar.
function computeMicroCoverageScore(micros) {
  const keys = MICRO_KEYS_ORDERED.filter((k) => !MICRO_LIMIT_NUTRIENTS.has(k));
  const perNutrient = keys.map((k) => {
    const dvPct = microDvPct(k, micros[k]);
    return { key: k, dvPct, capped: Math.min(Math.max(dvPct, 0), 100) };
  });
  const avgCoverage = perNutrient.reduce((s, n) => s + n.capped, 0) / perNutrient.length; // 0-100
  const metCount = perNutrient.filter((n) => n.dvPct >= 50).length;

  let score = (avgCoverage / 100) * 10 * 0.7 + (metCount / perNutrient.length) * 10 * 0.3;
  score = Math.max(0, Math.min(10, score));

  return { score: Math.round(score * 10) / 10, perNutrient, metCount, total: perNutrient.length };
}

// Heuristic 0-10 fiber-adequacy score against commonly cited general adult
// targets (roughly 25-38 g/day across sources like the Dietary Guidelines
// for Americans and EFSA, often summarized as ~14g per 1000 kcal). This
// app doesn't know the person's sex, age, or calorie needs, so it uses a
// single ~28g/day midpoint as an "average individual" approximation — not
// a personalized target. A small note flags whether both soluble fiber
// (linked to cholesterol/glucose effects) and insoluble fiber (linked to
// digestive regularity) are present, since both are discussed as useful
// in the fiber literature, not just total grams.
function computeFiberScore(soluble, insoluble) {
  const total = soluble + insoluble;
  const target = 28;
  const score = Math.max(0, Math.min(10, (total / target) * 10));
  const hasBothTypes = total > 0 && soluble >= total * 0.15 && insoluble >= total * 0.15;
  return { score: Math.round(score * 10) / 10, total, soluble, insoluble, target, hasBothTypes };
}

// ---------------------------------------------------------------------------
// Goal-based scoring lens: a person's health goal decides how the day's
// existing sub-scores (glycemic response, fiber, micronutrient coverage)
// plus a couple of plate-level macro checks (protein amount/quality, fat
// quality, sodium) get WEIGHTED into one combined "goal fit" number — the
// sub-scores themselves don't change, only how much each counts. This is
// deliberately separate from `scoreLens` (conventional vs. functional-
// medicine METHODOLOGY for scoring a single nutrient) — goal lens is about
// what the person is optimizing FOR, methodology is about HOW any one
// thing gets scored either way.
// ---------------------------------------------------------------------------
const GOAL_LENSES = [
  { id: "balanced", icon: "⚖️", label: { en: "Balanced", fa: "متعادل" } },
  { id: "bloodSugar", icon: "🩸", label: { en: "Blood sugar control", fa: "کنترل قند خون" } },
  { id: "weightMgmt", icon: "🔥", label: { en: "Weight management", fa: "مدیریت وزن" } },
  { id: "muscleGain", icon: "💪", label: { en: "Muscle & recovery", fa: "عضله و ریکاوری" } },
  { id: "heartHealth", icon: "❤️", label: { en: "Heart health", fa: "سلامت قلب" } },
];

const GOAL_INFO_TEXT = {
  balanced: {
    en: "No goal selected — the three scores above (glycemic, fiber, micronutrients) are shown separately with equal standing rather than combined into one number.",
    fa: "هدفی انتخاب نشده — سه امتیاز بالا (گلایسمی، فیبر، ریزمغذی‌ها) به‌طور جداگانه و با وزن برابر نمایش داده می‌شوند، نه ترکیب‌شده در یک عدد.",

    fa: "بیشترین وزن به فیبر و سهم پروتئین از کالری (هر دو مرتبط با احساس سیری) داده می‌شود، به‌همراه پاسخ گلایسمی و ریزمغذی‌ها.",

    fa: "بیشترین وزن به کیفیت چربی (سهم اشباع/ترانس در برابر غیراشباع) و سدیم داده می‌شود، به‌همراه فیبر و ریزمغذی‌ها.",
  },
};

// General, non-personalized reference points used only inside this goal
// blend — not personalized to the person's body weight, sex, or calorie
// needs, same spirit as the ~28g/day fiber target above.
const GOAL_REFERENCE = {
  proteinCalShareTarget: 0.3, // ~30% of calories from protein is a commonly cited satiety-supportive range
  proteinGramsTarget: 120, // a general higher-end daily reference, not personalized (no body weight known)
  sodiumCapMg: 1500, // commonly cited daily sodium target for cardiovascular health (e.g. AHA "ideal" limit)
};

function computeGoalFitScore(goalId, plate, dailyScore, microCoverage, fiberScore) {
  if (!plate || !dailyScore || !microCoverage || !fiberScore || goalId === "balanced") return null;

  const glycemic = dailyScore.score;
  const fiber = fiberScore.score;
  const micro = microCoverage.score;
  const notes = [];
  let score;

  if (goalId === "bloodSugar") {
    score = glycemic * 0.55 + fiber * 0.25 + micro * 0.2;
    notes.push({
      ok: glycemic >= 6,
      text: { en: `Glycemic response score carries the most weight here (${glycemic}/10).`, fa: `امتیاز پاسخ گلایسمی بیشترین وزن را در این هدف دارد (${glycemic} از ۱۰).` },
    });
    notes.push({
      ok: fiber >= 6,
      text: { en: `Fiber, which slows carb absorption, is at ${fiber}/10.`, fa: `فیبر که جذب کربوهیدرات را کند می‌کند، ${fiber} از ۱۰ است.` },
    });
  } else if (goalId === "weightMgmt") {
    const kcal = plate.totalCal || 0;
    const proteinCalShare = kcal > 0 ? (plate.totalProteinG * 4) / kcal : 0;
    const proteinShareScore = Math.max(0, Math.min(10, (proteinCalShare / GOAL_REFERENCE.proteinCalShareTarget) * 10));
    score = fiber * 0.35 + proteinShareScore * 0.3 + glycemic * 0.2 + micro * 0.15;
    notes.push({
      ok: fiber >= 6,
      text: { en: `Fiber is weighted heaviest here (${fiber}/10) — it supports fullness and slows digestion.`, fa: `فیبر بیشترین وزن را در این هدف دارد (${fiber} از ۱۰) — به احساس سیری و کندشدن گوارش کمک می‌کند.` },
    });
    notes.push({
      ok: proteinCalShare >= GOAL_REFERENCE.proteinCalShareTarget * 0.7,
      text: {
        en: `Protein is about ${Math.round(proteinCalShare * 100)}% of today's calories (reference range: ~${Math.round(GOAL_REFERENCE.proteinCalShareTarget * 100)}%) — protein is commonly linked to feeling fuller for longer.`,
        fa: `پروتئین حدود ${Math.round(proteinCalShare * 100)}٪ کالری امروز است (محدوده مرجع: حدود ${Math.round(GOAL_REFERENCE.proteinCalShareTarget * 100)}٪) — پروتئین معمولاً با احساس سیری طولانی‌تر مرتبط دانسته می‌شود.`,
      },
    });
  } else if (goalId === "muscleGain") {
    const proteinG = plate.totalProteinG || 0;
    const proteinAmountScore = Math.max(0, Math.min(10, (proteinG / GOAL_REFERENCE.proteinGramsTarget) * 10));
    const proteinQ = plate.proteinQuality ? plate.proteinQuality.score * 10 : 5;
    score = proteinAmountScore * 0.35 + proteinQ * 0.25 + micro * 0.2 + glycemic * 0.1 + fiber * 0.1;
    notes.push({
      ok: proteinG >= GOAL_REFERENCE.proteinGramsTarget * 0.7,
      text: {
        en: `${round(proteinG)}g of protein logged today against a general reference of ~${GOAL_REFERENCE.proteinGramsTarget}g — not personalized to your body weight.`,
        fa: `${round(proteinG)} گرم پروتئین امروز ثبت شده، در برابر مرجع کلی حدود ${GOAL_REFERENCE.proteinGramsTarget} گرم — شخصی‌سازی‌شده بر اساس وزن بدن شما نیست.`,
      },
    });
    notes.push({
      ok: proteinQ >= 6,
      text: {
        en: plate.proteinQuality ? `Protein quality (amino acid coverage) is at ${round(proteinQ)}/10.` : `Not enough protein logged yet to estimate amino acid quality.`,
        fa: plate.proteinQuality ? `کیفیت پروتئین (پوشش اسیدهای آمینه) ${round(proteinQ)} از ۱۰ است.` : `هنوز پروتئین کافی برای برآورد کیفیت اسیدهای آمینه ثبت نشده.`,
      },
    });
  } else if (goalId === "heartHealth") {
    const fatQ = plate.fatQuality ? plate.fatQuality.score : 5;
    const sodiumMg = plate.micros.sodium || 0;
    const sodiumScore = Math.max(0, Math.min(10, 10 - Math.max(0, sodiumMg - GOAL_REFERENCE.sodiumCapMg) / 150));
    score = fatQ * 0.35 + sodiumScore * 0.2 + fiber * 0.25 + micro * 0.2;
    notes.push({
      ok: fatQ >= 6,
      text: {
        en: plate.fatQuality ? `Fat quality (saturated/trans vs. unsaturated share) is at ${round(fatQ)}/10.` : `Not enough fat logged yet to estimate fat quality.`,
        fa: plate.fatQuality ? `کیفیت چربی (سهم اشباع/ترانس در برابر غیراشباع) ${round(fatQ)} از ۱۰ است.` : `هنوز چربی کافی برای برآورد کیفیت چربی ثبت نشده.`,
      },
    });
    notes.push({
      ok: sodiumMg <= GOAL_REFERENCE.sodiumCapMg,
      text: {
        en: `${round(sodiumMg)}mg sodium today against a commonly cited ~${GOAL_REFERENCE.sodiumCapMg}mg cardiovascular reference.`,
        fa: `${round(sodiumMg)} میلی‌گرم سدیم امروز، در برابر مرجع قلبی‌عروقی رایج حدود ${GOAL_REFERENCE.sodiumCapMg} میلی‌گرم.`,
      },
    });
  }

  score = Math.round(Math.max(0, Math.min(10, score)) * 10) / 10;
  return { score, notes, goalId };
}

// Colors are shades within 3 hue families so the pie reads at a glance:
// amber = carbs (4 shades: sugar -> starch -> soluble fiber -> insoluble fiber),
// teal = protein (1 shade), rose = fat (3 shades: sat -> mono -> poly).
function findSimilarFoods(food, limit) {
  const scored = FOODS.filter((f) => f.id !== food.id).map((f) => {
    let score = f.cat === food.cat ? 0 : 40;
    score += Math.abs(f.gi - food.gi) * 0.5;
    score += Math.abs(f.carbs100 - food.carbs100) * 0.3;
    score += Math.abs(f.protein100 - food.protein100) * 0.5;
    score += Math.abs(f.fat100 - food.fat100) * 0.3;
    return { f, score };
  });
  scored.sort((a, b) => a.score - b.score);
  return scored.slice(0, limit).map((s) => s.f);
}

// Which axis to rank swaps by depends on what actually dominates this
// food's calories, and which scoring lens is currently selected — a
// fat-dominant food gets compared on fat quality, a protein-dominant food
// on protein quality (using whichever score the person currently has as
// primary), and everything else falls back to glycemic index, the one
// metric every food has and the app's own headline number regardless of
// macro profile.
function swapComparisonAxis(food, scoreLens) {
  const group = macroGroup(food);
  if (group === "fat") {
    return scoreLens === "functional"
      ? {
          key: "fat-functional",
          label: { en: "functional fat score", fa: "امتیاز طب عملکردی چربی" },
          higherIsBetter: true,
          meaningfulDelta: 1,
          format: (v) => `${v.toFixed(1)}/10`,
          valueOf: (f) => {
            const q = computeFunctionalFatScore(f);
            return q ? q.score : null;
          },
        }
      : {
          key: "fat-conventional",
          label: { en: "fat quality score", fa: "امتیاز کیفیت چربی" },
          higherIsBetter: true,
          meaningfulDelta: 1,
          format: (v) => `${v.toFixed(1)}/10`,
          valueOf: (f) => {
            const q = computeFatQualityScore(f);
            return q ? q.score : null;
          },
        };
  }
  if (group === "protein") {
    return scoreLens === "functional"
      ? {
          key: "protein-functional",
          label: { en: "functional protein score", fa: "امتیاز طب عملکردی پروتئین" },
          higherIsBetter: true,
          meaningfulDelta: 1,
          format: (v) => `${v.toFixed(1)}/10`,
          valueOf: (f) => {
            const q = computeFunctionalProteinScore(f);
            return q ? q.score : null;
          },
        }
      : {
          key: "protein-conventional",
          label: { en: "amino acid score", fa: "امتیاز اسید آمینه" },
          higherIsBetter: true,
          meaningfulDelta: 8,
          format: (v) => `${Math.round(v)}%`,
          valueOf: (f) => {
            const q = foodProteinQuality(f);
            return q ? q.score * 100 : null;
          },
        };
  }
  // Carb-dominant or "mixed" (no single macro clearly leads) — glycemic
  // index, since it's meaningful for every food regardless of profile.
  return {
    key: "gi",
    label: { en: "GI", fa: "GI" },
    higherIsBetter: false,
    meaningfulDelta: 8,
    format: (v) => `${Math.round(v)}`,
    valueOf: (f) => f.gi,
  };
}

// Same "is this actually a fair swap" similarity metric as
// findSimilarFoods, but only surfaces candidates that are also a
// meaningful improvement on whichever axis actually matters for this food
// (see swapComparisonAxis) — a plausible substitute AND a genuinely better
// choice on the metric that dominates it, not just the single closest
// match regardless of direction. Sorted by improvement size, biggest
// first.
function findBetterSwaps(food, limit, scoreLens) {
  const axis = swapComparisonAxis(food, scoreLens);
  const currentValue = axis.valueOf(food);
  if (currentValue == null) return [];
  const scored = FOODS.filter((f) => f.id !== food.id)
    .map((f) => {
      let simScore = f.cat === food.cat ? 0 : 40;
      simScore += Math.abs(f.gi - food.gi) * 0.5;
      simScore += Math.abs(f.carbs100 - food.carbs100) * 0.3;
      simScore += Math.abs(f.protein100 - food.protein100) * 0.5;
      simScore += Math.abs(f.fat100 - food.fat100) * 0.3;
      const candidateValue = axis.valueOf(f);
      if (candidateValue == null) return null;
      const delta = axis.higherIsBetter ? candidateValue - currentValue : currentValue - candidateValue;
      return { f, simScore, delta, candidateValue };
    })
    .filter((s) => s && s.simScore < 60 && s.delta >= axis.meaningfulDelta);
  scored.sort((a, b) => b.delta - a.delta || a.simScore - b.simScore);
  return scored.slice(0, limit).map((s) => ({ food: s.f, delta: s.delta, value: s.candidateValue, axis }));
}

// ---------------------------------------------------------------------------
// Whole-meal auto-optimizer: tries swapping each food already in the
// active meal for a handful of plausible substitutes (the same "fair
// swap" similarity findBetterSwaps/findSimilarFoods already use), and —
// unlike a per-food swap suggestion — measures the swap's actual effect
// on the WHOLE DAY's combined glycemic score (computeDailyScore), not
// just that one food's own score. A food that looks like a downgrade in
// isolation can still be the day's best move if it fills a gap the rest
// of the day already has, and vice versa: a "healthier" swap in one meal
// can do nothing for (or even hurt) the day if the rest of the day
// already covers what it would have added.
//
// Candidates are substituted at a calorie-equivalent amount (see
// gramsForEquivalentCalories below), not their own default serving size.
// Without that, a swap toward a food with a much smaller typical portion
// (e.g. honey's 1 tbsp / 21g default vs. table sugar's 1 tsp / 4g) reads
// as a big "improvement" purely by shrinking how much sweetener is in
// the meal — not because the candidate is actually a better food. Caught
// by direct comparison: table sugar at honey's own 21g portion scores
// identically to honey, confirming the earlier delta was a serving-size
// artifact, not a genuine quality difference.
// ---------------------------------------------------------------------------

// A food's calories at a given portion — same 4/4/9 kcal-per-gram
// convention used everywhere else (computePlate's totalCal, etc.).
function foodCaloriesAtPortion(food, grams) {
  const k = grams / 100;
  const carbG = food.carbs100 * k + food.soluble100 * k + food.insoluble100 * k;
  const proteinG = food.protein100 * k;
  const fatG = food.fat100 * k;
  return carbG * 4 + proteinG * 4 + fatG * 9;
}

// How many grams of `candidate` would contribute roughly `targetCal`
// calories — the basis for a genuine "swap" (replace this much energy
// with that food), rather than dropping the candidate in at its own
// unrelated default serving size. Falls back to the candidate's own
// default portion for essentially calorie-free foods (water, black
// coffee, spices) where a calorie-equivalent amount is undefined/huge.
function gramsForEquivalentCalories(candidate, targetCal) {
  const calPer100 = foodCaloriesAtPortion(candidate, 100);
  if (calPer100 < 1) return candidate.fdaG;
  return Math.max(1, Math.round((targetCal / calPer100) * 100));
}

function computeWholeMealOptimization(activeSlotId, plateSlots, mode, customGrams) {
  const currentIds = plateSlots[activeSlotId] || [];
  const currentFoods = currentIds.map((id) => FOOD_BY_ID[id]).filter(Boolean);
  if (currentFoods.length === 0) return null;

  // Candidates already eaten elsewhere that day are skipped — swapping in
  // a food the person is already having at another meal isn't a genuine
  // substitution, it's just moving the same food around.
  const idsUsedElsewhereToday = new Set(MEAL_SLOT_IDS.filter((sid) => sid !== activeSlotId).flatMap((sid) => plateSlots[sid] || []));

  function dayScoreFor(hypotheticalSlots, hypotheticalCustomGrams) {
    const foods = MEAL_SLOT_IDS.flatMap((sid) => (hypotheticalSlots[sid] || []).map((id) => FOOD_BY_ID[id]).filter(Boolean));
    if (foods.length === 0) return null;
    const p = computePlate(foods, mode, hypotheticalCustomGrams);
    const curve = computeDailyCurve(hypotheticalSlots, mode, hypotheticalCustomGrams);
    // The meal-spacing factor inside computeDailyScore reads mealCardData
    // (specifically how many slots are filled), so it needs to reflect
    // the hypothetical swap too — cheap enough given the small candidate
    // count below (a handful of similar foods per current ingredient).
    const mcd = MEAL_SLOTS.map((s) => {
      const ids = hypotheticalSlots[s.id] || [];
      const fds = ids.map((id) => FOOD_BY_ID[id]).filter(Boolean);
      return { slot: s, foods: fds, plate: fds.length ? computePlate(fds, mode, hypotheticalCustomGrams) : null };
    });
    const ds = computeDailyScore(p, mcd, curve);
    return ds ? ds.score : null;
  }

  const baselineScore = dayScoreFor(plateSlots, customGrams);
  if (baselineScore == null) return null;

  let best = null;
  currentFoods.forEach((from, idx) => {
    const fromGrams = portionInfo(from, mode, customGrams[from.id]).grams;
    const fromCal = foodCaloriesAtPortion(from, fromGrams);
    const candidates = findSimilarFoods(from, 8).filter((c) => !idsUsedElsewhereToday.has(c.id) && c.id !== from.id);
    candidates.forEach((to) => {
      const hypotheticalIds = currentIds.slice();
      hypotheticalIds[idx] = to.id;
      // Substitute at an amount contributing roughly the same calories
      // `from` did — see the header comment above for why this matters.
      const toGrams = gramsForEquivalentCalories(to, fromCal);
      const hypotheticalCustomGrams = { ...customGrams, [to.id]: toGrams };
      const newScore = dayScoreFor({ ...plateSlots, [activeSlotId]: hypotheticalIds }, hypotheticalCustomGrams);
      if (newScore == null) return;
      const delta = Math.round((newScore - baselineScore) * 10) / 10;
      if (!best || delta > best.delta) {
        best = { from, to, delta, baselineScore: Math.round(baselineScore * 10) / 10, newScore: Math.round(newScore * 10) / 10, toGrams };
      }
    });
  });

  // Not worth suggesting a swap for a fraction of a point — same spirit
  // as the "meaningfulDelta" gate findBetterSwaps uses per-nutrient.
  if (!best || best.delta < 0.3) return null;
  return best;
}

// ---------------------------------------------------------------------------
// Auto-complete a balanced plate: given whatever's already on the active
// meal's plate (0 to MAX_SELECT-1 foods), figure out which "roles" a
// well-rounded plate would want that aren't covered yet — protein, a
// carb/starch, meaningful fiber, and broad micronutrient coverage — and
// pick the single best-fitting food for each missing role, one at a time,
// so later picks don't double up on a role the plate already just gained.
// If every role is already covered, it still offers one more micronutrient-
// dense pick rather than doing nothing.
// ---------------------------------------------------------------------------
const AUTOCOMPLETE_ROLE_LABELS = {
  protein: { en: "protein", fa: "پروتئین" },
  carb: { en: "carbs", fa: "کربوهیدرات" },
  fiber: { en: "fiber", fa: "فیبر" },
  micro: { en: "micronutrients", fa: "ریزمغذی‌ها" },
};

function computeAutoCompleteSuggestions(plateFoods, mode, customGrams, maxAdd) {
  const cg = customGrams || {};
  const usedIds = new Set(plateFoods.map((f) => f.id));
  const candidates = FOODS.filter((f) => !usedIds.has(f.id));
  if (candidates.length === 0) return [];

  const nonSodiumMicroKeys = MICRO_KEYS_ORDERED.filter((k) => k !== "sodium");

  const hasProtein = plateFoods.some((f) => macroGroup(f) === "protein" || f.protein100 >= 15);
  const hasCarb = plateFoods.some((f) => macroGroup(f) === "carb" || macroGroup(f) === "mixed");

  const plateFiberG = plateFoods.reduce((s, f) => {
    const { grams } = portionInfo(f, mode, cg[f.id]);
    const m = macrosAtPortion(f, grams);
    return s + m.soluble + m.insoluble;
  }, 0);
  const hasFiber = plateFiberG >= 4;

  let avgMicroDv = 0;
  if (plateFoods.length > 0) {
    const plate = computePlate(plateFoods, mode, cg);
    avgMicroDv = nonSodiumMicroKeys.reduce((s, k) => s + Math.min(100, Math.max(0, microDvPct(k, plate.micros[k]))), 0) / nonSodiumMicroKeys.length;
  }
  const hasMicro = avgMicroDv >= 25;

  const roles = [];
  if (!hasProtein) roles.push("protein");
  if (!hasCarb) roles.push("carb");
  if (!hasFiber) roles.push("fiber");
  if (!hasMicro) roles.push("micro");
  if (roles.length === 0) roles.push("micro");
  // Fill in extra rounds (protein, then micro again, ...) if there's more
  // room than roles identified, so a 1-food plate can still get 2 picks.
  while (roles.length < maxAdd) roles.push(roles[roles.length % 4] || "micro");

  function scoreForRole(f, role) {
    const { grams } = portionInfo(f, mode, cg[f.id]);
    const mi = microsAtPortion(f, grams);
    if (role === "protein") {
      if (f.protein100 < 8) return -Infinity;
      const q = f.protein100 >= 5 ? foodProteinQuality(f).score : 0.5;
      return f.protein100 * 0.5 + q * 30 - f.gi * 0.1;
    }
    if (role === "carb") {
      const grp = macroGroup(f);
      if (grp !== "carb" && grp !== "mixed") return -Infinity;
      return (f.soluble100 + f.insoluble100) * 4 - f.gi * 0.3;
    }
    if (role === "fiber") {
      return (f.soluble100 + f.insoluble100) * 5 - f.gi * 0.05;
    }
    // micro
    return nonSodiumMicroKeys.reduce((s, k) => s + Math.min(100, Math.max(0, microDvPct(k, mi[k]))), 0);
  }

  const picks = [];
  const pickedIds = new Set();
  for (const role of roles) {
    if (picks.length >= maxAdd) break;
    let best = null;
    let bestScore = -Infinity;
    for (const f of candidates) {
      if (pickedIds.has(f.id)) continue;
      const s = scoreForRole(f, role);
      if (s > bestScore) {
        bestScore = s;
        best = f;
      }
    }
    if (best && bestScore > -Infinity) {
      picks.push({ food: best, role });
      pickedIds.add(best.id);
    }
  }
  return picks;
}

const NUT_SEED_IDS = ["almonds", "walnuts", "hazelnuts", "pistachios", "sunflower-seeds", "chia-seeds", "flaxseed", "peanut-butter", "cashews", "pecans"];
const LEGUME_LIKE_PROTEIN_IDS = ["tofu", "tempeh"];
// Foods whose protein is mostly/entirely collagen-derived rather than
// muscle-meat myosin/actin — currently just bone broth, but written as a
// list so future additions (gelatin, skin-on slow-cooked cuts, bone-in
// preparations) plug in the same way.
const COLLAGEN_RICH_IDS = ["bone-broth"];

function aminoProfileKey(food) {
  if (COLLAGEN_RICH_IDS.includes(food.id)) return "collagen";
  if (LEGUME_LIKE_PROTEIN_IDS.includes(food.id)) return "legume";
  if (food.cat === "protein") return "complete_animal";
  if (food.cat === "legume") return "legume";
  if (food.cat === "grain") return "grain";
  if (food.cat === "fat") return NUT_SEED_IDS.includes(food.id) ? "nut_seed" : "complete_animal";
  return "legume";
}

function aminoAcidsAtPortion(food, grams) {
  const proteinG = (food.protein100 * grams) / 100;
  const profile = AMINO_PROFILES[aminoProfileKey(food)];
  const result = {};
  let essentialSum = 0;
  AMINO_KEYS_ORDERED.forEach((k) => {
    if (k === "other") return;
    const v = proteinG * (profile[k] || 0);
    result[k] = v;
    essentialSum += v;
  });
  result.other = Math.max(0, proteinG - essentialSum);
  return result;
}

// Simplified Amino Acid Score: each essential amino acid's fraction (g per g
// protein) is compared to the FAO/WHO/UNU (2007) suggested adult reference
// pattern; the lowest ratio across all nine is the "limiting" amino acid and
// becomes the overall score (capped at 100%) — the same logic PDCAAS uses,
// minus the digestibility correction. This scores the protein SOURCE TYPE
// (animal/dairy, legume, grain, or nut/seed), not a lab assay of this food.
const REFERENCE_AA_PATTERN = { his: 0.015, ile: 0.03, leu: 0.059, lys: 0.045, met: 0.022, phe: 0.038, thr: 0.023, trp: 0.006, val: 0.039 };

function proteinQualityScore(food) {
  const profile = AMINO_PROFILES[aminoProfileKey(food)];
  let minRatio = Infinity;
  let limitingKey = null;
  Object.keys(REFERENCE_AA_PATTERN).forEach((k) => {
    const ratio = (profile[k] || 0) / REFERENCE_AA_PATTERN[k];
    if (ratio < minRatio) {
      minRatio = ratio;
      limitingKey = k;
    }
  });
  return { score: Math.min(1, minRatio), limitingKey, rawRatio: minRatio };
}

// True/ileal digestibility by protein-source type — approximate, representative
// figures drawn from the ranges commonly cited for PDCAAS/DIAAS calculations
// (e.g. egg/dairy/meat ~90-98%, legumes ~78-88%, grains ~85-95%, nuts/seeds
// ~80-90%). One value per source type, not a per-food lab measurement.
const DIGESTIBILITY_BY_PROFILE = { complete_animal: 0.95, legume: 0.85, grain: 0.9, nut_seed: 0.85, collagen: 0.97 };

// Three established ways to score protein quality, all derivable from the
// amino acid profile plus an approximate digestibility figure:
// - Amino Acid Score / "Chemical Score" (score, uncorrected): oldest method,
//   just the limiting amino acid's ratio to the reference pattern.
// - PDCAAS: AAS x digestibility, capped at 100% — the FDA/FAO standard from
//   1991-2013.
// - DIAAS: conceptually similar but FAO's current (2013-) recommended
//   replacement, using ileal (not fecal) digestibility and NOT capped at
//   100% — so genuinely excellent proteins can score above 100.
// Older methods like Biological Value and Protein Efficiency Ratio are real
// and still referenced, but they come from feeding trials, not from amino
// acid composition — they aren't something this tool can compute.
function foodProteinQuality(food) {
  const { score, limitingKey, rawRatio } = proteinQualityScore(food);
  const digestibility = DIGESTIBILITY_BY_PROFILE[aminoProfileKey(food)];
  return { score, limitingKey, rawRatio, digestibility };
}

function qualityTier(score) {
  if (score >= 1) return { label: { en: "Complete", fa: "کامل" }, color: "#1d9e75" };
  if (score >= 0.8) return { label: { en: "Good", fa: "خوب" }, color: "#8bc24a" };
  if (score >= 0.6) return { label: { en: "Moderate", fa: "متوسط" }, color: "#e0a83c" };
  return { label: { en: "Limited", fa: "محدود" }, color: "#d4534f" };
}

// connective tissue (collagen-rich, glycine-dense). This isn't a knock on
// muscle meat — it's a balance point some functional-medicine sources
// raise: pair it with collagen-rich sources rather than making it the only
// animal protein in the diet.
const MUSCLE_MEAT_IDS = [

// most functional-medicine sources flag distinctly from fresh meat, due to
// nitrites/nitrates, high sodium, and processing byproducts, separate from
// whatever the protein's amino acid content looks like.
const PROCESSED_PROTEIN_IDS = ["bacon", "hot-dog", "sausage", "ham", "chorizo", "prosciutto", "salami", "pepperoni", "beef-jerky", "bratwurst", "bologna", "liverwurst", "gravlax"];

// Alternate 0-10 protein-quality lens, built around what functional-
// medicine sources tend to add on top of plain essential-amino-acid
// completeness:
//
// 1. Essential-amino-acid match still counts, but isn't treated as a hard
//    cap the way PDCAAS-style scoring does — a food that's decent-but-not-
//    perfect isn't crushed by a single limiting amino acid the way the
//    conventional score above deliberately is.
// 2. Processing level is judged on top of amino content — cured/processed
//    meat is penalized specifically for the nitrite/sodium/processing
//    pattern (WHO/IARC 2015), not for its protein quality.
// 3. Collagen/glycine balance — a genuinely distinctive functional-
//    medicine angle absent from conventional scoring entirely, since
//    PDCAAS/DIAAS only track the nine essential aminos and treat glycine
//    as nutritionally irrelevant. Collagen-rich sources (bone broth,
//    skin-on slow-cooked cuts) are valued here for exactly what makes them
//    score LOW on strict completeness (almost no tryptophan) — they're
//    judged by what they're actually eaten for, not by whether they're a
//    complete protein on their own. Muscle-meat-only eating gets a small,
//    explanatory nudge rather than a penalty.
function functionalProteinQualityFromProfile({ aminoScore, isProcessed, isCollagenRich, isMuscleMeat }) {
  let score;
  const notes = [];

  if (isCollagenRich) {
    score = 7.5;
    notes.push({
      ok: true,
      text: {
        en: "Collagen/gelatin-rich — exactly the glycine- and proline-dense source functional medicine suggests balancing muscle meat with.",
        fa: "غنی از کلاژن/ژلاتین — دقیقاً همان منبع سرشار از گلایسین و پرولین که طب عملکردی توصیه می‌کند در کنار گوشت عضلانی مصرف شود.",
      },
    });
    notes.push({
      ok: null,
      text: {
        en: "Low in essential-amino completeness on its own (almost no tryptophan) — but completeness isn't really what this kind of food is valued for here.",
        fa: "از نظر کامل بودن اسیدهای آمینه ضروری به‌تنهایی پایین است (تقریباً بدون تریپتوفان) — اما این ویژگی دلیل اصلی ارزش این نوع خوراکی در این نگاه نیست.",
      },
    });
  } else {
    score = 4 + aminoScore * 6;
    if (aminoScore >= 0.9) {
      notes.push({ ok: true, text: { en: "Strong essential amino acid match.", fa: "تطابق قوی اسیدهای آمینه ضروری." } });
    } else if (aminoScore >= 0.6) {
      notes.push({ ok: null, text: { en: "Decent essential amino acid match — weighted less strictly here than a PDCAAS-style hard cap.", fa: "تطابق نسبتاً خوب اسیدهای آمینه ضروری — با سخت‌گیری کمتری نسبت به یک سقف سخت‌گیرانه به‌سبک PDCAAS وزن‌دهی شده." } });
    } else {
      notes.push({ ok: null, text: { en: "Limited by its essential amino acids on their own, but this lens doesn't let one limiting amino acid cap the whole score the way a strict chemical score would.", fa: "از نظر اسیدهای آمینه ضروری به‌تنهایی محدود است، اما این نگاه اجازه نمی‌دهد یک اسید آمینه محدودکننده کل امتیاز را مانند یک امتیاز شیمیایی سخت‌گیرانه محدود کند." } });
    }

    if (isProcessed) {
      score -= 3;
      notes.push({
        ok: false,
        text: {
          en: "A cured/processed meat — flagged for the nitrite/sodium/processing pattern itself (WHO/IARC 2015), separate from its amino acid content.",
          fa: "گوشتی فرآوری‌شده/دودی — به‌دلیل خود الگوی نیترات/سدیم/فرآوری (WHO/IARC 2015) علامت‌گذاری شده، جدا از محتوای اسید آمینه آن.",
        },
      });
    }

    if (isMuscleMeat) {
      score -= 0.5;
      notes.push({
        ok: null,
        text: {
          en: "A muscle-meat source — comparatively low in glycine/proline. Some functional-medicine sources suggest balancing muscle meat with collagen-rich sources (bone broth, skin-on slow-cooked cuts) rather than relying on it alone.",
          fa: "منبعی از گوشت عضلانی — نسبتاً کم‌گلایسین/پرولین. برخی منابع طب عملکردی توصیه می‌کنند گوشت عضلانی را با منابع غنی از کلاژن (آبگوشت استخوان، تکه‌های پوست‌دار آرام‌پز) متعادل کنید، نه اینکه تنها به آن تکیه کنید.",
        },
      });
    }
  }

  score = Math.max(0, Math.min(10, score));
  return { score: Math.round(score * 10) / 10, aminoScore, isProcessed, isCollagenRich, isMuscleMeat, notes };
}

function computeFunctionalProteinScore(food) {
  if (!food.protein100 || food.protein100 < 1) return null;
  const { score: aminoScore } = proteinQualityScore(food);
  const isProcessed = PROCESSED_PROTEIN_IDS.includes(food.id);
  const isCollagenRich = COLLAGEN_RICH_IDS.includes(food.id);
  const isMuscleMeat = MUSCLE_MEAT_IDS.includes(food.id);
  return functionalProteinQualityFromProfile({ aminoScore, isProcessed, isCollagenRich, isMuscleMeat });
}

function fatProfileKey(food) {
  if (OLIVE_MUFA_IDS.includes(food.id)) return "olive_avocado";
  if (ALA_EXTREME_IDS.includes(food.id)) return "ala_extreme";
  if (ALA_WALNUT_IDS.includes(food.id)) return "ala_walnut";
  if (COCONUT_FAT_IDS.includes(food.id)) return "coconut";
  if (FISH_MARINE_IDS.includes(food.id)) return "fish_marine";
  if (RUMINANT_FAT_IDS.includes(food.id)) return "ruminant_animal";
  if (POULTRY_EGG_FAT_IDS.includes(food.id)) return "poultry_egg";
  if (food.cat === "fat") return "seed_oil_nut";
  if (food.cat === "protein") return "poultry_egg";
  return "grain_default";
}

// Splits a food's own satFat100/mono100/poly100 (already-real per-food
// values) into named fatty acids using its source-type profile. Trans fat
// is carved out of the monounsaturated share (industrial/biohydrogenation
// trans fat originates from unsaturated fat), and "other" absorbs whatever
// each profile's fractions don't name, so the slices always sum back to
// exactly the food's real total fat — no double counting.
function fatAcidsAtPortion(food, grams) {
  const satG = (food.satFat100 * grams) / 100;
  const monoG = (food.mono100 * grams) / 100;
  const polyG = (food.poly100 * grams) / 100;
  const totalFatG = satG + monoG + polyG;
  const profile = FAT_PROFILES[fatProfileKey(food)];

  const palmitic = satG * profile.sat.palmitic;
  const stearic = satG * profile.sat.stearic;
  const lauric = satG * profile.sat.lauric;
  const otherSat = Math.max(0, satG - palmitic - stearic - lauric);

  const oleic = monoG * profile.monoOleicFrac;
  const otherMonoRaw = Math.max(0, monoG - oleic);

  const linoleic = polyG * profile.poly.linoleic;
  const ala = polyG * profile.poly.ala;
  const omega3_marine = polyG * profile.poly.omega3_marine;
  const otherPoly = Math.max(0, polyG - linoleic - ala - omega3_marine);

  // trans fat is carved out of the leftover monounsaturated share —
  // industrial/biohydrogenation trans fat originates from unsaturated fat,
  // so this keeps the slices summing back to exactly this food's real
  // total fat (satG + monoG + polyG), no double counting.
  const trans = Math.min(otherMonoRaw, totalFatG * profile.transFrac);
  const otherMono = Math.max(0, otherMonoRaw - trans);

  return {
    palmitic,
    stearic,
    lauric,
    oleic,
    linoleic,
    ala,
    omega3_marine,
    trans,
    other: otherSat + otherMono + otherPoly,
  };
}

function fatQualityFromShares(satShare, transShare, omega3Share, unsatShare) {
  let score = 10;
  const notes = [];

  // Saturated-fat penalty scales continuously with how far past ~35% of
  // total fat a food sits, rather than a flat step — this is what keeps a
  // food that's, say, 55% saturated from scoring the same as one that's
  // 90%+ saturated (coconut oil, butter), which a two-tier system would
  // otherwise conflate.
  const satExcess = Math.max(0, satShare - 0.35);
  const satPenalty = Math.min(6, satExcess * 9);
  score -= satPenalty;
  if (satShare >= 0.55) {
    notes.push({ ok: false, text: { en: "Mostly saturated fat.", fa: "بیشتر چربی اشباع است." } });
  } else if (satShare >= 0.35) {
    notes.push({ ok: null, text: { en: "A moderate share of saturated fat.", fa: "سهم متوسطی از چربی اشباع." } });
  } else {
    notes.push({ ok: true, text: { en: "Mostly unsaturated fat.", fa: "بیشتر چربی غیراشباع است." } });
  }

  if (transShare > 0.005) {
    score -= 3;
    notes.push({ ok: false, text: { en: "Contains some trans fat — no intake level is considered safe.", fa: "حاوی مقداری چربی ترانس — هیچ سطح مصرفی بی‌خطر در نظر گرفته نمی‌شود." } });
  } else {
    notes.push({ ok: true, text: { en: "No meaningful trans fat.", fa: "چربی ترانس قابل‌توجهی ندارد." } });
  }

  if (omega3Share >= 0.15) {
    score += 1.5;
    notes.push({ ok: true, text: { en: "A strong source of omega-3 fat.", fa: "منبع خوبی از چربی امگا-۳." } });
  } else if (omega3Share >= 0.03) {
    score += 0.5;
    notes.push({ ok: true, text: { en: "Some omega-3 fat.", fa: "مقداری چربی امگا-۳." } });
  }

  if (unsatShare >= 0.75) score += 0.5;

  score = Math.max(0, Math.min(10, score));
  return { score: Math.round(score * 10) / 10, satShare, transShare, omega3Share, notes };
}

// Heuristic 0-10 fat QUALITY score — deliberately not a score of how much
// fat a food has, since current guidance (AHA, WHO, the 2020-2025 Dietary
// Guidelines for Americans) has shifted from "total fat" targets to fat
// COMPOSITION: replacing saturated fat with unsaturated fat lowers LDL-C
// and cardiovascular risk in randomized trials; the WHO REPLACE initiative
// treats industrial trans fat as having no safe intake level; omega-3
// intake (ALA and especially marine EPA/DHA) is independently associated
// with cardiovascular benefit. The omega-6:omega-3 ratio specifically is
// more debated in the literature than the other three factors, so it's
// given a smaller weight here.
function computeFatQualityScore(food) {
  const totalFat = food.satFat100 + food.mono100 + food.poly100;
  if (!totalFat || totalFat < 0.5) return null;
  const acids = fatAcidsAtPortion(food, 100);
  const satShare = food.satFat100 / totalFat;
  const transShare = acids.trans / totalFat;
  const omega3Share = (acids.ala + acids.omega3_marine) / totalFat;
  const unsatShare = (food.mono100 + food.poly100) / totalFat;
  return fatQualityFromShares(satShare, transShare, omega3Share, unsatShare);
}

// Foods most often discussed in functional/ancestral-nutrition literature
// as "quality of the source matters more than the raw saturated-fat
// number" — pastured dairy and ruminant meat, where grass-fed/pastured
// vs. conventional feeding measurably shifts the fat's own composition
// (more CLA, more omega-3, more vitamin K2). This app has no way to know
// whether a specific product actually IS grass-fed/organic, so this list
// only flags which foods the question is even relevant to — the score
// below says so explicitly rather than pretending to know the sourcing.
const PASTURED_RELEVANT_IDS = [...DAIRY_LACTOSE_IDS, "butter", "beef-steak", "ground-beef", "lamb", "bison"];

// Alternate 0-10 fat-quality lens, built around two specific departures
// from the conventional AHA/WHO-informed score above, both drawn from more
// recent functional/integrative-medicine literature:
//
// 1. Saturated fat is weighted far more lightly. Newer meta-analyses
//    (e.g. Astrup et al. 2020, PURE study 2017) find the SFA→LDL→CVD chain
//    weaker and more food-matrix-dependent than once assumed — a gram of
//    saturated fat in cheese or yogurt doesn't behave like a gram in a
//    processed snack. The penalty here only engages at a much higher
//    saturated share, and is softened further for foods where a
//    grass-fed/pastured source is plausible (see PASTURED_RELEVANT_IDS).
// 2. The omega-6:omega-3 ratio becomes the dominant factor, not just
//    absolute omega-3 content. Functional-medicine sources (Simopoulos'
//    ratio hypothesis, Weston A. Price-adjacent literature) argue the
//    balance between these competing eicosanoid precursors matters more
//    than either fat alone — modern seed-oil-heavy diets often run
//    15:1-20:1 versus an ancestral/target ratio closer to 1:1-4:1.
//
// Trans fat is penalized just as heavily as in the conventional score —
// no functional-medicine framework treats industrial trans fat kindly.
function functionalFatQualityFromShares(satShare, transShare, omega6, omega3, sourcingState) {
  let score = 10;
  const notes = [];
  const isPasturedRelevant = sourcingState !== "not_applicable";

  const satExcess = Math.max(0, satShare - 0.55);
  let satPenalty = Math.min(2.5, satExcess * 4);
  if (sourcingState === "grassfed") satPenalty *= 0.4;
  else if (sourcingState === "unknown_eligible") satPenalty *= 0.6;
  score -= satPenalty;
  if (satShare >= 0.55) {
    let text;
    if (sourcingState === "grassfed") {
      text = {
        en: "Mostly saturated fat, but confirmed grass-fed/pastured/organic — its real nutrient profile (more CLA, omega-3, K2) genuinely earns the lighter treatment here, not just an assumption.",
        fa: "بیشتر چربی اشباع است، اما منبع علف‌خوار/ارگانیک بودن آن تأیید شده — نمایه واقعی مواد مغذی آن (CLA، امگا-۳، K2 بیشتر) واقعاً سزاوار این رویکرد سبک‌تر است، نه فقط یک فرض.",
      };
    } else if (sourcingState === "conventional") {
      text = {
        en: "Mostly saturated fat from a confirmed conventional source — the softer treatment this lens usually gives saturated fat doesn't apply as strongly here.",
        fa: "بیشتر چربی اشباع است و منبع آن به‌صورت معمولی (غیرعلف‌خوار) تأیید شده — رویکرد سبک‌تری که این نگاه معمولاً به چربی اشباع می‌دهد، اینجا به همان اندازه اعمال نمی‌شود.",
      };
    } else if (sourcingState === "unknown_eligible") {
      text = {
        en: "Mostly saturated fat — if this is grass-fed/pastured/organic, its real nutrient profile is typically even better than a plain percentage suggests. Mark the sourcing above if you know it.",
        fa: "بیشتر چربی اشباع است — اگر از دام علف‌خوار/ارگانیک باشد، نمایه واقعی مواد مغذی آن معمولاً بهتر از درصد ساده است. اگر می‌دانید، منبع را در بالا مشخص کنید.",
      };
    } else {
      text = { en: "Mostly saturated fat — newer research treats this as a smaller concern than once thought, especially outside processed foods.", fa: "بیشتر چربی اشباع است — پژوهش‌های جدیدتر این را نگرانی کوچک‌تری از آنچه پیش‌تر تصور می‌شد می‌دانند، به‌ویژه خارج از خوراکی‌های فرآوری‌شده." };
    }
    notes.push({ ok: sourcingState === "grassfed" ? true : sourcingState === "conventional" ? false : null, text });
  } else {
    notes.push({ ok: true, text: { en: "Saturated share isn't a major factor in this lens.", fa: "سهم اشباع در این نگاه عامل مهمی نیست." } });
  }

  if (transShare > 0.005) {
    score -= 3;
    notes.push({ ok: false, text: { en: "Contains some trans fat — every framework, including this one, treats this as worth avoiding.", fa: "حاوی مقداری چربی ترانس — همه رویکردها، از جمله این یکی، اجتناب از آن را توصیه می‌کنند." } });
  } else {
    notes.push({ ok: true, text: { en: "No meaningful trans fat.", fa: "چربی ترانس قابل‌توجهی ندارد." } });
  }

  const ratio = omega3 > 0 ? omega6 / omega3 : omega6 > 0 ? Infinity : null;
  if (ratio != null) {
    if (ratio <= 4) {
      score += 2;
      notes.push({ ok: true, text: { en: `Omega-6:omega-3 ratio ≈ ${ratio.toFixed(1)}:1 — close to the ancestral/target range.`, fa: `نسبت امگا-۶ به امگا-۳ ≈ ${ratio.toFixed(1)}:۱ — نزدیک به بازه هدف.` } });
    } else if (ratio <= 10) {
      score += 0.5;
      notes.push({ ok: null, text: { en: `Omega-6:omega-3 ratio ≈ ${ratio.toFixed(1)}:1 — moderately skewed toward omega-6.`, fa: `نسبت امگا-۶ به امگا-۳ ≈ ${ratio.toFixed(1)}:۱ — تا حدی به سمت امگا-۶ متمایل است.` } });
    } else if (ratio <= 20) {
      score -= 1.5;
      const ratioText = Number.isFinite(ratio) ? ratio.toFixed(0) : "20+";
      notes.push({ ok: false, text: { en: `Omega-6:omega-3 ratio ≈ ${ratioText}:1 — typical of a modern seed-oil-heavy diet, well above the ~4:1 target.`, fa: `نسبت امگا-۶ به امگا-۳ ≈ ${ratioText}:۱ — مشابه رژیم غذایی مدرن پر از روغن‌های دانه‌ای، بسیار بالاتر از هدف ~۴:۱.` } });
    } else {
      score -= 3;
      notes.push({ ok: false, text: { en: "Omega-6:omega-3 ratio is very high (20:1+) — this fat is almost entirely omega-6 with little to balance it.", fa: "نسبت امگا-۶ به امگا-۳ بسیار بالاست (بیش از ۲۰:۱) — این چربی تقریباً یکسره امگا-۶ است و چیزی برای موازنه آن نیست." } });
    }
  }

  if (omega3 >= 0.3) score += 0.5;

  score = Math.max(0, Math.min(10, score));
  return { score: Math.round(score * 10) / 10, satShare, transShare, ratio, sourcingState, isPasturedRelevant, notes };
}

function computeFunctionalFatScore(food, sourcingOverride) {
  const totalFat = food.satFat100 + food.mono100 + food.poly100;
  if (!totalFat || totalFat < 0.5) return null;
  const acids = fatAcidsAtPortion(food, 100);
  const satShare = food.satFat100 / totalFat;
  const transShare = acids.trans / totalFat;
  const omega6 = acids.linoleic;
  const omega3 = acids.ala + acids.omega3_marine;
  const isPasturedRelevant = PASTURED_RELEVANT_IDS.includes(food.id);
  const sourcingState = !isPasturedRelevant ? "not_applicable" : sourcingOverride === "grassfed" || sourcingOverride === "conventional" ? sourcingOverride : "unknown_eligible";
  return functionalFatQualityFromShares(satShare, transShare, omega6, omega3, sourcingState);
}

const CANE_SWEETENED_IDS = [

// Minimally-processed natural sweeteners — honey, maple syrup, molasses —
// retain trace minerals, antioxidants, or (for honey specifically)
// enzymes and prebiotic oligosaccharides from their source, distinct from
// a fully isolated/industrially extracted sweetener (table sugar, HFCS in
// soda, agave syrup — despite agave's "natural" branding, it's heavily
// processed and concentrated to nearly pure fructose with none of
// honey/maple's offsetting trace content). This is specifically a
// functional-medicine distinction: WHO's free-sugars guideline (used by
// the conventional lens) makes no such exception — honey counts as a free
// sugar exactly like table sugar there, and REFINED_SWEETENER_IDS /
// computeCarbScore deliberately still includes it for that reason. Only
// functionalCarbQualityFromProfile below treats this list differently.
const NATURAL_SWEETENER_IDS = [...HONEY_IDS, ...MAPLE_IDS, ...MOLASSES_IDS, "coconut-sugar"];
const DRIED_FRUIT_IDS = ["dates", "raisins", "dried-apricot", "dried-fig", "jujube", "barberries", "russian-olive"];

function sugarProfileKey(food) {
  if (PURE_GLUCOSE_IDS.includes(food.id)) return "pure_glucose";
  if (PURE_SUCROSE_IDS.includes(food.id)) return "pure_sucrose";
  if (HONEY_IDS.includes(food.id)) return "honey_type";
  if (AGAVE_IDS.includes(food.id)) return "agave_type";
  if (MOLASSES_IDS.includes(food.id)) return "molasses_type";
  if (MAPLE_IDS.includes(food.id)) return "maple_type";
  if (SODA_IDS.includes(food.id)) return "soda_hfcs";
  if (MALT_IDS.includes(food.id)) return "malt_type";
  if (DAIRY_LACTOSE_IDS.includes(food.id)) return "dairy_lactose";
  if (CANE_SWEETENED_IDS.includes(food.id)) return "cane_sweetened";
  if (DRIED_FRUIT_IDS.includes(food.id)) return "dried_fruit";
  if (ROOT_VEG_IDS.includes(food.id)) return "root_veg";
  if (food.cat === "fruit") return "fruit_default";
  return "mixed_default";
}

// Conventional 0-10 carbohydrate-quality lens — the mainstream dietary-
// guideline framing, built from different named standards than the
// functional-medicine lens below on purpose, so the two can genuinely
// disagree instead of being cosmetic variations on each other (same
// pairing already used for protein — foodProteinQuality vs.
// functionalProteinQualityFromProfile — and fat — fatQualityFromShares
// vs. functionalFatQualityFromShares).
//
// 1. Glycemic index is the primary factor here (the reverse emphasis of
//    the functional lens), using the same Low (<=55) / Medium (56-69) /
//    High (>=70) tiers the University of Sydney GI database and WHO/FAO
//    use to classify foods — the standard conventional reference for how
//    fast a carbohydrate raises blood glucose.
// 2. Fiber is judged against FDA nutrition-labeling density thresholds —
//    the actual rule behind "good source of fiber" (~3g/100g) and
//    "excellent/high source" (~5g/100g) claims on real food labels — not
//    the fiber-to-carb ratio the functional lens uses.
// 3. Added/free sugar follows the WHO (2015) free-sugars guideline: limit
//    free sugars, ideally to under 10% of daily energy. Sugar naturally
//    intrinsic to a whole fruit, vegetable, or dairy food isn't a "free
//    sugar" by WHO's own definition and isn't counted against this score
//    the way added or extracted sugar is.
// 4. Whole grains follow the Dietary Guidelines for Americans' literal,
//    widely-taught advice to "make at least half your grains whole" —
//    scoped only to the grain category, not the broader whole-food-matrix
//    idea the functional lens applies across fruit, veg, and legumes too.
function carbQualityFromProfile({ fiberPer100, sugarPer100, gi, isAddedSugar, isWholeGrain, isGrain }) {
  let score = 5;
  const notes = [];

  if (gi <= 55) {
    score += 2.5;
    notes.push({ ok: true, text: { en: `Low glycemic index (${gi}) — the primary factor in this lens.`, fa: `شاخص گلایسمی پایین (${gi}) — مهم‌ترین عامل در این نگاه.` } });
  } else if (gi <= 69) {
    score += 0.5;
    notes.push({ ok: null, text: { en: `Medium glycemic index (${gi}).`, fa: `شاخص گلایسمی متوسط (${gi}).` } });
  } else {
    score -= 2.5;
    notes.push({ ok: false, text: { en: `High glycemic index (${gi}) — the primary factor in this lens.`, fa: `شاخص گلایسمی بالا (${gi}) — مهم‌ترین عامل در این نگاه.` } });
  }

  if (fiberPer100 >= 5) {
    score += 2;
    notes.push({ ok: true, text: { en: `"Excellent/high source" of fiber (${round(fiberPer100, 1)}g/100g) by FDA labeling thresholds.`, fa: `«منبع عالی/غنی» فیبر (${round(fiberPer100, 1)} گرم در ۱۰۰ گرم) طبق آستانه‌های برچسب‌گذاری FDA.` } });
  } else if (fiberPer100 >= 3) {
    score += 1;
    notes.push({ ok: true, text: { en: `A "good source" of fiber (${round(fiberPer100, 1)}g/100g) by FDA labeling thresholds.`, fa: `«منبع خوب» فیبر (${round(fiberPer100, 1)} گرم در ۱۰۰ گرم) طبق آستانه‌های برچسب‌گذاری FDA.` } });
  } else if (fiberPer100 > 0) {
    notes.push({ ok: null, text: { en: `Below the density most labeling standards call a "good source" of fiber (${round(fiberPer100, 1)}g/100g).`, fa: `چگالی فیبر کمتر از حدی که اکثر استانداردهای برچسب‌گذاری «منبع خوب» می‌نامند (${round(fiberPer100, 1)} گرم در ۱۰۰ گرم).` } });
  } else {
    score -= 0.5;
    notes.push({ ok: false, text: { en: "No fiber.", fa: "بدون فیبر." } });
  }

  if (isAddedSugar && sugarPer100 >= 10) {
    score -= 2.5;
    notes.push({
      ok: false,
      text: {
        en: `${round(sugarPer100, 1)}g/100g of added/free sugar — WHO recommends limiting free sugars, ideally to under 10% of daily energy.`,
        fa: `${round(sugarPer100, 1)} گرم در ۱۰۰ گرم قند افزوده/آزاد — سازمان جهانی بهداشت توصیه می‌کند قندهای آزاد به کمتر از ۱۰٪ انرژی روزانه محدود شود.`,
      },
    });
  } else if (isAddedSugar && sugarPer100 > 0) {
    score -= 1;
    notes.push({ ok: null, text: { en: `Contains some added/free sugar (${round(sugarPer100, 1)}g/100g).`, fa: `مقداری قند افزوده/آزاد دارد (${round(sugarPer100, 1)} گرم در ۱۰۰ گرم).` } });
  } else if (sugarPer100 > 0) {
    notes.push({
      ok: true,
      text: {
        en: `Sugar here is naturally occurring within a whole food, not a WHO "free sugar" — not counted against this score the way added sugar is.`,
        fa: `قند این خوراکی به‌طور طبیعی در یک خوراکی کامل وجود دارد، نه «قند آزاد» طبق تعریف سازمان جهانی بهداشت — مانند قند افزوده در این امتیاز محاسبه نمی‌شود.`,
      },
    });
  }

  if (isGrain) {
    if (isWholeGrain) {
      score += 1;
      notes.push({
        ok: true,
        text: {
          en: "A whole grain — matches the Dietary Guidelines for Americans' advice to make at least half of grains whole.",
          fa: "غلات کامل — مطابق با توصیه دستورالعمل‌های غذایی آمریکا برای اینکه حداقل نیمی از غلات مصرفی کامل باشد.",
        },
      });
    } else {
      score -= 1;
      notes.push({
        ok: false,
        text: {
          en: "A refined grain — the kind dietary guidelines suggest limiting in favor of whole grains.",
          fa: "غلات تصفیه‌شده — نوعی که دستورالعمل‌های غذایی توصیه می‌کنند به نفع غلات کامل محدود شود.",
        },
      });
    }
  }

  score = Math.max(0, Math.min(10, score));
  return { score: Math.round(score * 10) / 10, gi, fiberPer100, sugarPer100, isAddedSugar, isWholeGrain, isGrain, notes };
}

function computeCarbScore(food) {
  const totalCarb = food.carbs100 + food.soluble100 + food.insoluble100;
  if (!totalCarb || totalCarb < 1) return null;
  const fiberPer100 = food.fiber100 != null ? food.fiber100 : food.soluble100 + food.insoluble100;
  const sugarPer100 = food.sugar100 || 0;
  // Same isolated/refined classification the functional lens uses, read
  // here through WHO's "free sugars" definition instead: added or
  // extracted sugar counts, sugar intrinsic to an intact whole food
  // doesn't — a different named standard, same underlying fact per food.
  // Same isolated/added-sugar classification the functional lens's
  // REFINED_SWEETENER_IDS list already captures, read here through WHO's
  // "free sugars" definition instead — added or extracted sugar counts,
  // sugar intrinsic to an intact whole food doesn't. Deliberately does NOT
  // include REFINED_STARCH_IDS: a refined grain's starch isn't "added
  // sugar" by WHO's definition — that's the separate isWholeGrain/DGA
  // check below, and conflating the two would double-penalize plain
  // refined bread/rice for a sugar problem they don't actually have.
  const isAddedSugar = REFINED_SWEETENER_IDS.includes(food.id);
  const isWholeGrain = WHOLE_GRAIN_IDS.includes(food.id);
  const isGrain = food.cat === "grain";
  return carbQualityFromProfile({ fiberPer100, sugarPer100, gi: food.gi, isAddedSugar, isWholeGrain, isGrain });
}

// Alternate 0-10 carbohydrate-quality lens, built around what functional-
// medicine sources tend to emphasize over plain glycemic index/load:
//
// 1. Fiber-to-carbohydrate ratio is the dominant factor, not glycemic
//    index. A high-GI whole food eaten with its natural fiber intact
//    digests very differently from the same sugars isolated — fiber
//    (soluble especially) physically slows glucose absorption and feeds
//    short-chain-fatty-acid-producing gut bacteria, an axis conventional
//    GI/GL scoring doesn't capture at all.
// 2. Whole-food "matrix" vs. isolated/refined source matters on top of the
//    numbers themselves — the same sugars behave differently bound in a
//    cell wall (apple) versus stripped of it (apple juice, table sugar).
// 3. Fructose load is judged in context, not flatly. High fructose share
//    is treated as a real concern (hepatic metabolism, insulin resistance
//    literature) specifically when it arrives isolated (soda, agave,
//    refined sugar) — but not when bound in a fiber-rich whole fruit,
//    which functional-medicine sources generally don't treat as a
//    fructose-load problem the way added/isolated fructose is.
//
// Glycemic index still contributes, just far more lightly than fiber
// content and food-matrix status — the reverse emphasis of the app's
// primary GI/GL numbers, intentionally, as a second opinion.
function functionalCarbQualityFromProfile({ totalCarb, fiber, gi, fructoseShare, isRefined, isWholeFood, isNaturalSweetener }) {
  let score = 5;
  const notes = [];

  const fiberRatio = totalCarb > 0 ? fiber / totalCarb : 0;
  if (fiberRatio >= 0.2) {
    score += 3.5;
    notes.push({ ok: true, text: { en: `Very high fiber-to-carb ratio (${Math.round(fiberRatio * 100)}%) — most of this carbohydrate arrives bundled with fiber, the single biggest factor in this lens.`, fa: `نسبت فیبر به کربوهیدرات بسیار بالا (٪${Math.round(fiberRatio * 100)}) — بیشتر این کربوهیدرات همراه با فیبر می‌رسد، مهم‌ترین عامل در این نگاه.` } });
  } else if (fiberRatio >= 0.1) {
    score += 2.5;
    notes.push({ ok: true, text: { en: `Good fiber-to-carb ratio (${Math.round(fiberRatio * 100)}%).`, fa: `نسبت فیبر به کربوهیدرات خوب (٪${Math.round(fiberRatio * 100)}).` } });
  } else if (fiberRatio >= 0.05) {
    score += 1;
    notes.push({ ok: null, text: { en: `Some fiber alongside the carbohydrate (${Math.round(fiberRatio * 100)}%).`, fa: `مقداری فیبر همراه کربوهیدرات (٪${Math.round(fiberRatio * 100)}).` } });
  } else if (fiberRatio > 0) {
    score += 0.25;

  ...f,
  color: `hsl(${Math.round((i * 137.508) % 360)}, 68%, 56%)`,

// ---------------------------------------------------------------------------
// Natural-language plate commands typed into the search box, e.g.
// "combine Russian olive, Jujube and hemp into a plate". Deliberately
// requires BOTH an action verb (combine/add/make/mix/...) AND a "plate"-ish
// word (plate/meal/dish/bowl, or their Farsi equivalents) to appear
// somewhere in the text before treating it as a command at all — this is
// what keeps an ordinary food search like "chicken and rice" from ever
// being misread as a command.
// ---------------------------------------------------------------------------
const PLATE_COMMAND_VERB_RE = /\b(combine|add|make|create|build|assemble|put|mix|prepare|gather|compose|form|load|fill|arrange|stack|toss|set(?:\s+up)?)\b/i;
const PLATE_COMMAND_FA_VERB_RE = /ترکیب|اضافه|بساز|درست|بریز|بذار|بگذار|آماده|جمع/;
const PLATE_COMMAND_PLATE_RE = /\b(plate|meal|dish|bowl)\b/i;
const PLATE_COMMAND_FA_PLATE_RE = /بشقاب|وعده|کاسه|ظرف/;

function parsePlateCommand(rawText) {
  let text = (rawText || "").trim();
  if (!text) return null;
  const hasVerb = PLATE_COMMAND_VERB_RE.test(text) || PLATE_COMMAND_FA_VERB_RE.test(text);
  const hasPlateWord = PLATE_COMMAND_PLATE_RE.test(text) || PLATE_COMMAND_FA_PLATE_RE.test(text);
  if (!hasVerb || !hasPlateWord) return null;

  // Peel off a leading verb phrase ("combine ", "add ", "please mix ", "set up ", ...)
  text = text.replace(/^\s*(please\s+)?(combine|add|create|make|build|assemble|put|mix|prepare|gather|compose|form|load|fill|arrange|stack|toss|set\s+up|set)\s+/i, "");
  // Peel off a leading "(a/my) plate/meal/dish/bowl with/of/out of " phrase
  // ("make A PLATE WITH X, Y" / "make a bowl OUT OF X, Y")
  text = text.replace(/^\s*(a\s+|my\s+)?(plate|meal|dish|bowl)\s+(with|of|out of)\s+/i, "");
  // Peel off a trailing "... into/onto/on/in/to (a/my) plate/meal/dish/bowl" phrase
  text = text.replace(/\s+(into|onto|on|in|to)\s+(a\s+|my\s+)?(plate|meal|dish|bowl)\.?\s*$/i, "");
  // Farsi: peel off a leading/trailing "به بشقاب" / "بشقاب"/"وعده"/"کاسه"/"ظرف" wrapper loosely
  text = text.replace(/^\s*(به\s+)?(بشقاب|وعده|کاسه|ظرف)\s*/g, "").replace(/\s*(بشقاب|وعده|کاسه|ظرف)\s*$/g, "");
  text = text.replace(/[.!]+$/, "").trim();
  return text || null;
}

function splitFoodTerms(str) {
  return (str || "")
    .split(/\s*,\s*|\s+and\s+|\s+و\s+|،\s*/i)
    .map((s) => s.trim())
    .filter(Boolean);
}

// Same matching priority as the search suggestions dropdown (exact, then
// starts-with, then contains) so a command resolves a name the same way
// typing it into search would.
function findFoodByTerm(term) {
  const q = term.trim().toLowerCase();
  const qFa = term.trim();
  if (!q) return null;
  return (
    FOODS.find((f) => f.name.toLowerCase() === q || f.nameFa === qFa) ||
    FOODS.find((f) => f.name.toLowerCase().startsWith(q) || f.nameFa.startsWith(qFa)) ||
    FOODS.find((f) => f.name.toLowerCase().includes(q) || f.nameFa.includes(qFa)) ||
    null
  );
}

function macroGroup(f) {
  const calCarb = (f.carbs100 + f.soluble100 + f.insoluble100) * 4;
  const calProtein = f.protein100 * 4;
  const calFat = f.fat100 * 9;
  const total = calCarb + calProtein + calFat || 1;
  const shares = { carb: calCarb / total, protein: calProtein / total, fat: calFat / total };
  const sorted = Object.entries(shares).sort((a, b) => b[1] - a[1]);
  if (sorted[0][1] < 0.5 && sorted[0][1] - sorted[1][1] < 0.15) return "mixed";
  return sorted[0][0];
}

function portionInfo(food, mode, overrideGrams) {
  let grams;
  if (overrideGrams != null && overrideGrams > 0) {
    grams = overrideGrams;
  } else if (mode === "100g") {
    grams = 100;
  } else if (mode === "50c") {
    grams = food.carbs100 > 0 ? (50 / food.carbs100) * 100 : 100;
  } else {
    grams = food.fdaG;
  }
  const carbsAtPortion = (food.carbs100 * grams) / 100;
  const gl = (food.gi * carbsAtPortion) / 100;
  return { grams, carbsAtPortion, gl };
}

function macrosAtPortion(food, grams) {
  const k = grams / 100;
  return {
    sugar: food.sugar100 * k,
    starch: starch(food) * k,
    soluble: food.soluble100 * k,
    insoluble: food.insoluble100 * k,
    protein: food.protein100 * k,
    satFat: food.satFat100 * k,
    mono: food.mono100 * k,
    poly: food.poly100 * k,
  };
}

function microsAtPortion(food, grams) {
  const k = grams / 100;
  return {
    sodium: food.sodium100 * k,
    potassium: food.potassium100 * k,
    calcium: food.calcium100 * k,
    iron: food.iron100 * k,
    vitC: food.vitC100 * k,
    magnesium: food.magnesium100 * k,
    zinc: food.zinc100 * k,
    vitA: food.vitA100 * k,
    vitB12: food.vitB12_100 * k,
    folate: food.folate100 * k,
  };
}

function curvePoints(food, gl) {
  const peak = 1.55 * gl;
  const sigmaRise = food.ttp / 2.3;
  const slowFallCats = { fat: 1.5, legume: 1.4, veg: 1.15, grain: 1.15, protein: 1.3 };
  const sigmaFall = (food.ttp / 1.35) * (slowFallCats[food.cat] || 1.1);
  const pts = [];
  for (let t = 0; t <= 200; t += 5) {
    const sigma = t <= food.ttp ? sigmaRise : sigmaFall;
    pts.push(Math.max(0, peak * Math.exp(-((t - food.ttp) ** 2) / (2 * sigma * sigma))));
  }
  return pts;
}

function sleepNote(food, gl, lang) {
  const fast = food.ttp <= 35;

  let en, fa, notability;
  if (gl < 1.5) {
    en = "Negligible blood sugar effect on its own — unlikely to disturb sleep through glucose alone.";
    fa = "به‌تنهایی اثر ناچیزی بر قند خون دارد — بعید است به‌خاطر قند خواب را مختل کند.";
    notability = 1;
  } else if (fast && high) {
    en = "Fast, high spike — likely to crash before bed, but the dip can still wake you.";
    fa = "افزایش سریع و بالا — احتمال افت قبل خواب هست، اما همان افت می‌تواند بیدارتان کند.";
    notability = 3;
  } else if (fast && !high) {
    en = "Fast but modest rise — usually settles before bedtime issues start.";
    fa = "افزایش سریع ولی محدود — معمولاً قبل از مشکل‌ساز شدن آرام می‌شود.";
    notability = 1;
  } else if (mid && high) {
    en = "Moderate-to-high spike landing mid-sleep window — can fragment early sleep.";

    notability = 3;
  } else if (food.cat === "fat" || (food.ttp > 70 && gl >= 8)) {
    en = "Delayed, lingering rise — often peaks after you're already asleep.";
    fa = "افزایش دیرهنگام و طولانی — اغلب وقتی خوابید به اوج می‌رسد.";
    notability = 3;
  } else if (low) {
    en = "Minimal, gentle rise — least likely to disturb sleep.";
    fa = "افزایش کم و آرام — کمترین احتمال اختلال در خواب.";

  } else {
    en = "Slow, steady rise — generally sleep-friendly.";
    fa = "افزایش آهسته و پایدار — عموماً برای خواب مناسب است.";
    notability = 1;
  }
  return { text: lang === "fa" ? fa : en, notability };

// Surfaces only the most worthwhile tip(s) instead of always showing all
// three — a second tip is included only if it's still genuinely notable.
function getTopTips(food, gl, lang) {
  const candidates = [
    { key: "sleep", ...sleepNote(food, gl, lang) },
    { key: "exercise", ...exerciseNote(food, gl, lang) },
    { key: "fasting", ...fastingNote(food, gl, lang) },
  ].sort((a, b) => b.notability - a.notability);
  const top = [candidates[0]];
  if (candidates[1] && candidates[1].notability >= 2) top.push(candidates[1]);
  return top;
}

function round(n, d = 0) {
  const m = 10 ** d;
  return Math.round(n * m) / m;
}

// Standard published thresholds — GI: low <=55, medium 56-69, high >=70.
// GL: low <10, medium 10-19, high >=20. Gives the raw number an at-a-glance
// read instead of requiring the person to remember the cutoffs themselves.
function giTier(gi) {
  if (gi <= 55) return { label: { en: "Low", fa: "کم" }, color: "#1d9e75" };
  if (gi <= 69) return { label: { en: "Medium", fa: "متوسط" }, color: "#e0a83c" };
  return { label: { en: "High", fa: "بالا" }, color: "#d4534f" };
}
function glTier(gl) {
  if (gl < 10) return { label: { en: "Low", fa: "کم" }, color: "#1d9e75" };
  if (gl < 20) return { label: { en: "Medium", fa: "متوسط" }, color: "#e0a83c" };
  return { label: { en: "High", fa: "بالا" }, color: "#d4534f" };
}
// Same fast/moderate/slow thresholds already used to color the time-to-peak
// gauge — kept here as a proper tier (label + color) so "time to peak" can
// carry a dynamic badge the same way GI and GL do. No red: a slow rise
// isn't "bad" the way a high GI/GL reading is, just different.
function ttpTier(ttp) {
  if (ttp <= 35) return { label: { en: "Fast", fa: "سریع" }, color: "#1d9e75" };
  if (ttp <= 70) return { label: { en: "Moderate", fa: "متوسط" }, color: "#e0a83c" };
  return { label: { en: "Slow", fa: "کند" }, color: "#7fa3d1" };
}

// Continuous green -> amber -> red spectrum for glycemic index, anchored on
// the same three brand colors used by giTier's discrete Low/Medium/High
// badges (so a curve's color always agrees with its GI badge), but
// interpolated smoothly instead of stepping in three flat bands.
const GI_COLOR_STOPS = [
  { at: 0, rgb: [29, 158, 117] }, // #1d9e75 — low GI, green
  { at: 55, rgb: [224, 168, 60] }, // #e0a83c — medium GI, amber
  { at: 100, rgb: [212, 83, 79] }, // #d4534f — high GI, red
];
function giToColor(gi, alpha = 1) {
  const clamped = Math.max(0, Math.min(100, gi || 0));
  let lo = GI_COLOR_STOPS[0];
  let hi = GI_COLOR_STOPS[GI_COLOR_STOPS.length - 1];
  for (let i = 0; i < GI_COLOR_STOPS.length - 1; i++) {
    if (clamped >= GI_COLOR_STOPS[i].at && clamped <= GI_COLOR_STOPS[i + 1].at) {
      lo = GI_COLOR_STOPS[i];
      hi = GI_COLOR_STOPS[i + 1];
      break;
    }
  }
  const span = hi.at - lo.at || 1;
  const frac = (clamped - lo.at) / span;
  const [r, g, b] = lo.rgb.map((c, i) => Math.round(c + (hi.rgb[i] - c) * frac));
  return alpha >= 1 ? `rgb(${r}, ${g}, ${b})` : `rgba(${r}, ${g}, ${b}, ${alpha})`;
}

// Heuristic 0-10 "Daily glycemic response score" — not a clinical or
// personalized score. Combines four ingredients that recur across
// glycemic-response literature: (1) cumulative daily glycemic load,
// (2) how tall the day's blood-glucose peak is, (3) whether fiber/fat/
// protein ride along with the carbs (known to blunt and delay the rise
// vs. carbs eaten alone), and (4) whether meals are spread across the day
// rather than clustered into one sitting (meal regularity/spacing is
// associated with steadier postprandial glucose in the meal-timing
// literature). The exact weights are a simplification for this app, not
// a validated clinical index.
function computeDailyScore(plate, mealCardData, dailyCurveInfo) {
  if (!plate) return null;
  let score = 10;
  const notes = [];

  const gl = plate.totalGL;
  if (gl >= 150) {
    score -= 3.5;
    notes.push({
      ok: false,
      text: { en: "Daily glycemic load is high (≥150) — a lot of high-GI carbs stacked across the day.", fa: "بار گلایسمی روزانه بالا است (≥۱۵۰) — کربوهیدرات با GI بالا در طول روز انباشته شده." },
    });
  } else if (gl >= 100) {
    score -= 1.5;
    notes.push({ ok: null, text: { en: "Daily glycemic load is in a moderate range (100–150).", fa: "بار گلایسمی روزانه در محدوده متوسط است (۱۰۰ تا ۱۵۰)." } });
  } else {
    notes.push({ ok: true, text: { en: "Daily glycemic load stays in a lower range (<100).", fa: "بار گلایسمی روزانه در محدوده پایین‌تری است (کمتر از ۱۰۰)." } });
  }

  const peak = dailyCurveInfo && dailyCurveInfo.curve.length ? Math.max(...dailyCurveInfo.curve, 0) : 0;
  if (peak >= 90) {
    score -= 2.5;
    notes.push({ ok: false, text: { en: "At least one steep spike stands out in the day's combined curve.", fa: "حداقل یک جهش تند در منحنی ترکیبی روز دیده می‌شود." } });
  } else if (peak >= 55) {
    score -= 1;
    notes.push({ ok: null, text: { en: "The day has a noticeable but moderate peak.", fa: "روز یک اوج قابل‌توجه اما متوسط دارد." } });
  } else if (peak > 0) {
    notes.push({ ok: true, text: { en: "No sharp spikes — the combined curve stays fairly flat.", fa: "جهش تندی وجود ندارد — منحنی ترکیبی نسبتاً صاف است." } });
  }

  const blunt = plate.bluntFactor; // ~0.55 (well blunted) .. 1 (unblunted)
  score += (1 - blunt) * 2;
  if (blunt <= 0.7) {
    notes.push({ ok: true, text: { en: "Fiber, fat, and protein alongside the carbs are blunting and delaying the rise.", fa: "فیبر، چربی و پروتئین همراه کربوهیدرات‌ها اوج را کند و به‌تأخیر می‌اندازند." } });
  } else if (blunt >= 0.9) {
    notes.push({ ok: false, text: { en: "Carbs are mostly eaten with little fat, fiber, or protein alongside them.", fa: "کربوهیدرات‌ها بیشتر بدون همراهی چربی، فیبر یا پروتئین خورده شده‌اند." } });
  }

  const filledCount = mealCardData.filter((m) => m.plate).length;
  if (filledCount >= 3) {
    score += 0.5;
    notes.push({ ok: true, text: { en: "Food is spread across several meals rather than one big sitting.", fa: "غذا در چند وعده پخش شده، نه یک وعده بزرگ." } });
  } else if (filledCount <= 1) {
    score -= 0.5;
    notes.push({ ok: null, text: { en: "Everything logged so far is in a single sitting.", fa: "همه چیز تاکنون در یک وعده ثبت شده." } });
  }

  score = Math.max(0, Math.min(10, score));
  return { score: Math.round(score * 10) / 10, notes };
}

function dailyScoreTier(score) {

// Heuristic 0-10 "Micronutrient DV coverage" score: how broadly the day's
// food covers the 9 non-limit micronutrients this app tracks (sodium is
// excluded — it's a "limit" nutrient, not a "get more of" one), relative
// to the FDA's adult Daily Values. Dietary-adequacy and diet-quality
// research (e.g. work behind indices like the Healthy Eating Index) tends
// to reward breadth of coverage across many nutrients over a huge dose of
// just one or two, so this blends average %DV coverage with how many
// nutrients individually clear a 50%-DV bar.
function computeMicroCoverageScore(micros) {
  const keys = MICRO_KEYS_ORDERED.filter((k) => !MICRO_LIMIT_NUTRIENTS.has(k));
  const perNutrient = keys.map((k) => {
    const dvPct = microDvPct(k, micros[k]);
    return { key: k, dvPct, capped: Math.min(Math.max(dvPct, 0), 100) };
  });
  const avgCoverage = perNutrient.reduce((s, n) => s + n.capped, 0) / perNutrient.length; // 0-100
  const metCount = perNutrient.filter((n) => n.dvPct >= 50).length;

  let score = (avgCoverage / 100) * 10 * 0.7 + (metCount / perNutrient.length) * 10 * 0.3;
  score = Math.max(0, Math.min(10, score));

  return { score: Math.round(score * 10) / 10, perNutrient, metCount, total: perNutrient.length };
}

// Heuristic 0-10 fiber-adequacy score against commonly cited general adult
// targets (roughly 25-38 g/day across sources like the Dietary Guidelines
// for Americans and EFSA, often summarized as ~14g per 1000 kcal). This
// app doesn't know the person's sex, age, or calorie needs, so it uses a
// single ~28g/day midpoint as an "average individual" approximation — not
// a personalized target. A small note flags whether both soluble fiber
// (linked to cholesterol/glucose effects) and insoluble fiber (linked to
// digestive regularity) are present, since both are discussed as useful
// in the fiber literature, not just total grams.
function computeFiberScore(soluble, insoluble) {
  const total = soluble + insoluble;
  const target = 28;
  const score = Math.max(0, Math.min(10, (total / target) * 10));
  const hasBothTypes = total > 0 && soluble >= total * 0.15 && insoluble >= total * 0.15;
  return { score: Math.round(score * 10) / 10, total, soluble, insoluble, target, hasBothTypes };
}

// Colors are shades within 3 hue families so the pie reads at a glance:
// amber = carbs (4 shades: sugar -> starch -> soluble fiber -> insoluble fiber),
// teal = protein (1 shade), rose = fat (3 shades: sat -> mono -> poly).
function findSimilarFoods(food, limit) {
  const scored = FOODS.filter((f) => f.id !== food.id).map((f) => {
    let score = f.cat === food.cat ? 0 : 40;
    score += Math.abs(f.gi - food.gi) * 0.5;
    score += Math.abs(f.carbs100 - food.carbs100) * 0.3;
    score += Math.abs(f.protein100 - food.protein100) * 0.5;
    score += Math.abs(f.fat100 - food.fat100) * 0.3;
    return { f, score };
  });
  scored.sort((a, b) => a.score - b.score);
  return scored.slice(0, limit).map((s) => s.f);
}

const COLLAGEN_RICH_IDS = ["bone-broth"];

function aminoProfileKey(food) {
  if (COLLAGEN_RICH_IDS.includes(food.id)) return "collagen";
  if (LEGUME_LIKE_PROTEIN_IDS.includes(food.id)) return "legume";
  if (food.cat === "protein") return "complete_animal";
  if (food.cat === "legume") return "legume";
  if (food.cat === "grain") return "grain";
  if (food.cat === "fat") return NUT_SEED_IDS.includes(food.id) ? "nut_seed" : "complete_animal";
  return "legume";
}

function aminoAcidsAtPortion(food, grams) {
  const proteinG = (food.protein100 * grams) / 100;
  const profile = AMINO_PROFILES[aminoProfileKey(food)];
  const result = {};
  let essentialSum = 0;
  AMINO_KEYS_ORDERED.forEach((k) => {
    if (k === "other") return;
    const v = proteinG * (profile[k] || 0);
    result[k] = v;
    essentialSum += v;
  });
  result.other = Math.max(0, proteinG - essentialSum);
  return result;
}

// Simplified Amino Acid Score: each essential amino acid's fraction (g per g
// protein) is compared to the FAO/WHO/UNU (2007) suggested adult reference
// pattern; the lowest ratio across all nine is the "limiting" amino acid and
// becomes the overall score (capped at 100%) — the same logic PDCAAS uses,
// minus the digestibility correction. This scores the protein SOURCE TYPE
// (animal/dairy, legume, grain, or nut/seed), not a lab assay of this food.
const REFERENCE_AA_PATTERN = { his: 0.015, ile: 0.03, leu: 0.059, lys: 0.045, met: 0.022, phe: 0.038, thr: 0.023, trp: 0.006, val: 0.039 };

function proteinQualityScore(food) {
  const profile = AMINO_PROFILES[aminoProfileKey(food)];
  let minRatio = Infinity;
  let limitingKey = null;
  Object.keys(REFERENCE_AA_PATTERN).forEach((k) => {
    const ratio = (profile[k] || 0) / REFERENCE_AA_PATTERN[k];
    if (ratio < minRatio) {
      minRatio = ratio;
      limitingKey = k;
    }
  });
  return { score: Math.min(1, minRatio), limitingKey, rawRatio: minRatio };
}

// True/ileal digestibility by protein-source type — approximate, representative
// figures drawn from the ranges commonly cited for PDCAAS/DIAAS calculations
// (e.g. egg/dairy/meat ~90-98%, legumes ~78-88%, grains ~85-95%, nuts/seeds
// ~80-90%). One value per source type, not a per-food lab measurement.
const DIGESTIBILITY_BY_PROFILE = { complete_animal: 0.95, legume: 0.85, grain: 0.9, nut_seed: 0.85, collagen: 0.97 };

// Three established ways to score protein quality, all derivable from the
// amino acid profile plus an approximate digestibility figure:
// - Amino Acid Score / "Chemical Score" (score, uncorrected): oldest method,
//   just the limiting amino acid's ratio to the reference pattern.
// - PDCAAS: AAS x digestibility, capped at 100% — the FDA/FAO standard from
//   1991-2013.
// - DIAAS: conceptually similar but FAO's current (2013-) recommended
//   replacement, using ileal (not fecal) digestibility and NOT capped at
//   100% — so genuinely excellent proteins can score above 100.
// Older methods like Biological Value and Protein Efficiency Ratio are real
// and still referenced, but they come from feeding trials, not from amino
// acid composition — they aren't something this tool can compute.
function foodProteinQuality(food) {
  const { score, limitingKey, rawRatio } = proteinQualityScore(food);
  const digestibility = DIGESTIBILITY_BY_PROFILE[aminoProfileKey(food)];
  return { score, limitingKey, rawRatio, digestibility };
}

function qualityTier(score) {
  if (score >= 1) return { label: { en: "Complete", fa: "کامل" }, color: "#1d9e75" };
  if (score >= 0.8) return { label: { en: "Good", fa: "خوب" }, color: "#8bc24a" };
  if (score >= 0.6) return { label: { en: "Moderate", fa: "متوسط" }, color: "#e0a83c" };
  return { label: { en: "Limited", fa: "محدود" }, color: "#d4534f" };
}

// Muscle-meat protein sources — where the "glycine gap" idea applies.
// Modern diets lean almost entirely on muscle-meat protein (myosin/actin),
// which is comparatively low in glycine and proline, whereas historically
// a much larger share of animal protein came from skin, bone, and
// connective tissue (collagen-rich, glycine-dense). This isn't a knock on
// muscle meat — it's a balance point some functional-medicine sources
// raise: pair it with collagen-rich sources rather than making it the only
// animal protein in the diet.
const MUSCLE_MEAT_IDS = [
  "chicken-breast", "chicken-thigh", "turkey-breast", "beef-steak", "ground-beef", "lamb", "pork-chop",
  "duck", "bison", "salmon", "tuna", "cod", "tilapia", "sardines", "shrimp", "crab", "lobster", "scallops",
  "mussels", "anchovies", "quail-egg", "joojeh-kabab", "kabab-koobideh", "kabab-barg", "shawarma-chicken",
];
// Cured/heavily processed meat — the specific pattern WHO/IARC (2015) and
// most functional-medicine sources flag distinctly from fresh meat, due to
// nitrites/nitrates, high sodium, and processing byproducts, separate from
// whatever the protein's amino acid content looks like.
const PROCESSED_PROTEIN_IDS = ["bacon"];

// Alternate 0-10 protein-quality lens, built around what functional-
// medicine sources tend to add on top of plain essential-amino-acid
// completeness:
//
// 1. Essential-amino-acid match still counts, but isn't treated as a hard
//    cap the way PDCAAS-style scoring does — a food that's decent-but-not-
//    perfect isn't crushed by a single limiting amino acid the way the
//    conventional score above deliberately is.
// 2. Processing level is judged on top of amino content — cured/processed
//    meat is penalized specifically for the nitrite/sodium/processing
//    pattern (WHO/IARC 2015), not for its protein quality.
// 3. Collagen/glycine balance — a genuinely distinctive functional-
//    medicine angle absent from conventional scoring entirely, since
//    PDCAAS/DIAAS only track the nine essential aminos and treat glycine
//    as nutritionally irrelevant. Collagen-rich sources (bone broth,
//    skin-on slow-cooked cuts) are valued here for exactly what makes them
//    score LOW on strict completeness (almost no tryptophan) — they're
//    judged by what they're actually eaten for, not by whether they're a
//    complete protein on their own. Muscle-meat-only eating gets a small,
//    explanatory nudge rather than a penalty.
function functionalProteinQualityFromProfile({ aminoScore, isProcessed, isCollagenRich, isMuscleMeat }) {
  let score;
  const notes = [];

  if (isCollagenRich) {
    score = 7.5;
    notes.push({
      ok: true,
      text: {
        en: "Collagen/gelatin-rich — exactly the glycine- and proline-dense source functional medicine suggests balancing muscle meat with.",
        fa: "غنی از کلاژن/ژلاتین — دقیقاً همان منبع سرشار از گلایسین و پرولین که طب عملکردی توصیه می‌کند در کنار گوشت عضلانی مصرف شود.",
      },
    });
    notes.push({
      ok: null,
      text: {
        en: "Low in essential-amino completeness on its own (almost no tryptophan) — but completeness isn't really what this kind of food is valued for here.",
        fa: "از نظر کامل بودن اسیدهای آمینه ضروری به‌تنهایی پایین است (تقریباً بدون تریپتوفان) — اما این ویژگی دلیل اصلی ارزش این نوع خوراکی در این نگاه نیست.",
      },
    });
  } else {
    score = 4 + aminoScore * 6;
    if (aminoScore >= 0.9) {
      notes.push({ ok: true, text: { en: "Strong essential amino acid match.", fa: "تطابق قوی اسیدهای آمینه ضروری." } });
    } else if (aminoScore >= 0.6) {
      notes.push({ ok: null, text: { en: "Decent essential amino acid match — weighted less strictly here than a PDCAAS-style hard cap.", fa: "تطابق نسبتاً خوب اسیدهای آمینه ضروری — با سخت‌گیری کمتری نسبت به یک سقف سخت‌گیرانه به‌سبک PDCAAS وزن‌دهی شده." } });
    } else {
      notes.push({ ok: null, text: { en: "Limited by its essential amino acids on their own, but this lens doesn't let one limiting amino acid cap the whole score the way a strict chemical score would.", fa: "از نظر اسیدهای آمینه ضروری به‌تنهایی محدود است، اما این نگاه اجازه نمی‌دهد یک اسید آمینه محدودکننده کل امتیاز را مانند یک امتیاز شیمیایی سخت‌گیرانه محدود کند." } });
    }

    if (isProcessed) {
      score -= 3;
      notes.push({
        ok: false,
        text: {
          en: "A cured/processed meat — flagged for the nitrite/sodium/processing pattern itself (WHO/IARC 2015), separate from its amino acid content.",
          fa: "گوشتی فرآوری‌شده/دودی — به‌دلیل خود الگوی نیترات/سدیم/فرآوری (WHO/IARC 2015) علامت‌گذاری شده، جدا از محتوای اسید آمینه آن.",
        },
      });
    }

    if (isMuscleMeat) {
      score -= 0.5;
      notes.push({
        ok: null,
        text: {
          en: "A muscle-meat source — comparatively low in glycine/proline. Some functional-medicine sources suggest balancing muscle meat with collagen-rich sources (bone broth, skin-on slow-cooked cuts) rather than relying on it alone.",
          fa: "منبعی از گوشت عضلانی — نسبتاً کم‌گلایسین/پرولین. برخی منابع طب عملکردی توصیه می‌کنند گوشت عضلانی را با منابع غنی از کلاژن (آبگوشت استخوان، تکه‌های پوست‌دار آرام‌پز) متعادل کنید، نه اینکه تنها به آن تکیه کنید.",
        },
      });
    }
  }

  score = Math.max(0, Math.min(10, score));
  return { score: Math.round(score * 10) / 10, aminoScore, isProcessed, isCollagenRich, isMuscleMeat, notes };
}

function computeFunctionalProteinScore(food) {
  if (!food.protein100 || food.protein100 < 1) return null;
  const { score: aminoScore } = proteinQualityScore(food);
  const isProcessed = PROCESSED_PROTEIN_IDS.includes(food.id);
  const isCollagenRich = COLLAGEN_RICH_IDS.includes(food.id);
  const isMuscleMeat = MUSCLE_MEAT_IDS.includes(food.id);
  return functionalProteinQualityFromProfile({ aminoScore, isProcessed, isCollagenRich, isMuscleMeat });
}

const RUMINANT_FAT_IDS = [

function fatProfileKey(food) {
  if (OLIVE_MUFA_IDS.includes(food.id)) return "olive_avocado";
  if (ALA_EXTREME_IDS.includes(food.id)) return "ala_extreme";
  if (ALA_WALNUT_IDS.includes(food.id)) return "ala_walnut";
  if (COCONUT_FAT_IDS.includes(food.id)) return "coconut";
  if (FISH_MARINE_IDS.includes(food.id)) return "fish_marine";
  if (RUMINANT_FAT_IDS.includes(food.id)) return "ruminant_animal";
  if (POULTRY_EGG_FAT_IDS.includes(food.id)) return "poultry_egg";
  if (food.cat === "fat") return "seed_oil_nut";
  if (food.cat === "protein") return "poultry_egg";
  return "grain_default";
}

// Splits a food's own satFat100/mono100/poly100 (already-real per-food
// values) into named fatty acids using its source-type profile. Trans fat
// is carved out of the monounsaturated share (industrial/biohydrogenation
// trans fat originates from unsaturated fat), and "other" absorbs whatever
// each profile's fractions don't name, so the slices always sum back to
// exactly the food's real total fat — no double counting.
function fatAcidsAtPortion(food, grams) {
  const satG = (food.satFat100 * grams) / 100;
  const monoG = (food.mono100 * grams) / 100;
  const polyG = (food.poly100 * grams) / 100;
  const totalFatG = satG + monoG + polyG;
  const profile = FAT_PROFILES[fatProfileKey(food)];

  const palmitic = satG * profile.sat.palmitic;
  const stearic = satG * profile.sat.stearic;
  const lauric = satG * profile.sat.lauric;
  const otherSat = Math.max(0, satG - palmitic - stearic - lauric);

  const oleic = monoG * profile.monoOleicFrac;
  const otherMonoRaw = Math.max(0, monoG - oleic);

  const linoleic = polyG * profile.poly.linoleic;
  const ala = polyG * profile.poly.ala;
  const omega3_marine = polyG * profile.poly.omega3_marine;
  const otherPoly = Math.max(0, polyG - linoleic - ala - omega3_marine);

  // trans fat is carved out of the leftover monounsaturated share —
  // industrial/biohydrogenation trans fat originates from unsaturated fat,
  // so this keeps the slices summing back to exactly this food's real
  // total fat (satG + monoG + polyG), no double counting.
  const trans = Math.min(otherMonoRaw, totalFatG * profile.transFrac);
  const otherMono = Math.max(0, otherMonoRaw - trans);

  return {
    palmitic,
    stearic,
    lauric,
    oleic,
    linoleic,
    ala,
    omega3_marine,
    trans,
    other: otherSat + otherMono + otherPoly,
  };
}

function fatQualityFromShares(satShare, transShare, omega3Share, unsatShare) {
  let score = 10;
  const notes = [];

  // Saturated-fat penalty scales continuously with how far past ~35% of
  // total fat a food sits, rather than a flat step — this is what keeps a
  // food that's, say, 55% saturated from scoring the same as one that's
  // 90%+ saturated (coconut oil, butter), which a two-tier system would
  // otherwise conflate.
  const satExcess = Math.max(0, satShare - 0.35);
  const satPenalty = Math.min(6, satExcess * 9);
  score -= satPenalty;
  if (satShare >= 0.55) {
    notes.push({ ok: false, text: { en: "Mostly saturated fat.", fa: "بیشتر چربی اشباع است." } });
  } else if (satShare >= 0.35) {
    notes.push({ ok: null, text: { en: "A moderate share of saturated fat.", fa: "سهم متوسطی از چربی اشباع." } });
  } else {
    notes.push({ ok: true, text: { en: "Mostly unsaturated fat.", fa: "بیشتر چربی غیراشباع است." } });
  }

  if (transShare > 0.005) {
    score -= 3;
    notes.push({ ok: false, text: { en: "Contains some trans fat — no intake level is considered safe.", fa: "حاوی مقداری چربی ترانس — هیچ سطح مصرفی بی‌خطر در نظر گرفته نمی‌شود." } });
  } else {
    notes.push({ ok: true, text: { en: "No meaningful trans fat.", fa: "چربی ترانس قابل‌توجهی ندارد." } });
  }

  if (omega3Share >= 0.15) {
    score += 1.5;
    notes.push({ ok: true, text: { en: "A strong source of omega-3 fat.", fa: "منبع خوبی از چربی امگا-۳." } });
  } else if (omega3Share >= 0.03) {
    score += 0.5;
    notes.push({ ok: true, text: { en: "Some omega-3 fat.", fa: "مقداری چربی امگا-۳." } });
  }

  if (unsatShare >= 0.75) score += 0.5;

  score = Math.max(0, Math.min(10, score));
  return { score: Math.round(score * 10) / 10, satShare, transShare, omega3Share, notes };
}

// Heuristic 0-10 fat QUALITY score — deliberately not a score of how much
// fat a food has, since current guidance (AHA, WHO, the 2020-2025 Dietary
// Guidelines for Americans) has shifted from "total fat" targets to fat
// COMPOSITION: replacing saturated fat with unsaturated fat lowers LDL-C
// and cardiovascular risk in randomized trials; the WHO REPLACE initiative
// treats industrial trans fat as having no safe intake level; omega-3
// intake (ALA and especially marine EPA/DHA) is independently associated
// with cardiovascular benefit. The omega-6:omega-3 ratio specifically is
// more debated in the literature than the other three factors, so it's
// given a smaller weight here.
function computeFatQualityScore(food) {
  const totalFat = food.satFat100 + food.mono100 + food.poly100;
  if (!totalFat || totalFat < 0.5) return null;
  const acids = fatAcidsAtPortion(food, 100);
  const satShare = food.satFat100 / totalFat;
  const transShare = acids.trans / totalFat;
  const omega3Share = (acids.ala + acids.omega3_marine) / totalFat;
  const unsatShare = (food.mono100 + food.poly100) / totalFat;
  return fatQualityFromShares(satShare, transShare, omega3Share, unsatShare);
}

// from the conventional AHA/WHO-informed score above, both drawn from more
// recent functional/integrative-medicine literature:
//
// 1. Saturated fat is weighted far more lightly. Newer meta-analyses
//    (e.g. Astrup et al. 2020, PURE study 2017) find the SFA→LDL→CVD chain
//    weaker and more food-matrix-dependent than once assumed — a gram of
//    saturated fat in cheese or yogurt doesn't behave like a gram in a
//    processed snack. The penalty here only engages at a much higher
//    saturated share, and is softened further for foods where a
//    grass-fed/pastured source is plausible (see PASTURED_RELEVANT_IDS).

//    absolute omega-3 content. Functional-medicine sources (Simopoulos'
//    ratio hypothesis, Weston A. Price-adjacent literature) argue the
//    balance between these competing eicosanoid precursors matters more
//    than either fat alone — modern seed-oil-heavy diets often run
//    15:1-20:1 versus an ancestral/target ratio closer to 1:1-4:1.
//

// no functional-medicine framework treats industrial trans fat kindly.
function functionalFatQualityFromShares(satShare, transShare, omega6, omega3, isPasturedRelevant) {

  const notes = [];

  const satExcess = Math.max(0, satShare - 0.55);
  let satPenalty = Math.min(2.5, satExcess * 4);
  if (isPasturedRelevant) satPenalty *= 0.6;
  score -= satPenalty;

    notes.push({
      ok: null,
      text: isPasturedRelevant

        : { en: "Mostly saturated fat — newer research treats this as a smaller concern than once thought, especially outside processed foods.", fa: "بیشتر چربی اشباع است — پژوهش‌های جدیدتر این را نگرانی کوچک‌تری از آنچه پیش‌تر تصور می‌شد می‌دانند، به‌ویژه خارج از خوراکی‌های فرآوری‌شده." },
    });
  } else {
    notes.push({ ok: true, text: { en: "Saturated share isn't a major factor in this lens.", fa: "سهم اشباع در این نگاه عامل مهمی نیست." } });
  }

    score -= 3;
    notes.push({ ok: false, text: { en: "Contains some trans fat — every framework, including this one, treats this as worth avoiding.", fa: "حاوی مقداری چربی ترانس — همه رویکردها، از جمله این یکی، اجتناب از آن را توصیه می‌کنند." } });
  } else {
    notes.push({ ok: true, text: { en: "No meaningful trans fat.", fa: "چربی ترانس قابل‌توجهی ندارد." } });

    } else if (ratio <= 10) {
      score += 0.5;
      notes.push({ ok: null, text: { en: `Omega-6:omega-3 ratio ≈ ${ratio.toFixed(1)}:1 — moderately skewed toward omega-6.`, fa: `نسبت امگا-۶ به امگا-۳ ≈ ${ratio.toFixed(1)}:۱ — تا حدی به سمت امگا-۶ متمایل است.` } });
    } else if (ratio <= 20) {
      score -= 1.5;
      const ratioText = Number.isFinite(ratio) ? ratio.toFixed(0) : "20+";
      notes.push({ ok: false, text: { en: `Omega-6:omega-3 ratio ≈ ${ratioText}:1 — typical of a modern seed-oil-heavy diet, well above the ~4:1 target.`, fa: `نسبت امگا-۶ به امگا-۳ ≈ ${ratioText}:۱ — مشابه رژیم غذایی مدرن پر از روغن‌های دانه‌ای، بسیار بالاتر از هدف ~۴:۱.` } });
    } else {
      score -= 3;
      notes.push({ ok: false, text: { en: "Omega-6:omega-3 ratio is very high (20:1+) — this fat is almost entirely omega-6 with little to balance it.", fa: "نسبت امگا-۶ به امگا-۳ بسیار بالاست (بیش از ۲۰:۱) — این چربی تقریباً یکسره امگا-۶ است و چیزی برای موازنه آن نیست." } });
    }
  }

  if (omega3 >= 0.3) score += 0.5;

  score = Math.max(0, Math.min(10, score));
  return { score: Math.round(score * 10) / 10, satShare, transShare, ratio, isPasturedRelevant, notes };

function computeFunctionalFatScore(food) {
  const totalFat = food.satFat100 + food.mono100 + food.poly100;
  if (!totalFat || totalFat < 0.5) return null;
  const acids = fatAcidsAtPortion(food, 100);
  const satShare = food.satFat100 / totalFat;
  const transShare = acids.trans / totalFat;
  const omega6 = acids.linoleic;
  const omega3 = acids.ala + acids.omega3_marine;
  const isPasturedRelevant = PASTURED_RELEVANT_IDS.includes(food.id);
  return functionalFatQualityFromShares(satShare, transShare, omega6, omega3, isPasturedRelevant);
}

const CANE_SWEETENED_IDS = [
  "doughnut", "cake", "cookies", "baklava", "halva", "faloodeh", "sholeh-zard", "shirin-polo", "shirin-polo-platter",
  "milk-chocolate", "dark-chocolate", "sekanjabin", "coconut-sugar",
];
const DRIED_FRUIT_IDS = ["dates", "raisins", "dried-apricot", "dried-fig", "jujube", "barberries", "russian-olive"];
const ROOT_VEG_IDS = ["carrots", "beetroot", "sweet-potato", "potato", "corn", "onion", "pumpkin", "butternut-squash", "turnip", "daikon-radish", "radish"];

function sugarProfileKey(food) {
  if (PURE_GLUCOSE_IDS.includes(food.id)) return "pure_glucose";
  if (PURE_SUCROSE_IDS.includes(food.id)) return "pure_sucrose";
  if (HONEY_IDS.includes(food.id)) return "honey_type";
  if (AGAVE_IDS.includes(food.id)) return "agave_type";
  if (MOLASSES_IDS.includes(food.id)) return "molasses_type";
  if (MAPLE_IDS.includes(food.id)) return "maple_type";
  if (SODA_IDS.includes(food.id)) return "soda_hfcs";
  if (MALT_IDS.includes(food.id)) return "malt_type";
  if (DAIRY_LACTOSE_IDS.includes(food.id)) return "dairy_lactose";
  if (CANE_SWEETENED_IDS.includes(food.id)) return "cane_sweetened";
  if (DRIED_FRUIT_IDS.includes(food.id)) return "dried_fruit";
  if (ROOT_VEG_IDS.includes(food.id)) return "root_veg";
  if (food.cat === "fruit") return "fruit_default";
  return "mixed_default";
}

// stripped of the fiber, water, protein, and polyphenol matrix a whole

  ...PURE_GLUCOSE_IDS, ...PURE_SUCROSE_IDS, ...HONEY_IDS, ...AGAVE_IDS, ...MOLASSES_IDS, ...MAPLE_IDS,
  ...SODA_IDS, ...CANE_SWEETENED_IDS, "date-syrup", "coconut-sugar",

  "white-bread", "bagel", "white-rice", "pasta", "cornflakes", "sangak", "lavash", "pita-bread", "naan-bread",
  "corn-tortilla", "flour-tortilla", "polenta", "semolina", "breadcrumbs", "tahdig",
];
// Whole grains specifically (the fruit/veg/legume categories are treated as
// whole-food by default; grains are mixed, so only these count).
const WHOLE_GRAIN_IDS = [
  "brown-rice", "oats", "quinoa", "barley", "buckwheat", "bulgur", "farro", "freekeh", "millet", "amaranth",
  "wild-rice", "whole-wheat-pasta", "wheat-bread", "sourdough", "rye-bread",
];

// Alternate 0-10 carbohydrate-quality lens, built around what functional-
// medicine sources tend to emphasize over plain glycemic index/load:
//
// 1. Fiber-to-carbohydrate ratio is the dominant factor, not glycemic
//    index. A high-GI whole food eaten with its natural fiber intact
//    digests very differently from the same sugars isolated — fiber
//    (soluble especially) physically slows glucose absorption and feeds
//    short-chain-fatty-acid-producing gut bacteria, an axis conventional
//    GI/GL scoring doesn't capture at all.
// 2. Whole-food "matrix" vs. isolated/refined source matters on top of the
//    numbers themselves — the same sugars behave differently bound in a
//    cell wall (apple) versus stripped of it (apple juice, table sugar).
// 3. Fructose load is judged in context, not flatly. High fructose share
//    is treated as a real concern (hepatic metabolism, insulin resistance
//    literature) specifically when it arrives isolated (soda, agave,
//    refined sugar) — but not when bound in a fiber-rich whole fruit,
//    which functional-medicine sources generally don't treat as a
//    fructose-load problem the way added/isolated fructose is.
//
// Glycemic index still contributes, just far more lightly than fiber
// content and food-matrix status — the reverse emphasis of the app's
// primary GI/GL numbers, intentionally, as a second opinion.
function functionalCarbQualityFromProfile({ totalCarb, fiber, gi, fructoseShare, isRefined, isWholeFood }) {
  let score = 5;
  const notes = [];

  const fiberRatio = totalCarb > 0 ? fiber / totalCarb : 0;
  if (fiberRatio >= 0.2) {
    score += 3.5;
    notes.push({ ok: true, text: { en: `Very high fiber-to-carb ratio (${Math.round(fiberRatio * 100)}%) — most of this carbohydrate arrives bundled with fiber, the single biggest factor in this lens.`, fa: `نسبت فیبر به کربوهیدرات بسیار بالا (٪${Math.round(fiberRatio * 100)}) — بیشتر این کربوهیدرات همراه با فیبر می‌رسد، مهم‌ترین عامل در این نگاه.` } });
  } else if (fiberRatio >= 0.1) {
    score += 2.5;
    notes.push({ ok: true, text: { en: `Good fiber-to-carb ratio (${Math.round(fiberRatio * 100)}%).`, fa: `نسبت فیبر به کربوهیدرات خوب (٪${Math.round(fiberRatio * 100)}).` } });
  } else if (fiberRatio >= 0.05) {
    score += 1;
    notes.push({ ok: null, text: { en: `Some fiber alongside the carbohydrate (${Math.round(fiberRatio * 100)}%).`, fa: `مقداری فیبر همراه کربوهیدرات (٪${Math.round(fiberRatio * 100)}).` } });
  } else if (fiberRatio > 0) {
    score += 0.25;
    notes.push({ ok: null, text: { en: "Very little fiber to buffer this carbohydrate.", fa: "فیبر بسیار کمی برای تعدیل این کربوهیدرات وجود دارد." } });
  } else {
    notes.push({ ok: false, text: { en: "No fiber at all — nothing here slows this carbohydrate's absorption.", fa: "هیچ فیبری وجود ندارد — چیزی جذب این کربوهیدرات را کند نمی‌کند." } });
  }

  if (isRefined) {
    score -= 2.5;
    notes.push({
      ok: false,
      text: {
        en: "An isolated/refined carbohydrate source — without a whole food's fiber, water, and polyphenol matrix, its sugars are absorbed faster and hit the liver differently than the same sugars eaten intact.",
        fa: "منبعی از کربوهیدرات خالص/تصفیه‌شده — بدون فیبر، آب و ترکیبات پلی‌فنولی یک خوراکی کامل، قندهای آن سریع‌تر جذب می‌شوند و اثر متفاوتی بر کبد دارند نسبت به همان قندها در حالت کامل.",
      },
    });
  } else if (isWholeFood) {
    score += 1;
    notes.push({
      ok: true,
      text: {
        en: "A whole-food carbohydrate source — its natural matrix slows digestion beyond what glycemic index alone suggests.",
        fa: "منبعی از کربوهیدرات خوراکی کامل — بافت طبیعی آن گوارش را بیش از آنچه شاخص گلایسمی به‌تنهایی نشان می‌دهد، کند می‌کند.",
      },
    });
  }

  if (gi <= 55) {
    score += 1;
    notes.push({ ok: true, text: { en: `Low glycemic index (${gi}).`, fa: `شاخص گلایسمی پایین (${gi}).` } });
  } else if (gi <= 69) {
    notes.push({ ok: null, text: { en: `Medium glycemic index (${gi}) — a smaller factor here than fiber or food-matrix status.`, fa: `شاخص گلایسمی متوسط (${gi}) — عاملی کوچک‌تر از فیبر یا وضعیت بافت خوراکی در این نگاه.` } });
  } else {
    score -= 1.5;
    notes.push({ ok: false, text: { en: `High glycemic index (${gi}).`, fa: `شاخص گلایسمی بالا (${gi}).` } });
  }

  if (fructoseShare != null && fructoseShare >= 0.4) {
    if (isRefined) {
      score -= 1.5;
      notes.push({
        ok: false,
        text: {
          en: `High isolated fructose share (~${Math.round(fructoseShare * 100)}%) with no fiber to buffer it — the pattern most linked to fructose's hepatic/insulin-resistance concerns in this literature.`,
          fa: `سهم بالای فروکتوز خالص (~٪${Math.round(fructoseShare * 100)}) بدون فیبر برای تعدیل آن — الگویی که بیشترین ارتباط را با نگرانی‌های کبدی/مقاومت به انسولین فروکتوز در این ادبیات دارد.`,
        },
      });
    } else {
      notes.push({
        ok: null,
        text: {
          en: `Fructose-dominant (~${Math.round(fructoseShare * 100)}%), but bound within a whole-food matrix — generally not treated as a concern here.`,
          fa: `عمدتاً فروکتوز (~٪${Math.round(fructoseShare * 100)})، اما در بافت یک خوراکی کامل — معمولاً در این نگاه نگرانی محسوب نمی‌شود.`,
        },
      });
    }
  }

  score = Math.max(0, Math.min(10, score));
  return { score: Math.round(score * 10) / 10, fiberRatio, isRefined, isWholeFood, gi, fructoseShare, notes };
}

function computeFunctionalCarbScore(food) {
  const totalCarb = food.carbs100 + food.soluble100 + food.insoluble100;
  if (!totalCarb || totalCarb < 1) return null;
  const fiber = food.soluble100 + food.insoluble100;
  const carbTypes100 = carbTypesAtPortion(food, 100);
  const totalSugar = carbTypes100.glucose + carbTypes100.fructose + carbTypes100.sucrose + carbTypes100.lactose + carbTypes100.maltose;
  const fructoseShare = totalSugar > 0 ? carbTypes100.fructose / totalSugar : null;
  const isRefined = REFINED_SWEETENER_IDS.includes(food.id) || REFINED_STARCH_IDS.includes(food.id);
  const isWholeFood = !isRefined && (["fruit", "veg", "legume"].includes(food.cat) || WHOLE_GRAIN_IDS.includes(food.id));
  return functionalCarbQualityFromProfile({ totalCarb, fiber, gi: food.gi, fructoseShare, isRefined, isWholeFood });
}

// Splits a food's own sugar100 (already-real per-food value) into named
// sugars using its source-type profile; starch and the two fiber types are
// real per-food fields passed through unchanged. Slices always sum back to
// exactly this food's real total carbs — no double counting.
function carbTypesAtPortion(food, grams) {
  const k = grams / 100;
  const sugarG = food.sugar100 * k;
  const profile = SUGAR_PROFILES[sugarProfileKey(food)];
  return {
    glucose: sugarG * (profile.glucose || 0),
    fructose: sugarG * (profile.fructose || 0),
    sucrose: sugarG * (profile.sucrose || 0),
    lactose: sugarG * (profile.lactose || 0),
    maltose: sugarG * (profile.maltose || 0),
    starch: starch(food) * k,
    soluble: food.soluble100 * k,
    insoluble: food.insoluble100 * k,
  };
}

// Adult Daily Values (FDA label reference) used only to express amounts as
// a rough %DV — not personalized, just a common yardstick.
const MICRO_DV = {
  sodium: 2300, potassium: 3400, calcium: 1300, iron: 18, vitC: 90,
  magnesium: 420, zinc: 11, vitA: 900, vitB12: 2.4, folate: 400,
};

function microField(food, key) {
  return key === "vitB12" ? food.vitB12_100 : food[`${key}100`];
}
function microAtPortion(food, key, grams) {
  return (microField(food, key) * grams) / 100;
}
function microDvPct(key, value) {
  return Math.round((value / MICRO_DV[key]) * 100);
}

// Arranges wrapping chips to use as few rows as possible. True bin-packing
// is overkill for a handful of chips, but sorting widest-first (a classic
// "first-fit decreasing" heuristic) reliably packs tighter than the
// original percentage order, since the browser's own left-to-right wrap
// then fills each row more completely before spilling to the next.
function packChipsByWidth(items, widthOf) {
  return [...items].sort((a, b) => widthOf(b) - widthOf(a));
}
function estimateMicroChipWidth(label, dvPct) {
  // Rough proxy for rendered pixel width: icon + gaps/padding overhead,
  // plus the label and %DV text lengths (each character counted roughly
  // equally, which is close enough for sorting purposes).
  return 26 + label.length * 6 + String(dvPct).length * 6;
}

// Sodium is the one nutrient where MORE isn't better — flip its framing to
// a caution instead of a "good source" badge. Everything else is "get more".
const MICRO_LIMIT_NUTRIENTS = new Set(["sodium"]);

const MICRO_TIER_STYLE = {
  excellent: { color: "#1d9e75", label: { en: "Excellent source", fa: "منبع عالی" } },
  good: { color: "#7fa3d1", label: { en: "Good source", fa: "منبع خوب" } },
  caution: { color: "#d4534f", label: { en: "High", fa: "بالا" } },
  "mild-caution": { color: "#e0a83c", label: { en: "Moderate", fa: "متوسط" } },
};

// Only nutrients that clear a real threshold (~10%+ DV) are worth a person's
// attention — a 3% DV trace isn't actionable. This turns the row-of-ten-
// numbers into a short, meaningful highlight list.
function microTier(key, dvPct) {
  const limiting = MICRO_LIMIT_NUTRIENTS.has(key);
  if (limiting) {
    if (dvPct >= 20) return "caution";
    if (dvPct >= 10) return "mild-caution";
    return null;
  }
  if (dvPct >= 20) return "excellent";
  if (dvPct >= 10) return "good";
  return null;
}

// Combine several foods into one "plate": macro grams sum directly (they're
// additive), but the glucose *curve* is not a simple point-wise average —
// combining foods raises total glycemic load (more carbs = more total
// glucose) while fat/fiber typically blunts and delays the peak. This model
// sums glycemic load, then applies a simple blunting/delay heuristic based
// on how much fat and fiber ride along with the carbs — a simplification,
// not a clinical prediction (real mixed-meal responses depend on much more).
function computePlate(plateFoods, mode, customGrams) {
  const cg = customGrams || {};
  const macros = Object.fromEntries(MACRO_KEYS_ORDERED.map((k) => [k, 0]));
  const micros = Object.fromEntries(MICRO_KEYS_ORDERED.map((k) => [k, 0]));
  let totalCarb = 0;
  let totalGL = 0;
  let ttpWeightedSum = 0;
  let totalFatG = 0;
  let totalFiberG = 0;
  let totalPortionGrams = 0;

  plateFoods.forEach((f) => {
    const { grams, gl, carbsAtPortion } = portionInfo(f, mode, cg[f.id]);
    const m = macrosAtPortion(f, grams);
    const mi = microsAtPortion(f, grams);
    MACRO_KEYS_ORDERED.forEach((k) => (macros[k] += m[k]));
    MICRO_KEYS_ORDERED.forEach((k) => (micros[k] += mi[k]));
    totalCarb += carbsAtPortion;
    totalGL += gl;
    ttpWeightedSum += f.ttp * Math.max(gl, 0.1);
    totalFatG += (f.fat100 * grams) / 100;
    totalFiberG += m.soluble + m.insoluble;
    totalPortionGrams += grams;
  });

  const weightGlSum = plateFoods.reduce((s, f) => s + Math.max(portionInfo(f, mode, cg[f.id]).gl, 0.1), 0);
  const weightedTtp = weightGlSum > 0 ? ttpWeightedSum / weightGlSum : 60;
  const fatFiberRatio = (totalFatG + totalFiberG) / (totalCarb + 5);
  const bluntFactor = Math.max(0.55, 1 - 0.18 * fatFiberRatio);
  const delayBonus = (1 - bluntFactor) * 55;
  const pseudo = { ttp: weightedTtp + delayBonus, cat: totalFatG > totalCarb * 0.25 ? "fat" : "grain" };
  const curve = curvePoints(pseudo, totalGL * bluntFactor);

  const totalProteinG = macros.protein;
  const totalFatGAll = macros.satFat + macros.mono + macros.poly;
  const totalCarbG = totalCarb + macros.soluble + macros.insoluble;
  const totalCal = totalCarbG * 4 + totalProteinG * 4 + totalFatGAll * 9;

  const aminos = Object.fromEntries(AMINO_KEYS_ORDERED.map((k) => [k, 0]));
  plateFoods.forEach((f) => {
    const { grams } = portionInfo(f, mode, cg[f.id]);
    const a = aminoAcidsAtPortion(f, grams);
    AMINO_KEYS_ORDERED.forEach((k) => (aminos[k] += a[k]));
  });

  const fatAcids = Object.fromEntries(FAT_KEYS_ORDERED.map((k) => [k, 0]));
  plateFoods.forEach((f) => {
    const { grams } = portionInfo(f, mode, cg[f.id]);
    const fa = fatAcidsAtPortion(f, grams);
    FAT_KEYS_ORDERED.forEach((k) => (fatAcids[k] += fa[k]));
  });

  const carbTypes = Object.fromEntries(CARB_KEYS_ORDERED.map((k) => [k, 0]));
  plateFoods.forEach((f) => {
    const { grams } = portionInfo(f, mode, cg[f.id]);
    const c = carbTypesAtPortion(f, grams);
    CARB_KEYS_ORDERED.forEach((k) => (carbTypes[k] += c[k]));
  });
  // Plate-level fat quality is computed from the COMBINED fatty-acid
  // totals (same "combine, don't average" logic as protein quality below),
  // reusing the sat/mono/poly totals already aggregated in `macros` above.
  let fatQuality = null;
  const plateTotalFat = macros.satFat + macros.mono + macros.poly;
  if (plateTotalFat >= 0.5) {
    const satShare = macros.satFat / plateTotalFat;
    const transShare = fatAcids.trans / plateTotalFat;
    const omega3Share = (fatAcids.ala + fatAcids.omega3_marine) / plateTotalFat;
    const unsatShare = (macros.mono + macros.poly) / plateTotalFat;
    fatQuality = fatQualityFromShares(satShare, transShare, omega3Share, unsatShare);
  }
  // Same combined (not averaged) totals, run through the alternate
  // functional-medicine lens — see functionalFatQualityFromShares above.
  let functionalFatQuality = null;
  if (plateTotalFat >= 0.5) {
    const satShare = macros.satFat / plateTotalFat;
    const transShare = fatAcids.trans / plateTotalFat;
    const isPasturedRelevant = plateFoods.some((f) => PASTURED_RELEVANT_IDS.includes(f.id));
    functionalFatQuality = functionalFatQualityFromShares(satShare, transShare, fatAcids.linoleic, fatAcids.ala + fatAcids.omega3_marine, isPasturedRelevant);
  }

  // Plate-level protein quality is computed from the COMBINED amino acid
  // totals, not averaged per-food — this is what lets complementary proteins
  // (e.g. grains + legumes) score higher together than either scores alone,
  // since one food's surplus of an amino acid can cover another's shortfall.
  let proteinQuality = null;
  if (totalProteinG >= 0.5) {
    let minRatio = Infinity;
    let limitingKey = null;
    Object.keys(REFERENCE_AA_PATTERN).forEach((k) => {
      const fractionPerGProtein = aminos[k] / totalProteinG;
      const ratio = fractionPerGProtein / REFERENCE_AA_PATTERN[k];
      if (ratio < minRatio) {
        minRatio = ratio;
        limitingKey = k;
      }
    });
    let proteinForDig = 0;
    let weightedDig = 0;
    plateFoods.forEach((f) => {
      const { grams } = portionInfo(f, mode, cg[f.id]);
      const proteinG = (f.protein100 * grams) / 100;
      proteinForDig += proteinG;
      weightedDig += proteinG * DIGESTIBILITY_BY_PROFILE[aminoProfileKey(f)];
    });
    const digestibility = proteinForDig > 0 ? weightedDig / proteinForDig : 0.85;
    proteinQuality = { score: Math.min(1, minRatio), limitingKey, rawRatio: minRatio, digestibility };
  }

  return {
    macros,
    micros,
    aminos,
    proteinQuality,
    fatAcids,
    fatQuality,
    functionalFatQuality,
    carbTypes,
    totalCarb,
    totalGL,
    ttp: Math.round(pseudo.ttp),
    curve,
    bluntFactor,
    totalCarbG,
    totalProteinG,
    totalFatG: totalFatGAll,
    totalCal,
    totalPortionGrams,
  };
}

// ---------------------------------------------------------------------------
// Daily meal plan: five named plate "slots" a person fills across the day,
// each built with the exact same "in plate" mechanism as the single plate
// above. Slot ids double as persistence keys, so don't rename them without
// a migration. Approximate default clock times only decide where each
// slot's glucose-response curve lands on the 24h chart below.
// ---------------------------------------------------------------------------
const MEAL_SLOTS = [
  { id: "breakfast", label: { en: "Breakfast", fa: "صبحانه" }, emoji: "🍳", startMin: 7 * 60 + 30 },
  { id: "lunch", label: { en: "Lunch", fa: "ناهار" }, emoji: "🥗", startMin: 13 * 60 },
  { id: "snack", label: { en: "Snack", fa: "میان‌وعده" }, emoji: "🍎", startMin: 15 * 60 + 30 },
  { id: "dinner", label: { en: "Dinner", fa: "شام" }, emoji: "🍽️", startMin: 19 * 60 },
];
const MEAL_SLOT_IDS = MEAL_SLOTS.map((s) => s.id);
const DAILY_TAB_ID = "daily";
const DAILY_TAB_EMOJI = "📊";

function emptyPlateSlots() {
  const o = {};
  MEAL_SLOT_IDS.forEach((id) => (o[id] = []));
  return o;
}

function formatClock(min, lang) {
  const h = Math.floor(min / 60) % 24;
  const m = Math.round(min % 60);
  const ampm = lang === "fa" ? (h < 12 ? "ق.ظ" : "ب.ظ") : h < 12 ? "AM" : "PM";
  let h12 = h % 12;
  if (h12 === 0) h12 = 12;
  return `${h12}${m === 0 ? "" : ":" + String(m).padStart(2, "0")}${ampm}`;
}

// Sums each filled slot's own glucose-response curve (computed exactly like
// the single-plate curve) into one 24h timeline, offset by that slot's
// clock time. This is a superposition of independent curves, not a new
// physiological model — same caveats as the single-plate estimate apply,
// compounded across meals.
function computeDailyCurve(plateSlots, mode, customGrams) {
  const stepMin = 10;
  const totalMin = 24 * 60;
  const n = totalMin / stepMin + 1;
  const curve = new Array(n).fill(0);
  MEAL_SLOTS.forEach((slot) => {
    const ids = plateSlots[slot.id] || [];
    const foods = ids.map((id) => FOOD_BY_ID[id]).filter(Boolean);
    if (foods.length === 0) return;
    const p = computePlate(foods, mode, customGrams);
    p.curve.forEach((val, i) => {
      const tAbs = slot.startMin + i * 5;
      if (tAbs > totalMin) return;
      const idx = Math.round(tAbs / stepMin);
      if (idx >= 0 && idx < n) curve[idx] += val;
    });
  });
  const labels = [];
  for (let m = 0; m <= totalMin; m += stepMin) labels.push(m);
  return { labels, curve };
}

// One computed sentence surfacing the comparison's most decision-relevant
// fact, so the person doesn't have to eyeball every card's numbers
// themselves to find it. Only makes sense with 2+ foods selected.
function buildTakeaway(selected, mode, customGrams, lang) {
  const t = (en, fa) => (lang === "fa" ? fa : en);
  if (selected.length < 2) return null;
  const withGL = selected.map((f) => ({ f, gl: portionInfo(f, mode, customGrams[f.id]).gl }));
  const highestGL = withGL.reduce((a, b) => (b.gl > a.gl ? b : a));
  const slowest = selected.reduce((a, b) => (b.ttp > a.ttp ? b : a));
  const fastest = selected.reduce((a, b) => (b.ttp < a.ttp ? b : a));

  const highName = t(highestGL.f.name, highestGL.f.nameFa);
  const slowName = t(slowest.name, slowest.nameFa);

  if (highestGL.f.id === slowest.id) {
    return t(
      `${highName} has both the highest glycemic load and the slowest digestion here — expect a strong, prolonged rise.`,
      `${highName} هم بیشترین بار گلایسمی و هم کندترین هضم را در این مقایسه دارد — انتظار افزایش قوی و طولانی را داشته باشید.`
    );
  }
  if (highestGL.f.id === fastest.id) {
    return t(
      `${highName} has the highest glycemic load here and hits fastest too — a sharp, quick spike.`,
      `${highName} بیشترین بار گلایسمی را دارد و سریع‌ترین هم هست — یک افزایش تیز و سریع.`
    );
  }
  return t(
    `${highName} has the highest glycemic load in this comparison; ${slowName} is the slowest to digest.`,
    `${highName} بیشترین بار گلایسمی را در این مقایسه دارد؛ ${slowName} کندترین هضم را دارد.`
  );
}

const BADGE_META = {
  lowestGL: { icon: "🏆", label: { en: "Lowest glycemic load", fa: "کمترین بار گلایسمی" }, color: "#1d9e75" },
  slowest: { icon: "🐢", label: { en: "Gentlest / slowest digesting", fa: "ملایم‌ترین / کندترین هضم" }, color: "#7fa3d1" },
  bestProtein: { icon: "💪", label: { en: "Best protein quality", fa: "بهترین کیفیت پروتئین" }, color: "#e0a83c" },
};

// Surfaces the comparison's category "winners" directly on the cards
// themselves, not just in the one-line takeaway above the chart. Only
// applies with 2+ foods selected — a badge needs something to beat.
function computeBestBadges(selected, mode, customGrams) {
  const badges = {};
  if (selected.length < 2) return badges;

  function add(id, key) {
    if (!badges[id]) badges[id] = [];
    badges[id].push(key);
  }

  const withGL = selected.map((f) => ({ f, gl: portionInfo(f, mode, customGrams[f.id]).gl }));
  const lowestGL = withGL.reduce((a, b) => (b.gl < a.gl ? b : a));
  add(lowestGL.f.id, "lowestGL");

  const slowest = selected.reduce((a, b) => (b.ttp > a.ttp ? b : a));
  add(slowest.id, "slowest");

  const proteinCandidates = selected.filter((f) => f.protein100 >= 5);
  if (proteinCandidates.length >= 2) {
    const bestProtein = proteinCandidates.reduce((a, b) => (foodProteinQuality(b).score > foodProteinQuality(a).score ? b : a));
    add(bestProtein.id, "bestProtein");
  }

  return badges;
}


function buildShareText(selected, plateIds, mode, lang, customGrams) {
  const cg = customGrams || {};
  const t = (en, fa) => (lang === "fa" ? fa : en);
  const modeLabel = t(PORTION_MODES[mode].label, PORTION_MODES[mode].labelFa);
  const lines = [t("Glycemic comparison", "مقایسه گلایسمی"), `(${modeLabel})`, ""];
  selected.forEach((f) => {
    const { gl, carbsAtPortion, grams } = portionInfo(f, mode, cg[f.id]);
    const customTag = cg[f.id] != null ? ` [${round(grams)}g]` : "";
    lines.push(
      `${t(f.name, f.nameFa)}${customTag}: GI ${f.gi}, GL ${round(gl, 1)}, ${t("carbs", "کربوهیدرات")} ${round(carbsAtPortion)}g, ${t("peak", "اوج")} ${f.ttp}min`
    );
  });
  const plateFoods = selected.filter((f) => plateIds.includes(f.id));
  if (plateFoods.length > 1) {
    const plate = computePlate(plateFoods, mode, cg);
    lines.push("", `${t("Plate total", "جمع بشقاب")}: GL ${round(plate.totalGL, 1)}, ${t("carbs", "کربوهیدرات")} ${round(plate.totalCarb)}g, ${t("est. peak", "اوج تخمینی")} ${plate.ttp}min`);
  }
  if (typeof window !== "undefined" && /^https?:/.test(window.location.protocol)) {
    const url = new URL(window.location.href);
    url.searchParams.set("foods", selected.map((f) => f.id).join(","));
    url.searchParams.set("plate", plateIds.join(","));
    url.searchParams.set("mode", mode);
    url.searchParams.set("lang", lang);
    lines.push("", url.toString());
  }
  return lines.join("\n");
}

// Daily-total share text: one line per filled meal slot, then the summed
// macro/micro/calorie totals across the whole day.
function buildDailyShareText(plateSlots, mode, lang, customGrams) {
  const cg = customGrams || {};
  const t = (en, fa) => (lang === "fa" ? fa : en);
  const lines = [t("Daily meal plan", "برنامه غذایی روزانه"), ""];
  const allFoods = [];
  MEAL_SLOTS.forEach((slot) => {
    const ids = plateSlots[slot.id] || [];
    const foods = ids.map((id) => FOOD_BY_ID[id]).filter(Boolean);
    if (foods.length === 0) return;
    const p = computePlate(foods, mode, cg);
    allFoods.push(...foods);
    lines.push(`${t(slot.label.en, slot.label.fa)}: ${foods.map((f) => t(f.name, f.nameFa)).join(" + ")} — ${round(p.totalCal)} kcal`);
  });
  if (allFoods.length === 0) {
    lines.push(t("No meals logged yet.", "هنوز وعده‌ای ثبت نشده."));
    return lines.join("\n");
  }
  const daily = computePlate(allFoods, mode, cg);
  lines.push(
    "",
    `${t("Daily total", "جمع روزانه")}: ${round(daily.totalCal)} kcal, ${t("carbs", "کربوهیدرات")} ${round(daily.totalCarbG)}g, ${t("protein", "پروتئین")} ${round(daily.totalProteinG)}g, ${t("fat", "چربی")} ${round(daily.totalFatG)}g`
  );
  return lines.join("\n");
}

function copyText(text) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    return navigator.clipboard.writeText(text).catch(() => fallbackCopy(text));
  }
  return fallbackCopy(text);
}

function fallbackCopy(text) {
  return new Promise((resolve) => {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    try {
      document.execCommand("copy");
    } catch (e) {
      // ignore
    }
    document.body.removeChild(ta);
    resolve();
  });
}

function readInitialState() {
  if (typeof window === "undefined") return null;
  try {
    const params = new URLSearchParams(window.location.search);
    const foodsParam = params.get("foods");
    const modeParam = params.get("mode");
    const langParam = params.get("lang");
    const plateParam = params.get("plate");
    if (!foodsParam) return null;
    const ids = foodsParam.split(",").filter((id) => FOOD_BY_ID[id]).slice(0, MAX_TRACKED_IDS);
    if (ids.length === 0) return null;
    const plateIds = plateParam ? plateParam.split(",").filter((id) => ids.includes(id)) : ids;
    const plateSlots = emptyPlateSlots();
    plateSlots.breakfast = plateIds;
    return {
      ids,
      plateSlots,
      activeSlot: "breakfast",
      mode: modeParam && PORTION_MODES[modeParam] ? modeParam : "fda",
      lang: langParam === "fa" ? "fa" : "en",
      customGrams: {},
    };
  } catch (e) {
    return null;
  }
}

// Remembers the last comparison across page reloads (a URL, when present,
// still wins — that's an intentional share link and should override
// whatever was left over from a previous local session).
const STORAGE_KEY = "glycemic-compare-state-v1";

function readPersistedState() {
  if (typeof window === "undefined" || !window.localStorage) return null;
  try {
    const raw = window.localStorage.getItem(STORAGE_KEY);
    if (!raw) return null;
    const parsed = JSON.parse(raw);
    if (!parsed || !Array.isArray(parsed.selectedIds)) return null;
    const ids = parsed.selectedIds.filter((id) => FOOD_BY_ID[id]).slice(0, MAX_TRACKED_IDS);
    if (ids.length === 0) return null;
    let plateSlots;
    if (parsed.plateSlots && typeof parsed.plateSlots === "object") {
      plateSlots = emptyPlateSlots();
      MEAL_SLOT_IDS.forEach((slotId) => {
        const arr = parsed.plateSlots[slotId];
        plateSlots[slotId] = Array.isArray(arr) ? arr.filter((id) => ids.includes(id)) : [];
      });
      // migrate from an even older save that had two separate snack slots
      if (Array.isArray(parsed.plateSlots.snack1) || Array.isArray(parsed.plateSlots.snack2)) {
        plateSlots.snack = [...(parsed.plateSlots.snack1 || []), ...(parsed.plateSlots.snack2 || [])].filter((id) => ids.includes(id));
      }
    } else {
      // migrate from the older single-plate format: whatever was "in
      // plate" before becomes the breakfast slot, other slots start empty
      plateSlots = emptyPlateSlots();
      const legacyPlateIds = Array.isArray(parsed.plateIds) ? parsed.plateIds.filter((id) => ids.includes(id)) : ids;
      plateSlots.breakfast = legacyPlateIds;
    }
    const activeSlot = MEAL_SLOT_IDS.includes(parsed.activeSlot) || parsed.activeSlot === DAILY_TAB_ID ? parsed.activeSlot : "breakfast";
    return {
      ids,
      plateSlots,
      activeSlot,
      mode: parsed.mode && PORTION_MODES[parsed.mode] ? parsed.mode : "fda",
      lang: parsed.lang === "fa" ? "fa" : "en",
      customGrams: parsed.customGrams && typeof parsed.customGrams === "object" ? parsed.customGrams : {},
    };
  } catch (e) {
    return null;
  }
}

function writePersistedState(state) {
  if (typeof window === "undefined" || !window.localStorage) return;
  try {
    window.localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch (e) {
    // storage full / private-browsing lockout — silently skip persistence
  }
}

function clearPersistedState() {
  if (typeof window === "undefined" || !window.localStorage) return;
  try {
    window.localStorage.removeItem(STORAGE_KEY);
  } catch (e) {
    // ignore
  }
}

// A bigger pie with the gram amount written directly in each slice
// (no separate legend list beside it).
function NutrientPie({ values, size, lang, keysOrdered, colors, labels, minSlicePct, kcalPerGram, doughnut, centerUnitLabel, sliceInfo }) {
  const canvasRef = useRef(null);
  const chartRef = useRef(null);
  const [, setTick] = useState(0);
  const readyRef = useRef(false);
  const isDoughnut = doughnut || !!kcalPerGram;
  const t = (en, fa) => (lang === "fa" ? fa : en);
  // Only meaningful for doughnut-style pies — the hovered/tapped slice's
  // info is written into the donut hole itself instead of a floating
  // Chart.js tooltip, which is both easier to land on with a finger and
  // can't end up hidden behind anything.
  const [hoverInfo, setHoverInfo] = useState(null);
  // While the "i" popup for the current slice is open, ignore the chart's
  // mouse-leave clear — the popup can render outside the pie's small
  // bounding box, so moving the cursor onto the popup text itself would
  // otherwise trip "mouse left the chart" and slam the panel shut.
  const infoOpenRef = useRef(false);

  useEffect(() => {
    function bothReady() {
      return window.Chart && window.ChartDataLabels;
    }
    if (bothReady()) {
      readyRef.current = true;
      setTick((x) => x + 1);
      return;
    }
    const check = setInterval(() => {
      if (bothReady()) {
        readyRef.current = true;
        clearInterval(check);
        setTick((x) => x + 1);
      }
    }, 150);
    return () => clearInterval(check);
  }, []);

  const data = keysOrdered.map((k) => round(values[k], 1));
  const nonZero = data.some((v) => v > 0);
  const total = data.reduce((a, b) => a + b, 0) || 1;
  const rawTotal = data.reduce((a, b) => a + b, 0);
  const totalKcal = kcalPerGram ? keysOrdered.reduce((sum, k) => sum + (values[k] || 0) * (kcalPerGram[k] || 0), 0) : null;

  useEffect(() => {
    if (!readyRef.current || !canvasRef.current) return;
    const t = (en, fa) => (lang === "fa" ? fa : en);
    const threshold = minSlicePct != null ? minSlicePct : 0.045;

    if (chartRef.current) chartRef.current.destroy();
    // NOTE: the datalabels plugin self-registers globally once its script
    // loads after Chart.js — do NOT also pass a per-chart `plugins: [...]`
    // array here, or labels get drawn twice (slightly offset), which looks
    // like grams showing up in the wrong spot on the slice.
    chartRef.current = new window.Chart(canvasRef.current, {
      type: isDoughnut ? "doughnut" : "pie",
      data: {
        labels: keysOrdered.map((k) => t(labels[k].en, labels[k].fa)),
        datasets: [
          {
            data: nonZero ? data : [1],
            backgroundColor: nonZero ? keysOrdered.map((k) => colors[k]) : ["#2a2c2d"],
            borderColor: "#0d0f10",
            borderWidth: 2,
          },
        ],
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        animation: false,
        cutout: isDoughnut ? "62%" : 0,
        // For doughnut pies with a center display, the hovered slice's
        // numbers are written into the hole itself (see hoverInfo below)
        // instead of a floating tooltip, so there's nothing left to fight
        // for space around the calorie/total figure. We deliberately do
        // NOT clear hoverInfo when elements.length is 0 here — that fires
        // constantly as the cursor crosses the cutout hole on its way to
        // the "i" info button, and clearing on every such frame made the
        // info vanish before a click could land. Instead it's only cleared
        // by onMouseLeave on the chart's wrapper below, once the pointer
        // actually leaves the whole chart.
        onHover: isDoughnut
          ? (event, elements) => {
              if (elements.length === 0) return;
              const idx = elements[0].index;
              const key = keysOrdered[idx];
              const val = data[idx];
              const pct = Math.round((val / total) * 100);
              const kcal = kcalPerGram ? Math.round(val * (kcalPerGram[key] || 0)) : null;
              setHoverInfo({ key, label: t(labels[key].en, labels[key].fa), value: val, pct, kcal, color: colors[key] });
            }
          : undefined,
        plugins: {
          legend: { display: false },
          tooltip: {
            // Doughnut pies show hover info in the center instead — see
            // onHover above — so the floating tooltip is only needed for
            // full-pie charts that have no hole.
            enabled: nonZero && !isDoughnut,
            titleColor: "#e8e6df",
            bodyColor: "#e8e6df",
            backgroundColor: "#16181a",
            borderColor: "#3a3d3e",
            borderWidth: 1,
            callbacks: {
              label: (ctx) => {
                const grams = ctx.parsed;
                const pct = Math.round((grams / total) * 100);
                return `${ctx.label}: ${grams}g (${pct}%)`;
              },
            },
          },
          datalabels: {
            anchor: "center",
            align: "center",
            clamp: true,
            color: "#f5f4f0",
            backgroundColor: "rgba(13,15,16,0.6)",
            borderRadius: 4,
            padding: { top: 2, bottom: 2, left: 4, right: 4 },
            font: { size: 10, weight: "600" },
            formatter: (value) => {
              if (!nonZero || value <= 0) return "";
              const pct = value / total;
              if (pct < threshold) return "";
              return `${round(value, value < 10 ? 1 : 0)}g`;
            },
          },
        },
      },
    });
    return () => chartRef.current && chartRef.current.destroy();
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [values, lang, readyRef.current]);

  return (
    <div
      style={{ position: "relative", width: size, height: size, margin: "0 auto" }}
      onMouseLeave={() => {
        if (!infoOpenRef.current) setHoverInfo(null);
      }}
    >
      <canvas ref={canvasRef} />
      {isDoughnut && (
        <div
          style={{
            position: "absolute",
            inset: 0,
            display: "flex",
            flexDirection: "column",
            alignItems: "center",
            justifyContent: "center",
            padding: "0 12%",
            textAlign: "center",
            pointerEvents: "none",
          }}
        >
          {hoverInfo ? (
            <>
              <span style={{ width: 8, height: 8, borderRadius: "50%", background: hoverInfo.color, marginBottom: 4 }} />
              <div style={{ fontSize: size >= 150 ? 13.5 : 11.5, fontWeight: 600, color: "#e8e6df", lineHeight: 1.25, display: "flex", alignItems: "center", gap: 3 }}>
                {hoverInfo.label}
                {sliceInfo && sliceInfo[hoverInfo.key] && (
                  <span style={{ pointerEvents: "auto" }}>
                    <InfoIcon
                      text={t(sliceInfo[hoverInfo.key].en, sliceInfo[hoverInfo.key].fa)}
                      onOpenChange={(o) => {
                        infoOpenRef.current = o;
                      }}
                    />
                  </span>
                )}
              </div>
              <div style={{ fontSize: size >= 150 ? 13.5 : 11.5, color: "#c7c5bc", lineHeight: 1.3 }}>
                {round(hoverInfo.value, hoverInfo.value < 10 ? 1 : 0)}g · {hoverInfo.pct}%
              </div>
              {hoverInfo.kcal != null && <div style={{ fontSize: size >= 150 ? 12 : 10.5, color: "#8a8f8f", lineHeight: 1.3 }}>{hoverInfo.kcal} kcal</div>}
            </>
          ) : kcalPerGram ? (
            <>
              <div style={{ fontSize: size >= 150 ? 20 : 15, fontWeight: 700, color: "#e8e6df", lineHeight: 1.1 }}>{round(totalKcal)}</div>
              <div style={{ fontSize: size >= 150 ? 10 : 8, color: "#8a8f8f", textTransform: "uppercase", letterSpacing: "0.04em" }}>kcal</div>
            </>
          ) : (
            <>
              <div style={{ fontSize: size >= 150 ? 20 : 15, fontWeight: 700, color: "#e8e6df", lineHeight: 1.1 }}>{round(rawTotal, rawTotal < 10 ? 1 : 0)}g</div>
              {centerUnitLabel && (
                <div style={{ fontSize: size >= 150 ? 10 : 8, color: "#8a8f8f", textTransform: "uppercase", letterSpacing: "0.04em" }}>{centerUnitLabel}</div>
              )}
            </>
          )}
        </div>
      )}
    </div>
  );
}

// Compact single-food glucose-response curve, sized to sit beside a food
// card's macro pie without adding much visual weight — no axes, no legend,
// just the shape of the response.
function MiniCurveChart({ food, gl, width, height, lang }) {
  const canvasRef = useRef(null);
  const chartRef = useRef(null);
  const [, setTick] = useState(0);
  const readyRef = useRef(false);
  const t = (en, fa) => (lang === "fa" ? fa : en);

  useEffect(() => {
    if (window.Chart) {
      readyRef.current = true;
      setTick((x) => x + 1);
      return;
    }
    const check = setInterval(() => {
      if (window.Chart) {
        readyRef.current = true;
        clearInterval(check);
        setTick((x) => x + 1);
      }
    }, 150);
    return () => clearInterval(check);
  }, []);

  useEffect(() => {
    if (!readyRef.current || !canvasRef.current) return;
    const labels = [];
    for (let tt = 0; tt <= 200; tt += 5) labels.push(tt);
    if (chartRef.current) chartRef.current.destroy();
    chartRef.current = new window.Chart(canvasRef.current, {
      type: "line",
      data: {
        labels,
        datasets: [
          {
            data: curvePoints(food, gl),
            borderColor: giToColor(food.gi),
            backgroundColor: giToColor(food.gi, 0.16),
            fill: true,
            borderWidth: 2,
            pointRadius: 0,
            tension: 0.3,
          },
        ],
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        animation: false,
        layout: { padding: { top: 2, right: 4 } },
        plugins: {
          legend: { display: false },
          tooltip: { enabled: false },
          datalabels: { display: false },
        },
        scales: {
          x: {
            display: true,
            ticks: {
              color: "#a9ada9",
              font: { size: 11 },
              maxTicksLimit: 5,
              autoSkip: true,
              padding: 2,
            },
            grid: { display: false },
            border: { color: "#3a3d3e" },
            title: { display: true, text: t("min", "دقیقه"), color: "#8a8f8f", font: { size: 10 } },
          },
          y: {
            display: true,
            beginAtZero: true,
            ticks: {
              color: "#a9ada9",
              font: { size: 11 },
              maxTicksLimit: 3,
              padding: 2,
            },
            grid: { color: "#222425", lineWidth: 0.5 },
            border: { color: "#3a3d3e" },
          },
        },
      },
    });
    return () => chartRef.current && chartRef.current.destroy();
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [food, gl, lang, readyRef.current]);

  return (
    <div style={{ width, height }}>
      <canvas ref={canvasRef} />
    </div>
  );
}

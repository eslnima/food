}

function computeFunctionalCarbScore(food) {
  const totalCarb = food.carbs100 + food.soluble100 + food.insoluble100;
  if (!totalCarb || totalCarb < 1) return null;
  const fiber = food.soluble100 + food.insoluble100;
  const carbTypes100 = carbTypesAtPortion(food, 100);
  const totalSugar = carbTypes100.glucose + carbTypes100.fructose + carbTypes100.sucrose + carbTypes100.lactose + carbTypes100.maltose;
  const fructoseShare = totalSugar > 0 ? carbTypes100.fructose / totalSugar : null;
  const isRefined = REFINED_SWEETENER_IDS.includes(food.id) || REFINED_STARCH_IDS.includes(food.id);
  const isWholeFood = !isRefined && (["fruit", "veg", "legume"].includes(food.cat) || WHOLE_GRAIN_IDS.includes(food.id));
  const isNaturalSweetener = NATURAL_SWEETENER_IDS.includes(food.id);
  return functionalCarbQualityFromProfile({ totalCarb, fiber, gi: food.gi, fructoseShare, isRefined, isWholeFood, isNaturalSweetener });
}

// Splits a food's own sugar100 (already-real per-food value) into named
// sugars using its source-type profile; starch and the two fiber types are
// real per-food fields passed through unchanged. Slices always sum back to
// exactly this food's real total carbs — no double counting.
function carbTypesAtPortion(food, grams) {
  const k = grams / 100;
  const sugarG = food.sugar100 * k;
  const profile = SUGAR_PROFILES[sugarProfileKey(food)];
  return {
    glucose: sugarG * (profile.glucose || 0),
    fructose: sugarG * (profile.fructose || 0),
    sucrose: sugarG * (profile.sucrose || 0),
    lactose: sugarG * (profile.lactose || 0),
    maltose: sugarG * (profile.maltose || 0),
    starch: starch(food) * k,
    soluble: food.soluble100 * k,
    insoluble: food.insoluble100 * k,
  };
}

// Adult Daily Values (FDA label reference) used only to express amounts as
// a rough %DV — not personalized, just a common yardstick.
const MICRO_DV = {
  sodium: 2300, potassium: 3400, calcium: 1300, iron: 18, vitC: 90,
  magnesium: 420, zinc: 11, vitA: 900, vitB12: 2.4, folate: 400,
};

function microField(food, key) {
  return key === "vitB12" ? food.vitB12_100 : food[`${key}100`];
}
function microAtPortion(food, key, grams) {
  return (microField(food, key) * grams) / 100;
}
function microDvPct(key, value) {
  return Math.round((value / MICRO_DV[key]) * 100);
}

// Arranges wrapping chips to use as few rows as possible. True bin-packing
// is overkill for a handful of chips, but sorting widest-first (a classic
// "first-fit decreasing" heuristic) reliably packs tighter than the
// original percentage order, since the browser's own left-to-right wrap
// then fills each row more completely before spilling to the next.
function packChipsByWidth(items, widthOf) {
  return [...items].sort((a, b) => widthOf(b) - widthOf(a));
}
function estimateMicroChipWidth(label, dvPct) {
  // Rough proxy for rendered pixel width: icon + gaps/padding overhead,
  // plus the label and %DV text lengths (each character counted roughly
  // equally, which is close enough for sorting purposes).
  return 26 + label.length * 6 + String(dvPct).length * 6;
}

    fa: "برای عملکرد عصب و تولید گلبول قرمز لازم است؛ تقریباً منحصراً در خوراکی‌های حیوانی یافت می‌شود. منابع غنی: گوشت، ماهی، تخم‌مرغ، لبنیات — کمبود شایع در وگان‌های کامل.",
  },
  folate: {
    en: "Supports DNA synthesis and cell division; especially important before and during pregnancy. High in: leafy greens, legumes, asparagus, fortified grains.",
    fa: "از سنتز DNA و تقسیم سلولی پشتیبانی می‌کند؛ به‌ویژه پیش و در دوران بارداری اهمیت دارد. منابع غنی: سبزیجات برگ‌سبز، حبوبات، مارچوبه، غلات غنی‌شده.",
  },
};

// Sodium is the one nutrient where MORE isn't better — flip its framing to
// a caution instead of a "good source" badge. Everything else is "get more".
const MICRO_LIMIT_NUTRIENTS = new Set(["sodium"]);

const MICRO_TIER_STYLE = {
  excellent: { color: "#1d9e75", label: { en: "Excellent source", fa: "منبع عالی" } },
  good: { color: "#7fa3d1", label: { en: "Good source", fa: "منبع خوب" } },
  caution: { color: "#d4534f", label: { en: "High", fa: "بالا" } },
  "mild-caution": { color: "#e0a83c", label: { en: "Moderate", fa: "متوسط" } },
};

// Only nutrients that clear a real threshold (~10%+ DV) are worth a person's
// attention — a 3% DV trace isn't actionable. This turns the row-of-ten-
// numbers into a short, meaningful highlight list.
function microTier(key, dvPct) {
  const limiting = MICRO_LIMIT_NUTRIENTS.has(key);
  if (limiting) {
    if (dvPct >= 20) return "caution";
    if (dvPct >= 10) return "mild-caution";
    return null;
  }
  if (dvPct >= 20) return "excellent";
  if (dvPct >= 10) return "good";
  return null;
}

// Combine several foods into one "plate": macro grams sum directly (they're
// additive), but the glucose *curve* is not a simple point-wise average —
// combining foods raises total glycemic load (more carbs = more total
// glucose) while fat/fiber typically blunts and delays the peak. This model
// sums glycemic load, then applies a simple blunting/delay heuristic based
// on how much fat and fiber ride along with the carbs — a simplification,
// not a clinical prediction (real mixed-meal responses depend on much more).
function computePlate(plateFoods, mode, customGrams) {
  const cg = customGrams || {};
  const macros = Object.fromEntries(MACRO_KEYS_ORDERED.map((k) => [k, 0]));
  const micros = Object.fromEntries(MICRO_KEYS_ORDERED.map((k) => [k, 0]));
  let totalCarb = 0;
  let totalGL = 0;
  let ttpWeightedSum = 0;
  let giWeightedSum = 0;
  let totalFatG = 0;
  let totalFiberG = 0;
  let totalPortionGrams = 0;

  plateFoods.forEach((f) => {
    const { grams, gl, carbsAtPortion } = portionInfo(f, mode, cg[f.id]);
    const m = macrosAtPortion(f, grams);
    const mi = microsAtPortion(f, grams);
    MACRO_KEYS_ORDERED.forEach((k) => (macros[k] += m[k]));
    MICRO_KEYS_ORDERED.forEach((k) => (micros[k] += mi[k]));
    totalCarb += carbsAtPortion;
    totalGL += gl;
    ttpWeightedSum += f.ttp * Math.max(gl, 0.1);
    giWeightedSum += f.gi * Math.max(gl, 0.1);
    totalFatG += (f.fat100 * grams) / 100;
    totalFiberG += m.soluble + m.insoluble;
    totalPortionGrams += grams;
  });

  const weightGlSum = plateFoods.reduce((s, f) => s + Math.max(portionInfo(f, mode, cg[f.id]).gl, 0.1), 0);
  const weightedTtp = weightGlSum > 0 ? ttpWeightedSum / weightGlSum : 60;
  // A single GI genuinely isn't meaningful averaged across a mixed plate
  // (see MacroTotals below, which deliberately never displays one for a
  // plate) — this GL-weighted figure exists only as an internal input to
  // the plate-level carb quality scores further down, never shown on its
  // own as "the plate's GI".
  const weightedGi = weightGlSum > 0 ? giWeightedSum / weightGlSum : null;
  const fatFiberRatio = (totalFatG + totalFiberG) / (totalCarb + 5);
  const bluntFactor = Math.max(0.55, 1 - 0.18 * fatFiberRatio);
  const delayBonus = (1 - bluntFactor) * 55;
  const pseudo = { ttp: weightedTtp + delayBonus, cat: totalFatG > totalCarb * 0.25 ? "fat" : "grain" };
  const curve = curvePoints(pseudo, totalGL * bluntFactor);

  const totalProteinG = macros.protein;
  const totalFatGAll = macros.satFat + macros.mono + macros.poly;
  const totalCarbG = totalCarb + macros.soluble + macros.insoluble;
  const totalCal = totalCarbG * 4 + totalProteinG * 4 + totalFatGAll * 9;

  const aminos = Object.fromEntries(AMINO_KEYS_ORDERED.map((k) => [k, 0]));
  plateFoods.forEach((f) => {
    const { grams } = portionInfo(f, mode, cg[f.id]);
    const a = aminoAcidsAtPortion(f, grams);
    AMINO_KEYS_ORDERED.forEach((k) => (aminos[k] += a[k]));
  });

  const fatAcids = Object.fromEntries(FAT_KEYS_ORDERED.map((k) => [k, 0]));
  plateFoods.forEach((f) => {
    const { grams } = portionInfo(f, mode, cg[f.id]);
    const fa = fatAcidsAtPortion(f, grams);
    FAT_KEYS_ORDERED.forEach((k) => (fatAcids[k] += fa[k]));
  });

  const carbTypes = Object.fromEntries(CARB_KEYS_ORDERED.map((k) => [k, 0]));
  plateFoods.forEach((f) => {
    const { grams } = portionInfo(f, mode, cg[f.id]);
    const c = carbTypesAtPortion(f, grams);
    CARB_KEYS_ORDERED.forEach((k) => (carbTypes[k] += c[k]));
  });

  // Plate-level carb quality (both lenses) from the COMBINED totals above —
  // same "combine, don't average" approach as protein/fat quality. Density
  // figures (fiber, sugar) are read per 100g of the whole plate's mass,
  // the same framing a single food's own fiber100/sugar100 use. GI uses
  // the GL-weighted average computed above rather than a bare average,
  // since a food eaten in a bigger portion should dominate the figure
  // more than a garnish-sized side.
  const plateTotalCarbForScore = totalCarbG;
  let carbQuality = null;
  let functionalCarbQuality = null;
  if (plateTotalCarbForScore >= 1 && totalPortionGrams > 0 && weightedGi != null) {
    const fiberPer100 = (totalFiberG / totalPortionGrams) * 100;
    const sugarPer100 = (macros.sugar / totalPortionGrams) * 100;
    const isAddedSugar = plateFoods.some((f) => REFINED_SWEETENER_IDS.includes(f.id));
    const isWholeGrain = plateFoods.some((f) => WHOLE_GRAIN_IDS.includes(f.id));
    const isGrain = plateFoods.some((f) => f.cat === "grain");
    carbQuality = carbQualityFromProfile({ fiberPer100, sugarPer100, gi: Math.round(weightedGi), isAddedSugar, isWholeGrain, isGrain });

    const totalSugarAll = carbTypes.glucose + carbTypes.fructose + carbTypes.sucrose + carbTypes.lactose + carbTypes.maltose;
    const fructoseShare = totalSugarAll > 0 ? carbTypes.fructose / totalSugarAll : null;
    // A plate could contain both a natural sweetener (honey) and a fully
    // isolated one (white bread, table sugar) — in that case the more
    // concerning, fully-refined contributor should drive the score, not
    // get masked just because honey is also present.
    const hasFullyRefined = plateFoods.some((f) => (REFINED_SWEETENER_IDS.includes(f.id) || REFINED_STARCH_IDS.includes(f.id)) && !NATURAL_SWEETENER_IDS.includes(f.id));
    const hasNaturalSweetener = plateFoods.some((f) => NATURAL_SWEETENER_IDS.includes(f.id));
    const isRefined = hasFullyRefined;
    const isNaturalSweetener = hasNaturalSweetener && !hasFullyRefined;
    const isWholeFood = plateFoods.some((f) => {
      const fRefined = REFINED_SWEETENER_IDS.includes(f.id) || REFINED_STARCH_IDS.includes(f.id);
      return !fRefined && (["fruit", "veg", "legume"].includes(f.cat) || WHOLE_GRAIN_IDS.includes(f.id));
    });
    functionalCarbQuality = functionalCarbQualityFromProfile({
      totalCarb: plateTotalCarbForScore,
      fiber: totalFiberG,
      gi: Math.round(weightedGi),
      fructoseShare,
      isRefined,
      isWholeFood,
      isNaturalSweetener,
    });
  }

  // Plate-level fat quality is computed from the COMBINED fatty-acid
  // totals (same "combine, don't average" logic as protein quality below),
  // reusing the sat/mono/poly totals already aggregated in `macros` above.
  let fatQuality = null;
  const plateTotalFat = macros.satFat + macros.mono + macros.poly;
  if (plateTotalFat >= 0.5) {
    const satShare = macros.satFat / plateTotalFat;
    const transShare = fatAcids.trans / plateTotalFat;
    const omega3Share = (fatAcids.ala + fatAcids.omega3_marine) / plateTotalFat;
    const unsatShare = (macros.mono + macros.poly) / plateTotalFat;
    fatQuality = fatQualityFromShares(satShare, transShare, omega3Share, unsatShare);
  }
  // Same combined (not averaged) totals, run through the alternate
  // functional-medicine lens — see functionalFatQualityFromShares above.
  // Per-food sourcing overrides aren't combined across a mixed plate here
  // (that gets ambiguous fast with several foods) — this always uses the
  // heuristic guess, same as before per-food overrides existed.
  let functionalFatQuality = null;
  if (plateTotalFat >= 0.5) {
    const satShare = macros.satFat / plateTotalFat;
    const transShare = fatAcids.trans / plateTotalFat;
    const isPasturedRelevant = plateFoods.some((f) => PASTURED_RELEVANT_IDS.includes(f.id));
    const sourcingState = isPasturedRelevant ? "unknown_eligible" : "not_applicable";
    functionalFatQuality = functionalFatQualityFromShares(satShare, transShare, fatAcids.linoleic, fatAcids.ala + fatAcids.omega3_marine, sourcingState);
  }

  // Plate-level protein quality is computed from the COMBINED amino acid
  // totals, not averaged per-food — this is what lets complementary proteins
  // (e.g. grains + legumes) score higher together than either scores alone,
  // since one food's surplus of an amino acid can cover another's shortfall.
  let proteinQuality = null;
  if (totalProteinG >= 0.5) {
    let minRatio = Infinity;
    let limitingKey = null;
    Object.keys(REFERENCE_AA_PATTERN).forEach((k) => {
      const fractionPerGProtein = aminos[k] / totalProteinG;
      const ratio = fractionPerGProtein / REFERENCE_AA_PATTERN[k];
      if (ratio < minRatio) {
        minRatio = ratio;
        limitingKey = k;
      }
    });
    let proteinForDig = 0;
    let weightedDig = 0;
    plateFoods.forEach((f) => {
      const { grams } = portionInfo(f, mode, cg[f.id]);
      const proteinG = (f.protein100 * grams) / 100;
      proteinForDig += proteinG;
      weightedDig += proteinG * DIGESTIBILITY_BY_PROFILE[aminoProfileKey(f)];
    });
    const digestibility = proteinForDig > 0 ? weightedDig / proteinForDig : 0.85;
    proteinQuality = { score: Math.min(1, minRatio), limitingKey, rawRatio: minRatio, digestibility };
  }
  // Same combined totals, run through the functional-medicine protein
  // lens — see functionalProteinQualityFromProfile above. "Contains a
  // collagen-rich or muscle-meat food" is checked across the whole plate
  // rather than per-food, same spirit as the pastured-fat flag above.
  let functionalProteinQuality = null;
  if (proteinQuality) {
    const isProcessed = plateFoods.some((f) => PROCESSED_PROTEIN_IDS.includes(f.id));
    const isCollagenRich = plateFoods.some((f) => COLLAGEN_RICH_IDS.includes(f.id));
    const isMuscleMeat = plateFoods.some((f) => MUSCLE_MEAT_IDS.includes(f.id));
    functionalProteinQuality = functionalProteinQualityFromProfile({ aminoScore: proteinQuality.score, isProcessed, isCollagenRich, isMuscleMeat });
  }

  return {
    macros,
    micros,
    aminos,
    proteinQuality,
    functionalProteinQuality,
    fatAcids,
    fatQuality,
    functionalFatQuality,
    carbTypes,
    carbQuality,
    functionalCarbQuality,
    totalCarb,
    totalGL,
    ttp: Math.round(pseudo.ttp),
    curve,
    bluntFactor,
    totalCarbG,
    totalProteinG,
    totalFatG: totalFatGAll,
    totalCal,
    totalPortionGrams,
  };
}

// ---------------------------------------------------------------------------
// Daily meal plan: five named plate "slots" a person fills across the day,
// each built with the exact same "in plate" mechanism as the single plate
// above. Slot ids double as persistence keys, so don't rename them without
// a migration. Approximate default clock times only decide where each
// slot's glucose-response curve lands on the 24h chart below.
// ---------------------------------------------------------------------------
const MEAL_SLOTS = [
  { id: "breakfast", label: { en: "Breakfast", fa: "صبحانه" }, emoji: "🍳", startMin: 7 * 60 + 30 },
  { id: "lunch", label: { en: "Lunch", fa: "ناهار" }, emoji: "🥗", startMin: 13 * 60 },
  { id: "snack", label: { en: "Snack", fa: "میان‌وعده" }, emoji: "🍎", startMin: 15 * 60 + 30 },
  { id: "dinner", label: { en: "Dinner", fa: "شام" }, emoji: "🍽️", startMin: 19 * 60 },
];
const MEAL_SLOT_IDS = MEAL_SLOTS.map((s) => s.id);
const DAILY_TAB_ID = "daily";
const DAILY_TAB_EMOJI = "📊";
const TRENDS_TAB_ID = "trends";
const TRENDS_TAB_EMOJI = "📈";

function emptyPlateSlots() {
  const o = {};
  MEAL_SLOT_IDS.forEach((id) => (o[id] = []));
  return o;
}

function formatClock(min, lang) {
  const h = Math.floor(min / 60) % 24;
  const m = Math.round(min % 60);
  const ampm = lang === "fa" ? (h < 12 ? "ق.ظ" : "ب.ظ") : h < 12 ? "AM" : "PM";
  let h12 = h % 12;
  if (h12 === 0) h12 = 12;
  return `${h12}${m === 0 ? "" : ":" + String(m).padStart(2, "0")}${ampm}`;
}

// Sums each filled slot's own glucose-response curve (computed exactly like
// the single-plate curve) into one 24h timeline, offset by that slot's
// clock time. This is a superposition of independent curves, not a new
// physiological model — same caveats as the single-plate estimate apply,
// compounded across meals.
function computeDailyCurve(plateSlots, mode, customGrams) {
  const stepMin = 10;
  const totalMin = 24 * 60;
  const n = totalMin / stepMin + 1;
  const curve = new Array(n).fill(0);
  MEAL_SLOTS.forEach((slot) => {
    const ids = plateSlots[slot.id] || [];
    const foods = ids.map((id) => FOOD_BY_ID[id]).filter(Boolean);
    if (foods.length === 0) return;
    const p = computePlate(foods, mode, customGrams);
    p.curve.forEach((val, i) => {
      const tAbs = slot.startMin + i * 5;
      if (tAbs > totalMin) return;
      const idx = Math.round(tAbs / stepMin);
      if (idx >= 0 && idx < n) curve[idx] += val;
    });
  });
  const labels = [];
  for (let m = 0; m <= totalMin; m += stepMin) labels.push(m);
  return { labels, curve };
}

// One computed sentence surfacing the comparison's most decision-relevant
// fact, so the person doesn't have to eyeball every card's numbers
// themselves to find it. Only makes sense with 2+ foods selected.
function buildTakeaway(selected, mode, customGrams, lang) {
  const t = (en, fa) => (lang === "fa" ? fa : en);
  if (selected.length < 2) return null;
  const withGL = selected.map((f) => ({ f, gl: portionInfo(f, mode, customGrams[f.id]).gl }));
  const highestGL = withGL.reduce((a, b) => (b.gl > a.gl ? b : a));
  const slowest = selected.reduce((a, b) => (b.ttp > a.ttp ? b : a));
  const fastest = selected.reduce((a, b) => (b.ttp < a.ttp ? b : a));

  const highName = t(highestGL.f.name, highestGL.f.nameFa);
  const slowName = t(slowest.name, slowest.nameFa);

  if (highestGL.f.id === slowest.id) {
    return t(
      `${highName} has both the highest glycemic load and the slowest digestion here — expect a strong, prolonged rise.`,
      `${highName} هم بیشترین بار گلایسمی و هم کندترین هضم را در این مقایسه دارد — انتظار افزایش قوی و طولانی را داشته باشید.`
    );
  }
  if (highestGL.f.id === fastest.id) {
    return t(
      `${highName} has the highest glycemic load here and hits fastest too — a sharp, quick spike.`,
      `${highName} بیشترین بار گلایسمی را دارد و سریع‌ترین هم هست — یک افزایش تیز و سریع.`
    );
  }
  return t(
    `${highName} has the highest glycemic load in this comparison; ${slowName} is the slowest to digest.`,
    `${highName} بیشترین بار گلایسمی را در این مقایسه دارد؛ ${slowName} کندترین هضم را دارد.`
  );
}

const BADGE_META = {
  lowestGL: { icon: "🏆", label: { en: "Lowest glycemic load", fa: "کمترین بار گلایسمی" }, color: "#1d9e75" },
  slowest: { icon: "🐢", label: { en: "Gentlest / slowest digesting", fa: "ملایم‌ترین / کندترین هضم" }, color: "#7fa3d1" },
  bestProtein: { icon: "💪", label: { en: "Best protein quality", fa: "بهترین کیفیت پروتئین" }, color: "#e0a83c" },
};

// Surfaces the comparison's category "winners" directly on the cards
// themselves, not just in the one-line takeaway above the chart. Only
// applies with 2+ foods selected — a badge needs something to beat.
function computeBestBadges(selected, mode, customGrams) {
  const badges = {};
  if (selected.length < 2) return badges;

  function add(id, key) {
    if (!badges[id]) badges[id] = [];
    badges[id].push(key);
  }

  const withGL = selected.map((f) => ({ f, gl: portionInfo(f, mode, customGrams[f.id]).gl }));
  const lowestGL = withGL.reduce((a, b) => (b.gl < a.gl ? b : a));
  add(lowestGL.f.id, "lowestGL");

  const slowest = selected.reduce((a, b) => (b.ttp > a.ttp ? b : a));
  add(slowest.id, "slowest");

  const proteinCandidates = selected.filter((f) => f.protein100 >= 5);
  if (proteinCandidates.length >= 2) {
    const bestProtein = proteinCandidates.reduce((a, b) => (foodProteinQuality(b).score > foodProteinQuality(a).score ? b : a));
    add(bestProtein.id, "bestProtein");
  }

  return badges;
}


function buildShareText(selected, plateIds, mode, lang, customGrams) {
  const cg = customGrams || {};
  const t = (en, fa) => (lang === "fa" ? fa : en);
  const modeLabel = t(PORTION_MODES[mode].label, PORTION_MODES[mode].labelFa);
  const lines = [t("Glycemic comparison", "مقایسه گلایسمی"), `(${modeLabel})`, ""];
  selected.forEach((f) => {
    const { gl, carbsAtPortion, grams } = portionInfo(f, mode, cg[f.id]);
    const customTag = cg[f.id] != null ? ` [${round(grams)}g]` : "";
    lines.push(
      `${t(f.name, f.nameFa)}${customTag}: GI ${f.gi}, GL ${round(gl, 1)}, ${t("carbs", "کربوهیدرات")} ${round(carbsAtPortion)}g, ${t("peak", "اوج")} ${f.ttp}min`
    );
  });
  const plateFoods = selected.filter((f) => plateIds.includes(f.id));
  if (plateFoods.length > 1) {
    const plate = computePlate(plateFoods, mode, cg);
    lines.push("", `${t("Plate total", "جمع بشقاب")}: GL ${round(plate.totalGL, 1)}, ${t("carbs", "کربوهیدرات")} ${round(plate.totalCarb)}g, ${t("est. peak", "اوج تخمینی")} ${plate.ttp}min`);
  }
  if (typeof window !== "undefined" && /^https?:/.test(window.location.protocol)) {
    const url = new URL(window.location.href);
    url.searchParams.set("foods", selected.map((f) => f.id).join(","));
    url.searchParams.set("plate", plateIds.join(","));
    url.searchParams.set("mode", mode);
    url.searchParams.set("lang", lang);
    lines.push("", url.toString());
  }
  return lines.join("\n");
}

// Daily-total share text: one line per filled meal slot, then the summed
// macro/micro/calorie totals across the whole day.
function buildDailyShareText(plateSlots, mode, lang, customGrams) {
  const cg = customGrams || {};
  const t = (en, fa) => (lang === "fa" ? fa : en);
  const lines = [t("Daily meal plan", "برنامه غذایی روزانه"), ""];
  const allFoods = [];
  MEAL_SLOTS.forEach((slot) => {
    const ids = plateSlots[slot.id] || [];
    const foods = ids.map((id) => FOOD_BY_ID[id]).filter(Boolean);
    if (foods.length === 0) return;
    const p = computePlate(foods, mode, cg);
    allFoods.push(...foods);
    lines.push(`${t(slot.label.en, slot.label.fa)}: ${foods.map((f) => t(f.name, f.nameFa)).join(" + ")} — ${round(p.totalCal)} kcal`);
  });
  if (allFoods.length === 0) {
    lines.push(t("No meals logged yet.", "هنوز وعده‌ای ثبت نشده."));
    return lines.join("\n");
  }
  const daily = computePlate(allFoods, mode, cg);
  lines.push(
    "",
    `${t("Daily total", "جمع روزانه")}: ${round(daily.totalCal)} kcal, ${t("carbs", "کربوهیدرات")} ${round(daily.totalCarbG)}g, ${t("protein", "پروتئین")} ${round(daily.totalProteinG)}g, ${t("fat", "چربی")} ${round(daily.totalFatG)}g`
  );
  return lines.join("\n");
}

function copyText(text) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    return navigator.clipboard.writeText(text).catch(() => fallbackCopy(text));
  }
  return fallbackCopy(text);
}

function fallbackCopy(text) {
  return new Promise((resolve) => {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    try {
      document.execCommand("copy");
    } catch (e) {
      // ignore
    }
    document.body.removeChild(ta);
    resolve();
  });
}

function readInitialState() {
  if (typeof window === "undefined") return null;
  try {
    const params = new URLSearchParams(window.location.search);
    const foodsParam = params.get("foods");
    const modeParam = params.get("mode");
    const langParam = params.get("lang");
    const plateParam = params.get("plate");
    if (!foodsParam) return null;
    const ids = foodsParam.split(",").filter((id) => FOOD_BY_ID[id]).slice(0, MAX_TRACKED_IDS);
    if (ids.length === 0) return null;
    const plateIds = plateParam ? plateParam.split(",").filter((id) => ids.includes(id)) : ids;
    const plateSlots = emptyPlateSlots();
    plateSlots.breakfast = plateIds;
    return {
      ids,
      plateSlots,
      activeSlot: "breakfast",
      mode: modeParam && PORTION_MODES[modeParam] ? modeParam : "fda",
      lang: langParam === "fa" ? "fa" : "en",
      customGrams: {},
      sourcingOverrides: {},
      scoreLens: "conventional",
      goalLens: "balanced",
      showTakeawayTip: true,
      showCommandFeedback: true,
    };
  } catch (e) {
    return null;
  }
}

// Remembers the last comparison across page reloads (a URL, when present,
// still wins — that's an intentional share link and should override
// whatever was left over from a previous session). Two storage layers:
// localStorage for an instant synchronous read on first paint (works even
// if this file is opened as a plain standalone HTML page), and the
// artifact-native window.storage API for real persistence across devices/
// sessions when running inside Claude — the artifact sandbox's
// localStorage isn't reliably durable the way window.storage is, so once
// that resolves (async, a beat after first paint) it's treated as the more
// authoritative copy and can override what localStorage had.
const STORAGE_KEY = "glycemic-compare-state-v1";

// Shared validation/migration logic for a persisted state blob, however it
// was fetched (localStorage's synchronous string, or window.storage's
// resolved value) — keeps the two storage layers from drifting out of
// sync with each other's parsing rules.
function parsePersistedBlob(raw) {
  if (!raw) return null;
  try {
    const parsed = JSON.parse(raw);
    if (!parsed || !Array.isArray(parsed.selectedIds)) return null;
    const ids = parsed.selectedIds.filter((id) => FOOD_BY_ID[id]).slice(0, MAX_TRACKED_IDS);
    if (ids.length === 0) return null;
    let plateSlots;
    if (parsed.plateSlots && typeof parsed.plateSlots === "object") {
      plateSlots = emptyPlateSlots();
      MEAL_SLOT_IDS.forEach((slotId) => {
        const arr = parsed.plateSlots[slotId];
        plateSlots[slotId] = Array.isArray(arr) ? arr.filter((id) => ids.includes(id)) : [];
      });
      // migrate from an even older save that had two separate snack slots
      if (Array.isArray(parsed.plateSlots.snack1) || Array.isArray(parsed.plateSlots.snack2)) {
        plateSlots.snack = [...(parsed.plateSlots.snack1 || []), ...(parsed.plateSlots.snack2 || [])].filter((id) => ids.includes(id));
      }
    } else {
      // migrate from the older single-plate format: whatever was "in
      // plate" before becomes the breakfast slot, other slots start empty
      plateSlots = emptyPlateSlots();
      const legacyPlateIds = Array.isArray(parsed.plateIds) ? parsed.plateIds.filter((id) => ids.includes(id)) : ids;
      plateSlots.breakfast = legacyPlateIds;
    }
    const activeSlot =
      MEAL_SLOT_IDS.includes(parsed.activeSlot) || parsed.activeSlot === DAILY_TAB_ID || parsed.activeSlot === TRENDS_TAB_ID ? parsed.activeSlot : "breakfast";
    return {
      ids,
      plateSlots,
      activeSlot,
      mode: parsed.mode && PORTION_MODES[parsed.mode] ? parsed.mode : "fda",
      lang: parsed.lang === "fa" ? "fa" : "en",
      customGrams: parsed.customGrams && typeof parsed.customGrams === "object" ? parsed.customGrams : {},
      sourcingOverrides: parsed.sourcingOverrides && typeof parsed.sourcingOverrides === "object" ? parsed.sourcingOverrides : {},
      scoreLens: parsed.scoreLens === "functional" ? "functional" : "conventional",
      goalLens: GOAL_LENSES.some((g) => g.id === parsed.goalLens) ? parsed.goalLens : "balanced",
      showTakeawayTip: parsed.showTakeawayTip !== false,
      showCommandFeedback: parsed.showCommandFeedback !== false,
    };
  } catch (e) {
    return null;
  }
}

function readPersistedState() {
  if (typeof window === "undefined" || !window.localStorage) return null;
  try {
    return parsePersistedBlob(window.localStorage.getItem(STORAGE_KEY));
  } catch (e) {
    return null;
  }
}

// The artifact-native persistent store — genuinely durable across sessions
// and devices, unlike this sandbox's localStorage. Resolves a beat after
// first paint, so it's read asynchronously and applied as an upgrade over
// whatever the synchronous localStorage read already put on screen.
async function readPersistedStateAsync() {
  if (typeof window === "undefined" || !window.storage || typeof window.storage.get !== "function") return null;
  try {
    const result = await window.storage.get(STORAGE_KEY, false);
    return result ? parsePersistedBlob(result.value) : null;
  } catch (e) {
    // key doesn't exist yet, or storage isn't available in this context
    // (e.g. this file opened as a plain standalone page) — not an error
    return null;
  }
}

function writePersistedState(state) {
  const json = JSON.stringify(state);
  if (typeof window !== "undefined" && window.localStorage) {
    try {
      window.localStorage.setItem(STORAGE_KEY, json);
    } catch (e) {
      // storage full / private-browsing lockout — silently skip this layer
    }
  }
  if (typeof window !== "undefined" && window.storage && typeof window.storage.set === "function") {
    try {
      window.storage.set(STORAGE_KEY, json, false).catch(() => {});
    } catch (e) {
      // not running inside the artifact sandbox — silently skip this layer
    }
  }
}

function clearPersistedState() {
  if (typeof window === "undefined") return;
  try {
    if (window.localStorage) window.localStorage.removeItem(STORAGE_KEY);
  } catch (e) {
    // ignore
  }
  try {
    if (window.storage && typeof window.storage.delete === "function") {
      window.storage.delete(STORAGE_KEY, false).catch(() => {});
    }
  } catch (e) {
    // ignore
  }
}

// ---------------------------------------------------------------------------
// Day-over-day history: a separate, append-only log (own storage key) from
// the plate-state blob above, since it accumulates over time rather than
// being overwritten each save. One entry per calendar day — the day's
// score, fiber score, and micronutrient-coverage score at whatever point
// the person last had food logged that day, snapshotted regardless of
// which tab is open (see the tab-independent aggregate in the component
// below) so a day's trend gets recorded even if the person never opens
// the Daily tab itself. Same two-layer persistence as the state blob:
// localStorage for an instant local read, window.storage for the durable
// cross-device copy once it resolves.
// ---------------------------------------------------------------------------
const HISTORY_STORAGE_KEY = "glycemic-compare-history-v1";
const HISTORY_MAX_DAYS = 60; // roughly two months — plenty for a trend line, bounded so the blob never grows unbounded

function todayDateString() {
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, "0");
  const day = String(d.getDate()).padStart(2, "0");
  return `${y}-${m}-${day}`;
}

function parseHistoryBlob(raw) {
  if (!raw) return [];
  try {
    const parsed = JSON.parse(raw);
    if (!Array.isArray(parsed)) return [];
    return parsed
      .filter((e) => e && typeof e.date === "string" && Number.isFinite(e.dailyScore))
      .sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : 0))
      .slice(-HISTORY_MAX_DAYS);
  } catch (e) {
    return [];
  }
}

function readHistory() {
  if (typeof window === "undefined" || !window.localStorage) return [];
  try {
    return parseHistoryBlob(window.localStorage.getItem(HISTORY_STORAGE_KEY));
  } catch (e) {
    return [];
  }
}

async function readHistoryAsync() {
  if (typeof window === "undefined" || !window.storage || typeof window.storage.get !== "function") return null;
  try {
    const result = await window.storage.get(HISTORY_STORAGE_KEY, false);
    return result ? parseHistoryBlob(result.value) : null;
  } catch (e) {
    return null;
  }
}

function writeHistory(history) {
  const json = JSON.stringify(history);
  if (typeof window !== "undefined" && window.localStorage) {
    try {
      window.localStorage.setItem(HISTORY_STORAGE_KEY, json);
    } catch (e) {
      // storage full / private-browsing lockout — silently skip this layer
    }
  }
  if (typeof window !== "undefined" && window.storage && typeof window.storage.set === "function") {
    try {
      window.storage.set(HISTORY_STORAGE_KEY, json, false).catch(() => {});
    } catch (e) {
      // not running inside the artifact sandbox — silently skip this layer
    }
  }
}

function clearHistory() {
  if (typeof window === "undefined") return;
  try {
    if (window.localStorage) window.localStorage.removeItem(HISTORY_STORAGE_KEY);
  } catch (e) {
    // ignore
  }
  try {
    if (window.storage && typeof window.storage.delete === "function") {
      window.storage.delete(HISTORY_STORAGE_KEY, false).catch(() => {});
    }
  } catch (e) {
    // ignore
  }
}

// Pure helper: returns a new array with `entry` replacing whatever was
// already logged for that date (never duplicated), re-sorted and capped.
// Kept pure/standalone so it's independently testable from the storage
// side-effects above.
function upsertHistoryEntry(history, entry) {
  const withoutToday = history.filter((e) => e.date !== entry.date);
  return [...withoutToday, entry].sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : 0)).slice(-HISTORY_MAX_DAYS);
}

// A short, plain-language read on the logged history — average glycemic
// score over the period plus a simple recent-vs-earlier comparison. Needs
// at least 4 days logged before attempting a direction at all; fewer than
// that and a "trend" is mostly noise, so it just reports the average.
function computeTrendSummary(history, lang) {
  const t = (en, fa) => (lang === "fa" ? fa : en);
  if (!history || history.length === 0) return null;
  const avg = (arr) => arr.reduce((s, e) => s + e.dailyScore, 0) / arr.length;
  const overallAvg = Math.round(avg(history) * 10) / 10;

  if (history.length < 4) {
    return {
      direction: "insufficient",
      text: t(
        `Average glycemic score so far: ${overallAvg}/10 across ${history.length} day${history.length === 1 ? "" : "s"}. A few more days will make a trend direction meaningful.`,
        `میانگین امتیاز گلایسمی تاکنون: ${overallAvg} از ۱۰ در طول ${history.length} روز. برای معنادار شدن جهت روند، به چند روز دیگر نیاز است.`
      ),
    };
  }

  const half = Math.floor(history.length / 2);
  const earlierAvg = avg(history.slice(0, half));
  const recentAvg = avg(history.slice(-half));
  const diff = recentAvg - earlierAvg;

  let direction, text;
  if (diff >= 0.5) {
    direction = "up";
    text = t(
      `Trending up: recent days average ${Math.round(recentAvg * 10) / 10}/10 vs. ${Math.round(earlierAvg * 10) / 10}/10 earlier in this log.`,
      `روند صعودی: میانگین روزهای اخیر ${Math.round(recentAvg * 10) / 10} از ۱۰ در برابر ${Math.round(earlierAvg * 10) / 10} از ۱۰ در ابتدای این سابقه.`
    );
  } else if (diff <= -0.5) {
    direction = "down";
    text = t(
      `Trending down: recent days average ${Math.round(recentAvg * 10) / 10}/10 vs. ${Math.round(earlierAvg * 10) / 10}/10 earlier in this log.`,
      `روند نزولی: میانگین روزهای اخیر ${Math.round(recentAvg * 10) / 10} از ۱۰ در برابر ${Math.round(earlierAvg * 10) / 10} از ۱۰ در ابتدای این سابقه.`
    );
  } else {
    direction = "flat";
    text = t(
      `Fairly steady around ${overallAvg}/10 across the logged period.`,
      `نسبتاً پایدار در حدود ${overallAvg} از ۱۰ در طول دوره ثبت‌شده.`
    );
  }
  return { direction, text };
}

// How many consecutive calendar days lead up to the most recent logged
// entry (not necessarily today — if the person hasn't opened the app yet
// today, the streak shouldn't drop to zero just because of that).
function computeLoggingStreak(history) {
  if (!history || history.length === 0) return 0;
  const sorted = history.slice().sort((a, b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : 0)); // newest first
  let streak = 1;
  for (let i = 0; i < sorted.length - 1; i++) {
    const cur = new Date(sorted[i].date + "T00:00:00");
    const prev = new Date(sorted[i + 1].date + "T00:00:00");
    const diffDays = Math.round((cur - prev) / 86400000);
    if (diffDays === 1) streak++;
    else break;
  }
  return streak;
}

// Average glycemic score over the most recent `n` logged days (fewer if
// the log itself is shorter than `n`).
function computeRecentAverage(history, n) {
  if (!history || history.length === 0) return null;
  const sorted = history.slice().sort((a, b) => (a.date < b.date ? -1 : 1));
  const slice = sorted.slice(-n);
  return Math.round((slice.reduce((s, e) => s + e.dailyScore, 0) / slice.length) * 10) / 10;
}

// ---------------------------------------------------------------------------
// Weekly nutrient-gap report: history stores per-nutrient %DV per day (see
// todayHistorySnapshot in the component below), so rather than just a
// rolled-up "micronutrient coverage" score, this can name which specific
// nutrient has been persistently short — a gap that recurs across most of
// the last week, not a single low day, and not the same as a food's own
// %DV number below on any one food card. Sodium is never a "gap" here (a
// limit nutrient, lower is fine) — same exclusion used elsewhere for
// nutrient scoring (computeAutoCompleteSuggestions, computeGoalFitScore).
// ---------------------------------------------------------------------------
const NUTRIENT_GAP_LOOKBACK_DAYS = 7;
const NUTRIENT_GAP_DV_THRESHOLD = 50; // %DV — a day counts as "short" on a nutrient below this
const NUTRIENT_GAP_MIN_DAYS_BELOW = 4; // out of up to NUTRIENT_GAP_LOOKBACK_DAYS considered, to call it "persistent" rather than one bad day

function computeNutrientGaps(history) {
  // Older entries logged before this feature existed won't have `micros`
  // at all — filtered out rather than treated as a 0%, so a long-time
  // user's early history doesn't manufacture false gaps.
  const sorted = history.filter((e) => e.micros).sort((a, b) => (a.date < b.date ? 1 : -1));
  const recent = sorted.slice(0, NUTRIENT_GAP_LOOKBACK_DAYS);
  if (recent.length < NUTRIENT_GAP_MIN_DAYS_BELOW) {
    return { gaps: [], daysConsidered: recent.length, ready: false };
  }

  const keys = MICRO_KEYS_ORDERED.filter((k) => k !== "sodium");
  const gaps = keys
    .map((key) => {
      const values = recent.map((e) => e.micros[key]).filter((v) => v != null);
      const daysBelow = values.filter((v) => v < NUTRIENT_GAP_DV_THRESHOLD).length;
      const avgPct = values.length ? Math.round(values.reduce((s, v) => s + v, 0) / values.length) : null;
      return { key, daysBelow, daysConsidered: values.length, avgPct };
    })
    .filter((g) => g.daysBelow >= NUTRIENT_GAP_MIN_DAYS_BELOW)
    .sort((a, b) => b.daysBelow - a.daysBelow || a.avgPct - b.avgPct);

  return { gaps: gaps.slice(0, 3), daysConsidered: recent.length, ready: true };
}

// Which real foods would help close a specific nutrient gap — highest
// %DV per that food's own default portion, reusing the same per-food
// microDvPct math used throughout the rest of the app (food cards,
// auto-complete). Portion mode matters (FDA-label vs. common-serving
// defaults give different gram amounts), so it's passed through rather
// than assumed.
function suggestFoodsForNutrient(key, limit, mode) {
  return FOODS.map((f) => {
    const { grams } = portionInfo(f, mode, undefined);
    return { food: f, pct: microDvPct(key, microAtPortion(f, key, grams)) };
  })
    .sort((a, b) => b.pct - a.pct)
    .slice(0, limit);
}

// A bigger pie with the gram amount written directly in each slice
// (no separate legend list beside it).
function NutrientPie({ values, size, lang, keysOrdered, colors, labels, minSlicePct, kcalPerGram, doughnut, centerUnitLabel, sliceInfo }) {
  const canvasRef = useRef(null);
  const chartRef = useRef(null);
  const [, setTick] = useState(0);
  const readyRef = useRef(false);
  const isDoughnut = doughnut || !!kcalPerGram;
  const t = (en, fa) => (lang === "fa" ? fa : en);
  // Only meaningful for doughnut-style pies — the hovered/tapped slice's
  // info is written into the donut hole itself instead of a floating
  // Chart.js tooltip, which is both easier to land on with a finger and
  // can't end up hidden behind anything.
  const [hoverInfo, setHoverInfo] = useState(null);
  // While the "i" popup for the current slice is open, ignore the chart's
  // mouse-leave clear — the popup can render outside the pie's small
  // bounding box, so moving the cursor onto the popup text itself would
  // otherwise trip "mouse left the chart" and slam the panel shut.
  const infoOpenRef = useRef(false);

  useEffect(() => {
    function bothReady() {
      return window.Chart && window.ChartDataLabels;
    }
    if (bothReady()) {
      readyRef.current = true;
      setTick((x) => x + 1);
      return;
    }
    const check = setInterval(() => {
      if (bothReady()) {
        readyRef.current = true;
        clearInterval(check);
        setTick((x) => x + 1);
      }
    }, 150);
    return () => clearInterval(check);
  }, []);

  const data = keysOrdered.map((k) => round(values[k], 1));
  const nonZero = data.some((v) => v > 0);
  const total = data.reduce((a, b) => a + b, 0) || 1;
  const rawTotal = data.reduce((a, b) => a + b, 0);
  const totalKcal = kcalPerGram ? keysOrdered.reduce((sum, k) => sum + (values[k] || 0) * (kcalPerGram[k] || 0), 0) : null;

  useEffect(() => {
    if (!readyRef.current || !canvasRef.current) return;
    const t = (en, fa) => (lang === "fa" ? fa : en);
    const threshold = minSlicePct != null ? minSlicePct : 0.045;

    if (chartRef.current) chartRef.current.destroy();
    // NOTE: the datalabels plugin self-registers globally once its script
    // loads after Chart.js — do NOT also pass a per-chart `plugins: [...]`
    // array here, or labels get drawn twice (slightly offset), which looks
    // like grams showing up in the wrong spot on the slice.
    chartRef.current = new window.Chart(canvasRef.current, {
      type: isDoughnut ? "doughnut" : "pie",
      data: {
        labels: keysOrdered.map((k) => t(labels[k].en, labels[k].fa)),
        datasets: [
          {
            data: nonZero ? data : [1],
            backgroundColor: nonZero ? keysOrdered.map((k) => colors[k]) : ["#2a2c2d"],
            borderColor: "#0d0f10",
            borderWidth: 2,
          },
        ],
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        animation: false,
        cutout: isDoughnut ? "62%" : 0,
        // For doughnut pies with a center display, the hovered slice's
        // numbers are written into the hole itself (see hoverInfo below)
        // instead of a floating tooltip, so there's nothing left to fight
        // for space around the calorie/total figure. We deliberately do
        // NOT clear hoverInfo when elements.length is 0 here — that fires
        // constantly as the cursor crosses the cutout hole on its way to
        // the "i" info button, and clearing on every such frame made the
        // info vanish before a click could land. Instead it's only cleared
        // by onMouseLeave on the chart's wrapper below, once the pointer
        // actually leaves the whole chart.
        onHover: isDoughnut
          ? (event, elements) => {
              if (elements.length === 0) return;
              const idx = elements[0].index;
              const key = keysOrdered[idx];
              const val = data[idx];
              const pct = Math.round((val / total) * 100);
              const kcal = kcalPerGram ? Math.round(val * (kcalPerGram[key] || 0)) : null;
              setHoverInfo({ key, label: t(labels[key].en, labels[key].fa), value: val, pct, kcal, color: colors[key] });
            }
          : undefined,
        plugins: {
          legend: { display: false },
          tooltip: {
            // Doughnut pies show hover info in the center instead — see
            // onHover above — so the floating tooltip is only needed for
            // full-pie charts that have no hole.
            enabled: nonZero && !isDoughnut,
            titleColor: "#e8e6df",
            bodyColor: "#e8e6df",
            backgroundColor: "#16181a",
            borderColor: "#3a3d3e",
            borderWidth: 1,
            callbacks: {
              label: (ctx) => {
                const grams = ctx.parsed;
                const pct = Math.round((grams / total) * 100);
                return `${ctx.label}: ${grams}g (${pct}%)`;
              },
            },
          },
          datalabels: {
            anchor: "center",
            align: "center",
            clamp: true,
            color: "#f5f4f0",
            backgroundColor: "rgba(13,15,16,0.6)",
            borderRadius: 4,
            padding: { top: 2, bottom: 2, left: 4, right: 4 },
            font: { size: 10, weight: "600" },
            formatter: (value) => {
              if (!nonZero || value <= 0) return "";
              const pct = value / total;
              if (pct < threshold) return "";
              return `${round(value, value < 10 ? 1 : 0)}g`;
            },
          },
        },
      },
    });
    return () => chartRef.current && chartRef.current.destroy();
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [values, lang, readyRef.current]);

  return (
    <div
      style={{ position: "relative", width: size, height: size, margin: "0 auto" }}
      onMouseLeave={() => {
        if (!infoOpenRef.current) setHoverInfo(null);
      }}
    >
      <canvas ref={canvasRef} />
      {isDoughnut && (
        <div
          style={{
            position: "absolute",
            inset: 0,
            display: "flex",
            flexDirection: "column",
            alignItems: "center",
            justifyContent: "center",
            padding: "0 12%",
            textAlign: "center",
            pointerEvents: "none",
          }}
        >
          {hoverInfo ? (
            <>
              <span style={{ width: 8, height: 8, borderRadius: "50%", background: hoverInfo.color, marginBottom: 4 }} />
              <div style={{ fontSize: size >= 150 ? 13.5 : 11.5, fontWeight: 600, color: "#e8e6df", lineHeight: 1.25, display: "flex", alignItems: "center", gap: 3 }}>
                {hoverInfo.label}
                {sliceInfo && sliceInfo[hoverInfo.key] && (
                  <span style={{ pointerEvents: "auto" }}>
                    <InfoIcon
                      text={t(sliceInfo[hoverInfo.key].en, sliceInfo[hoverInfo.key].fa)}
                      onOpenChange={(o) => {
                        infoOpenRef.current = o;
                      }}
                    />
                  </span>
                )}
              </div>
              <div style={{ fontSize: size >= 150 ? 13.5 : 11.5, color: "#c7c5bc", lineHeight: 1.3 }}>
                {round(hoverInfo.value, hoverInfo.value < 10 ? 1 : 0)}g · {hoverInfo.pct}%
              </div>
              {hoverInfo.kcal != null && <div style={{ fontSize: size >= 150 ? 12 : 10.5, color: "#8a8f8f", lineHeight: 1.3 }}>{hoverInfo.kcal} kcal</div>}
            </>
          ) : kcalPerGram ? (
            <>
              <div style={{ fontSize: size >= 150 ? 20 : 15, fontWeight: 700, color: "#e8e6df", lineHeight: 1.1 }}>{round(totalKcal)}</div>
              <div style={{ fontSize: size >= 150 ? 10 : 8, color: "#8a8f8f", textTransform: "uppercase", letterSpacing: "0.04em" }}>kcal</div>
            </>
          ) : (
            <>
              <div style={{ fontSize: size >= 150 ? 20 : 15, fontWeight: 700, color: "#e8e6df", lineHeight: 1.1 }}>{round(rawTotal, rawTotal < 10 ? 1 : 0)}g</div>
              {centerUnitLabel && (
                <div style={{ fontSize: size >= 150 ? 10 : 8, color: "#8a8f8f", textTransform: "uppercase", letterSpacing: "0.04em" }}>{centerUnitLabel}</div>
              )}
            </>
          )}
        </div>
      )}
    </div>
  );
}

function MacroPie({ macros, size, lang }) {
  return (
    <NutrientPie
      values={macros}
      size={size}
      lang={lang}
      keysOrdered={MACRO_KEYS_ORDERED}
      colors={MACRO_COLORS}
      labels={MACRO_LABELS}
      kcalPerGram={MACRO_KCAL_PER_G}
      sliceInfo={MACRO_SLICE_INFO}
    />
  );
}

// Compact single-food glucose-response curve, sized to sit beside a food
// card's macro pie without adding much visual weight — no axes, no legend,
// just the shape of the response.
function MiniCurveChart({ food, gl, width, height, lang }) {
  const canvasRef = useRef(null);
  const chartRef = useRef(null);
  const [, setTick] = useState(0);
  const readyRef = useRef(false);
  const t = (en, fa) => (lang === "fa" ? fa : en);

  useEffect(() => {
    if (window.Chart) {
      readyRef.current = true;
      setTick((x) => x + 1);
      return;
    }
    const check = setInterval(() => {
      if (window.Chart) {
        readyRef.current = true;
        clearInterval(check);
        setTick((x) => x + 1);
      }
    }, 150);
    return () => clearInterval(check);
  }, []);

  useEffect(() => {
    if (!readyRef.current || !canvasRef.current) return;
    const labels = [];
    for (let tt = 0; tt <= 200; tt += 5) labels.push(tt);
    if (chartRef.current) chartRef.current.destroy();
    chartRef.current = new window.Chart(canvasRef.current, {
      type: "line",
      data: {
        labels,
        datasets: [
          {
            data: curvePoints(food, gl),
            borderColor: giToColor(food.gi),
            backgroundColor: giToColor(food.gi, 0.16),
            fill: true,
            borderWidth: 2,
            pointRadius: 0,
            tension: 0.3,
          },
        ],
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        animation: false,
        layout: { padding: { top: 2, right: 4 } },
        plugins: {
          legend: { display: false },
          tooltip: { enabled: false },
          datalabels: { display: false },
        },
        scales: {
          x: {
            display: true,
            ticks: {
              color: "#a9ada9",
              font: { size: 11 },
              maxTicksLimit: 5,
              autoSkip: true,
              padding: 2,
            },
            grid: { display: false },
            border: { color: "#3a3d3e" },
            title: { display: true, text: t("min", "دقیقه"), color: "#8a8f8f", font: { size: 10 } },
          },
          y: {
            display: true,
            beginAtZero: true,
            ticks: {
              color: "#a9ada9",
              font: { size: 11 },
              maxTicksLimit: 3,
              padding: 2,
            },
            grid: { color: "#222425", lineWidth: 0.5 },
            border: { color: "#3a3d3e" },
          },
        },
      },
    });
    return () => chartRef.current && chartRef.current.destroy();
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [food, gl, lang, readyRef.current]);

  return (
    <div style={{ width, height }}>
      <canvas ref={canvasRef} />
    </div>
  );
}

// Multi-series line chart for the Trends section below — daily glycemic,
// fiber, and micronutrient-coverage scores across the logged history.
// Unlike MiniCurveChart this keeps the legend and tooltip on, since
// telling the three lines apart and reading exact past values is the
// point here (there's no single obvious color mapping the way GI gives
// the food curve one).
function TrendsChart({ history, visible, width, height, lang }) {
  const canvasRef = useRef(null);
  const chartRef = useRef(null);
  const [, setTick] = useState(0);
  const readyRef = useRef(false);
  const t = (en, fa) => (lang === "fa" ? fa : en);
  const show = visible || { daily: true, fiber: true, micro: true };

  useEffect(() => {
    if (window.Chart) {
      readyRef.current = true;
      setTick((x) => x + 1);
      return;
    }
    const check = setInterval(() => {
      if (window.Chart) {
        readyRef.current = true;
        clearInterval(check);
        setTick((x) => x + 1);
      }
    }, 150);
    return () => clearInterval(check);
  }, []);

  useEffect(() => {
    if (!readyRef.current || !canvasRef.current) return;
    const labels = history.map((e) => e.date.slice(5)); // MM-DD, year rarely adds anything at this timescale
    if (chartRef.current) chartRef.current.destroy();
    chartRef.current = new window.Chart(canvasRef.current, {
      type: "line",
      data: {
        labels,
        datasets: [
          show.daily && {
            label: t("Glycemic score", "امتیاز گلایسمی"),
            data: history.map((e) => e.dailyScore),
            borderColor: "#1d9e75",
            backgroundColor: "#1d9e7529",
            borderWidth: 2,
            pointRadius: 2,
            tension: 0.25,
          },
          show.fiber && {
            label: t("Fiber score", "امتیاز فیبر"),
            data: history.map((e) => e.fiberScore),
            borderColor: "#7fa3d1",
            backgroundColor: "#7fa3d129",
            borderWidth: 2,
            pointRadius: 2,
            tension: 0.25,
          },
          show.micro && {
            label: t("Micronutrients", "ریزمغذی‌ها"),
            data: history.map((e) => e.microScore),
            borderColor: "#e0a83c",
            backgroundColor: "#e0a83c29",
            borderWidth: 2,
            pointRadius: 2,
            tension: 0.25,
          },
        ].filter(Boolean),
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        animation: false,
        layout: { padding: { top: 2, right: 4 } },
        plugins: {
          legend: {
            display: true,
            position: "bottom",
            labels: { color: "#c7c5bc", font: { size: 10.5 }, boxWidth: 10, padding: 10 },
          },
          tooltip: {
            enabled: true,
            callbacks: { label: (ctx) => `${ctx.dataset.label}: ${ctx.formattedValue}/10` },
          },
          datalabels: { display: false },
        },
        scales: {
          x: {
            display: true,
            ticks: { color: "#a9ada9", font: { size: 10.5 }, maxTicksLimit: 7, autoSkip: true, padding: 2 },
            grid: { display: false },
            border: { color: "#3a3d3e" },
          },
          y: {
            display: true,
            min: 0,
            max: 10,
            ticks: { color: "#a9ada9", font: { size: 10.5 }, stepSize: 2, padding: 2 },
            grid: { color: "#222425", lineWidth: 0.5 },
            border: { color: "#3a3d3e" },
          },
        },
      },
    });
    return () => chartRef.current && chartRef.current.destroy();
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [history, show.daily, show.fiber, show.micro, lang, readyRef.current]);

  return (
    <div style={{ width, height }}>
      <canvas ref={canvasRef} />
    </div>
  );
}

function TrendStatCard({ label, value, suffix, color }) {
  return (
    <div style={{ flex: 1, background: "#16181a", border: "0.5px solid #2a2c2d", borderRadius: 12, padding: "12px 10px", textAlign: "center", minWidth: 0 }}>
      <div style={{ fontSize: 20, fontWeight: 700, color: color || "#e8e6df", lineHeight: 1.1 }}>
        {value}
        {suffix && <span style={{ fontSize: 11, color: "#8a8f8f", fontWeight: 400 }}>{suffix}</span>}
      </div>
      <div style={{ fontSize: 10.5, color: "#8a8f8f", marginTop: 4, lineHeight: 1.3 }}>{label}</div>
    </div>
  );
}

// The full standalone Trends tab — day-over-day glycemic/fiber/micro
// scores, stat cards, a toggleable multi-metric chart, and a recent-days
// list. Deliberately its own tab rather than a small collapsible tucked
// inside Daily, since a log spanning many days deserves its own screen
// rather than competing for space with today's plate.
function NutrientGapReport({ history, lang, t, mode }) {
  const { gaps, daysConsidered, ready } = computeNutrientGaps(history);
  return (
    <div style={{ background: "#16181a", border: "0.5px solid #2a2c2d", borderRadius: 12, padding: 14 }}>
      <div style={{ fontSize: 12.5, fontWeight: 600, marginBottom: 8, display: "flex", alignItems: "center" }}>
        ⚠️ {t("Nutrient gaps this week", "کمبود ریزمغذی این هفته")}
        <InfoIcon
          text={t(
            `Looks at up to the last ${NUTRIENT_GAP_LOOKBACK_DAYS} days that have per-nutrient data logged, and flags a nutrient only if it stayed under ${NUTRIENT_GAP_DV_THRESHOLD}% of the FDA Daily Value on at least ${NUTRIENT_GAP_MIN_DAYS_BELOW} of those days — a recurring pattern, not one low day. Sodium is never flagged here since less of it is the goal, not more. Days logged before this feature existed don't have per-nutrient data and aren't counted.`,
            `تا ${NUTRIENT_GAP_LOOKBACK_DAYS} روز اخیر که داده ریزمغذی ثبت‌شده دارند را بررسی می‌کند، و تنها زمانی یک ریزمغذی را نشان می‌دهد که در حداقل ${NUTRIENT_GAP_MIN_DAYS_BELOW} روز از آن‌ها کمتر از ${NUTRIENT_GAP_DV_THRESHOLD}٪ ارزش روزانه FDA بوده — یک الگوی تکرارشونده، نه یک روز کم. سدیم هرگز اینجا نشان داده نمی‌شود چون هدف کمتر بودن آن است نه بیشتر. روزهای ثبت‌شده پیش از این ویژگی داده ریزمغذی ندارند و شمرده نمی‌شوند.`
          )}
        />
      </div>
      {!ready ? (
        <div style={{ fontSize: 12, color: "#8a8f8f", lineHeight: 1.5 }}>
          {t(
            `Needs at least ${NUTRIENT_GAP_MIN_DAYS_BELOW} days of nutrient data to look for a pattern (have ${daysConsidered} so far).`,
            `برای یافتن الگو، حداقل به ${NUTRIENT_GAP_MIN_DAYS_BELOW} روز داده ریزمغذی نیاز است (تاکنون ${daysConsidered} روز).`
          )}
        </div>
      ) : gaps.length === 0 ? (
        <div style={{ fontSize: 12, color: "#8fd9bb", lineHeight: 1.5 }}>
          ✅ {t(`No persistent gaps across the tracked micronutrients over the last ${daysConsidered} days.`, `هیچ کمبود تکرارشونده‌ای در ریزمغذی‌های ردیابی‌شده طی ${daysConsidered} روز اخیر دیده نشد.`)}
        </div>
      ) : (
        <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
          {gaps.map((g) => (
            <div key={g.key}>
              <div style={{ fontSize: 12.5, color: "#e8e6df", marginBottom: 6, lineHeight: 1.5 }}>
                {MICRO_ICONS[g.key]} <span style={{ fontWeight: 600 }}>{t(MICRO_LABELS[g.key].en, MICRO_LABELS[g.key].fa)}</span> —{" "}
                {t(
                  `under ${NUTRIENT_GAP_DV_THRESHOLD}% DV on ${g.daysBelow} of the last ${g.daysConsidered} days (avg ${g.avgPct}% DV).`,
                  `کمتر از ${NUTRIENT_GAP_DV_THRESHOLD}٪ ارزش روزانه در ${g.daysBelow} روز از ${g.daysConsidered} روز اخیر (میانگین ${g.avgPct}٪).`
                )}
              </div>
              <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
                {suggestFoodsForNutrient(g.key, 2, mode).map(({ food, pct }) => (
                  <span
                    key={food.id}
                    style={{ fontSize: 11, color: "#8fd9bb", background: "#132a20", border: "0.5px solid #1d9e75", borderRadius: 999, padding: "4px 9px", whiteSpace: "nowrap" }}
                  >
                    {t(food.name, food.nameFa)} · {pct}%
                  </span>
                ))}
              </div>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

  const METRICS = [

            )}

            <TrendStatCard label={t("Current streak", "توالی فعلی")} value={computeLoggingStreak(history)} suffix={t("d", "روز")} />
          </div>

          <div>
            <div style={{ display: "flex", gap: 6, marginBottom: 10 }}>
              {METRICS.map((m) => (
                <button
                  key={m.key}
                  onClick={() => toggle(m.key)}
                  style={{
                    display: "flex",
                    alignItems: "center",
                    gap: 5,
                    background: visible[m.key] ? `${m.color}22` : "transparent",
                    border: `0.5px solid ${visible[m.key] ? m.color : "#3a3d3e"}`,
                    color: visible[m.key] ? m.color : "#797d7d",
                    borderRadius: 999,
                    padding: "5px 10px",
                    fontSize: 11,
                    cursor: "pointer",
                  }}
                >
                  <span style={{ width: 7, height: 7, borderRadius: 999, background: visible[m.key] ? m.color : "#3a3d3e", display: "inline-block" }} />
                  {m.label}

              </div>

          {(() => {

            return (

                      <span style={{ color: "#e0a83c", fontWeight: 600 }}>{e.microScore}</span>

        </>

    </div>
  );
}

// Compact score line for the inline Carbs expansion — the conventional,
// guideline-based lens (see carbQualityFromProfile): GI tier, FDA-style

function MiniCarbScore({ quality, lang }) {

  const { score, fiberPer100, isAddedSugar, isWholeGrain, isGrain } = quality;
  const color = scoreTierColor(score);
  const label = genericScoreLabel(score);

    <div style={{ marginTop: 8 }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 4, fontSize: 11.5 }}>
        <span style={{ color: "#8a8f8f", display: "flex", alignItems: "center" }}>
          {t("Carb quality score", "امتیاز کیفیت کربوهیدرات")}
          <InfoIcon
            text={t(
              "The conventional, guideline-based lens: glycemic index weighted most heavily, fiber judged against FDA labeling thresholds, added sugar against WHO's free-sugars guideline, and grains against the Dietary Guidelines' whole-grain advice. See the fuller Carb Profile section below for the full breakdown.",
              "نگاه رایج و مبتنی بر دستورالعمل: بیشترین وزن به شاخص گلایسمی، فیبر بر اساس آستانه‌های برچسب‌گذاری FDA، قند افزوده بر اساس توصیه قند آزاد WHO، و غلات بر اساس توصیه غلات کامل دستورالعمل‌های غذایی سنجیده می‌شود. برای جزئیات کامل به بخش «نمایه کربوهیدرات» در پایین مراجعه کنید."
            )}
          />
        </span>
        <span style={{ fontWeight: 600, color }}>
          {score}

      <div style={{ height: 6, borderRadius: 999, background: "#2a2c2d", overflow: "hidden", marginBottom: 6 }}>

// Compact score line for the inline Protein expansion — just the number,
// tier, and bar; no PDCAAS/DIAAS breakout or standards citation (those stay
// in the full Amino acid profile section further down the card).
function MiniProteinScore({ quality, lang }) {
  const t = (en, fa) => (lang === "fa" ? fa : en);
  if (!quality) return null;
  const { score } = quality;
  const tier = qualityTier(score);
  const pct = Math.round(score * 100);
  return (

function MacroTotals({ macros, lang, showCalories, showFiber, totalGrams, carbTypes, carbQuality, functionalCarbQuality, aminos, proteinQuality, functionalProteinQuality, fatAcids, fatQuality, functionalFatQuality, gi, gl, ttp, scoreLens }) {
  const t = (en, fa) => (lang === "fa" ? fa : en);
  const [expandedKey, setExpandedKey] = useState(null);
  const carbsTotal = macros.sugar + macros.starch + macros.soluble + macros.insoluble;
  const proteinTotal = macros.protein;
  const fatTotal = macros.satFat + macros.mono + macros.poly;
  const fiberTotal = macros.soluble + macros.insoluble;
  // The "dry" mass once water is set aside — carbs + protein + fat. Used
  // as the denominator for each row's own percentage below, so e.g. "62%"
  // on the Carbs row reads as "62% of everything here that isn't water".
  const dryMass = carbsTotal + proteinTotal + fatTotal;
  const pctOfDry = (v) => (dryMass > 0 ? Math.round((v / dryMass) * 100) : null);
  const rows = [
    { key: "carbs", label: t("Carbs", "کربوهیدرات"), value: carbsTotal, kcal: carbsTotal * 4, pct: pctOfDry(carbsTotal), color: "hsl(32, 72%, 50%)", info: t(INFO_TEXT.carbsGroup.en, INFO_TEXT.carbsGroup.fa) },
    { key: "protein", label: t("Protein", "پروتئین"), value: proteinTotal, kcal: proteinTotal * 4, pct: pctOfDry(proteinTotal), color: "hsl(158, 55%, 45%)", info: t(INFO_TEXT.proteinGroup.en, INFO_TEXT.proteinGroup.fa) },
    { key: "fat", label: t("Fat", "چربی"), value: fatTotal, kcal: fatTotal * 9, pct: pctOfDry(fatTotal), color: "hsl(340, 62%, 52%)", info: t(INFO_TEXT.fatGroup.en, INFO_TEXT.fatGroup.fa) },
  ];
  // Fiber is a sub-component of the Carbs row above (not a 4th additive
  // macro), so it's called out without its own calorie figure — showing
  // one would double up against the calories already counted under Carbs.
  if (showFiber) {
    rows.push({ key: "fiber", label: t("Fiber", "فیبر"), value: fiberTotal, kcal: null, pct: pctOfDry(fiberTotal), color: "hsl(95, 40%, 42%)", info: t(INFO_TEXT.fiberGroup.en, INFO_TEXT.fiberGroup.fa) });
    // Water is whatever's left of the portion weight once carbs, protein,
    // and fat are accounted for (plus a small, un-itemized trace of ash/
    // minerals) — it's never tracked as its own per-food field, so it only
    // shows once we actually know the portion size in grams. Its own
    // percentage is of the whole portion (not dryMass), since water IS
    // the part dryMass deliberately excludes.
    if (totalGrams > 0) {
      const waterTotal = Math.max(0, totalGrams - dryMass);
      const waterPct = Math.round((waterTotal / totalGrams) * 100);
      rows.push({ key: "water", label: t("Water", "آب"), value: waterTotal, kcal: null, pct: waterPct, color: "hsl(200, 60%, 55%)", info: t(INFO_TEXT.waterGroup.en, INFO_TEXT.waterGroup.fa) });
    }
  }
  // Glycemic index/load/time-to-peak — same row layout as the macros
  // above, continued right after Water, but each carries a dynamic
  // fast/moderate/slow-style tier badge instead of a gram/%/kcal figure.
  // Each is independently optional: the ingredient card has all three,
  // while the plate/daily summary only ever has GL and time-to-peak (a
  // single "GI" isn't meaningful averaged across a mixed plate).
  if (gi != null) {
    const giT = giTier(gi);
    rows.push({
      key: "gi",
      label: t("Glycemic index", "شاخص گلایسمی"),
      value: gi,
      unit: "",
      tierLabel: t(giT.label.en, giT.label.fa),
      color: giT.color,
      metric: true,
      info: t(INFO_TEXT.gi.en, INFO_TEXT.gi.fa),
    });
  }
  if (gl != null) {
    const glT = glTier(gl);
    rows.push({
      key: "gl",
      label: t("Glycemic load", "بار گلایسمی"),
      value: round(gl, 1),
      unit: "",
      tierLabel: t(glT.label.en, glT.label.fa),
      color: glT.color,
      metric: true,
      info: t(INFO_TEXT.gl.en, INFO_TEXT.gl.fa),
    });
  }
  if (ttp != null) {
    const ttpT = ttpTier(ttp);
    rows.push({
      key: "ttp",
      label: t("Time to peak", "زمان اوج"),
      value: ttp,
      unit: t(" min", " دقیقه"),
      tierLabel: t(ttpT.label.en, ttpT.label.fa),
      color: ttpT.color,
      metric: true,
      info: t(INFO_TEXT.peak.en, INFO_TEXT.peak.fa),
    });
  }
  return (
    <div style={{ display: "flex", flexDirection: "column", width: "100%" }}>
      {rows.map((r) => {
        // Only Carbs/Protein/Fat can drill down — Fiber and Water are
        // already sub-components shown inline, with nothing further below
        // them. A row is only clickable once its own sub-detail data has
        // actually been supplied by the caller and there's a meaningful
        // amount of it in this portion.
        const drilldown =
          r.key === "carbs" && carbTypes && r.value >= 0.5
            ? () => (
                <>
                  <CarbPie carbs={carbTypes} size={170} lang={lang} />
                  {scoreLens === "functional" ? (
                    <>
                      <MiniFunctionalCarbScore quality={functionalCarbQuality} lang={lang} />
                      <MiniCarbScore quality={carbQuality} lang={lang} />
                    </>
                  ) : (
                    <>
                      <MiniCarbScore quality={carbQuality} lang={lang} />
                      <MiniFunctionalCarbScore quality={functionalCarbQuality} lang={lang} />
                    </>
                  )}
                </>
              )
            : r.key === "protein" && aminos && r.value >= 0.5
            ? () => (
                <>
                  <AminoPie aminos={aminos} size={170} lang={lang} />
                  {scoreLens === "functional" ? (
                    <>
                      <MiniFunctionalProteinScore quality={functionalProteinQuality} lang={lang} />
                      <MiniProteinScore quality={proteinQuality} lang={lang} />
                    </>
                  ) : (
                    <>
                      <MiniProteinScore quality={proteinQuality} lang={lang} />
                      <MiniFunctionalProteinScore quality={functionalProteinQuality} lang={lang} />
                    </>
                  )}
                </>
              )
            : r.key === "fat" && fatAcids && r.value >= 0.5
            ? () => (
                <>
                  <FatPie fatAcids={fatAcids} size={170} lang={lang} />
                  {scoreLens === "functional" ? (
                    <>
                      <MiniFunctionalFatScore quality={functionalFatQuality} lang={lang} />
                      <MiniFatScore quality={fatQuality} lang={lang} />
                    </>
                  ) : (
                    <>
                      <MiniFatScore quality={fatQuality} lang={lang} />
                      <MiniFunctionalFatScore quality={functionalFatQuality} lang={lang} />
                    </>
                  )}
                </>
              )
            : null;
        const isOpen = expandedKey === r.key && drilldown;
        return (
          <div key={r.label}>
            <div
              style={{
                display: "grid",
                gridTemplateColumns: "12px 18px 112px 1fr",
                alignItems: "center",
                columnGap: 6,
                fontSize: 12.5,
                padding: "5px 0",
                borderBottom: isOpen ? "none" : "0.5px solid #1c1e1f",
              }}
            >
              <span style={{ width: 9, height: 9, borderRadius: "50%", background: r.color, flexShrink: 0 }} />
              <span aria-hidden="true">{MACRO_GROUP_ICONS[r.key]}</span>
              <span style={{ display: "flex", alignItems: "center", whiteSpace: "nowrap" }}>
                {drilldown ? (
                  <button
                    onClick={() => setExpandedKey((k) => (k === r.key ? null : r.key))}
                    aria-expanded={isOpen}
                    style={{
                      display: "flex",
                      alignItems: "center",
                      whiteSpace: "nowrap",
                      background: "transparent",
                      border: "none",
                      padding: 0,
                      margin: 0,
                      font: "inherit",
                      fontSize: 13.5,
                      fontWeight: 500,
                      color: isOpen ? "#8fd9bb" : "#8a8f8f",
                      cursor: "pointer",
                    }}
                  >
                    {r.label}
                    <span
                      aria-hidden="true"
                      style={{
                        display: "inline-block",
                        fontSize: 18,
                        fontWeight: 700,
                        lineHeight: 1,
                        marginInlineStart: 5,
                        color: isOpen ? "#8fd9bb" : "#a9ada9",
                        transition: "transform 0.15s ease",
                        transform: isOpen ? "rotate(180deg)" : "rotate(0deg)",
                      }}
                    >
                      ▾
                    </span>
                  </button>
                ) : (
                  <span style={{ color: "#8a8f8f" }}>{r.label}</span>
                )}
                <InfoIcon text={r.info} />
              </span>
              <span style={{ fontWeight: 500, textAlign: "start" }}>
                {r.metric ? (
                  <>
                    {r.value}
                    {r.unit}
                    <span style={{ color: r.color, fontWeight: 700 }}> · {r.tierLabel}</span>
                  </>
                ) : (
                  <>
                    {round(r.value, r.value < 10 ? 1 : 0)}g
                    {r.pct != null && <span style={{ color: "#6f7373", fontWeight: 400 }}> · {r.pct}%</span>}
                    {showCalories && r.kcal != null && <span style={{ color: "#6f7373", fontWeight: 400 }}> · {round(r.kcal)} kcal</span>}
                  </>
                )}
              </span>
            </div>
            {isOpen && (
              <div
                style={{
                  padding: "10px 0 12px",
                  marginBottom: 2,
                  borderBottom: "0.5px solid #1c1e1f",
                  display: "flex",
                  flexDirection: "column",
                  alignItems: "center",
                }}
              >
                {drilldown()}
              </div>
            )}
          </div>
        );
      })}
    </div>
  );
}

function ProteinQualityBadge({ quality, lang }) {
  const t = (en, fa) => (lang === "fa" ? fa : en);
  if (!quality) return null;
  const { score, limitingKey, rawRatio, digestibility } = quality;
  const tier = qualityTier(score);
  const pct = Math.round(score * 100);
  const pdcaas = Math.round(Math.min(1, rawRatio * digestibility) * 100);
  const diaas = Math.round(rawRatio * digestibility * 100);
  return (
    <div style={{ marginTop: 10, paddingTop: 10, borderTop: "0.5px solid #2a2c2d" }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 5 }}>
        <span style={{ fontSize: 11.5, color: "#8a8f8f", display: "flex", alignItems: "center" }}>
          {t("Amino acid score", "امتیاز اسید آمینه")}
          <InfoIcon text={t(INFO_TEXT.proteinQualityScore.en, INFO_TEXT.proteinQualityScore.fa)} />
        </span>
        <span style={{ fontSize: 11.5, fontWeight: 600, color: tier.color }}>
          {pct}% · {t(tier.label.en, tier.label.fa)}
        </span>
      </div>
      <div style={{ height: 7, borderRadius: 999, background: "#2a2c2d", overflow: "hidden" }}>
        <div style={{ height: "100%", width: `${pct}%`, background: tier.color, borderRadius: 999 }} />
      </div>
      {score < 1 && (
        <div style={{ fontSize: 11, color: "#797d7d", marginTop: 6, lineHeight: 1.5 }}>
          {t(
            `Limiting amino acid: ${AMINO_LABELS[limitingKey].en} — the amount your body can actually use for building protein is capped by whichever essential amino acid is scarcest.`,
            `اسید آمینه محدودکننده: ${AMINO_LABELS[limitingKey].fa} — مقداری که بدن واقعاً می‌تواند برای ساخت پروتئین استفاده کند، توسط کمیاب‌ترین اسید آمینه ضروری محدود می‌شود.`
          )}
        </div>
      )}
      <div style={{ display: "flex", gap: 16, marginTop: 10, fontSize: 12 }}>
        <div>
          <span style={{ color: "#8a8f8f" }}>PDCAAS </span>
          <span style={{ fontWeight: 600 }}>{pdcaas}%</span>
        </div>
        <div>
          <span style={{ color: "#8a8f8f" }}>DIAAS </span>
          <span style={{ fontWeight: 600 }}>{diaas}%</span>
        </div>
      </div>
      <div style={{ fontSize: 10.5, color: "#6f7373", marginTop: 5, lineHeight: 1.5 }}>
        {t(
          "PDCAAS (the old FDA/FAO standard) caps at 100%; DIAAS (FAO's current standard) doesn't, so excellent proteins can exceed 100%. Both add an approximate digestibility factor on top of the amino acid score above.",
          "PDCAAS (استاندارد قدیمی FDA/FAO) سقف ۱۰۰٪ دارد؛ DIAAS (استاندارد فعلی FAO) سقف ندارد و پروتئین‌های عالی می‌توانند بیش از ۱۰۰٪ باشند. هر دو یک ضریب هضم تقریبی را روی امتیاز اسید آمینه بالا اعمال می‌کنند."
        )}
      </div>
    </div>
  );
}

// Lets a person confirm sourcing (grass-fed/pastured/organic vs.

// default) is a real, distinct option rather than defaulting to a guess
// framed as an answer.
function SourcingToggle({ sourcing, onChange, lang }) {
  const t = (en, fa) => (lang === "fa" ? fa : en);
  const options = [
    { value: "unknown", label: t("Unknown", "نامشخص") },
    { value: "grassfed", label: t("Grass-fed/pastured", "علف‌خوار/طبیعی") },

  ];
  return (
    <div style={{ marginBottom: 10 }}>
      <div style={{ fontSize: 11, color: "#797d7d", marginBottom: 5 }}>{t("Sourcing (affects the score below)", "منبع تأمین (روی امتیاز زیر اثر دارد)")}</div>
      <div style={{ display: "inline-flex", borderRadius: 999, border: "0.5px solid #3a3d3e", overflow: "hidden" }}>
        {options.map((opt) => {
          const active = (sourcing || "unknown") === opt.value;
          return (
            <button
              key={opt.value}
              onClick={() => onChange(opt.value)}

                padding: "6px 10px",

            )}

            <span aria-hidden="true">{n.ok === true ? "✅" : n.ok === false ? "⚠️" : "•"}</span>
            <span>{t(n.text.en, n.text.fa)}</span>

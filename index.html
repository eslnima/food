function MacroTotals({ macros, lang, showCalories, showFiber, totalGrams, carbTypes, functionalCarbQuality, aminos, proteinQuality, functionalProteinQuality, fatAcids, fatQuality, functionalFatQuality, gi, gl, ttp }) {
  const t = (en, fa) => (lang === "fa" ? fa : en);
  const [expandedKey, setExpandedKey] = useState(null);
  const carbsTotal = macros.sugar + macros.starch + macros.soluble + macros.insoluble;
  const proteinTotal = macros.protein;
  const fatTotal = macros.satFat + macros.mono + macros.poly;
  const fiberTotal = macros.soluble + macros.insoluble;
  // The "dry" mass once water is set aside — carbs + protein + fat. Used
  // as the denominator for each row's own percentage below, so e.g. "62%"
  // on the Carbs row reads as "62% of everything here that isn't water".
  const dryMass = carbsTotal + proteinTotal + fatTotal;
  const pctOfDry = (v) => (dryMass > 0 ? Math.round((v / dryMass) * 100) : null);
  const rows = [
    { key: "carbs", label: t("Carbs", "کربوهیدرات"), value: carbsTotal, kcal: carbsTotal * 4, pct: pctOfDry(carbsTotal), color: "hsl(32, 72%, 50%)", info: t(INFO_TEXT.carbsGroup.en, INFO_TEXT.carbsGroup.fa) },
    { key: "protein", label: t("Protein", "پروتئین"), value: proteinTotal, kcal: proteinTotal * 4, pct: pctOfDry(proteinTotal), color: "hsl(158, 55%, 45%)", info: t(INFO_TEXT.proteinGroup.en, INFO_TEXT.proteinGroup.fa) },
    { key: "fat", label: t("Fat", "چربی"), value: fatTotal, kcal: fatTotal * 9, pct: pctOfDry(fatTotal), color: "hsl(340, 62%, 52%)", info: t(INFO_TEXT.fatGroup.en, INFO_TEXT.fatGroup.fa) },
  ];
  // Fiber is a sub-component of the Carbs row above (not a 4th additive
  // macro), so it's called out without its own calorie figure — showing
  // one would double up against the calories already counted under Carbs.
  if (showFiber) {
    rows.push({ key: "fiber", label: t("Fiber", "فیبر"), value: fiberTotal, kcal: null, pct: pctOfDry(fiberTotal), color: "hsl(95, 40%, 42%)", info: t(INFO_TEXT.fiberGroup.en, INFO_TEXT.fiberGroup.fa) });
    // Water is whatever's left of the portion weight once carbs, protein,
    // and fat are accounted for (plus a small, un-itemized trace of ash/
    // minerals) — it's never tracked as its own per-food field, so it only
    // shows once we actually know the portion size in grams. Its own
    // percentage is of the whole portion (not dryMass), since water IS
    // the part dryMass deliberately excludes.
    if (totalGrams > 0) {
      const waterTotal = Math.max(0, totalGrams - dryMass);
      const waterPct = Math.round((waterTotal / totalGrams) * 100);
      rows.push({ key: "water", label: t("Water", "آب"), value: waterTotal, kcal: null, pct: waterPct, color: "hsl(200, 60%, 55%)", info: t(INFO_TEXT.waterGroup.en, INFO_TEXT.waterGroup.fa) });
    }
  }
  // Glycemic index/load/time-to-peak — same row layout as the macros
  // above, continued right after Water, but each carries a dynamic
  // fast/moderate/slow-style tier badge instead of a gram/%/kcal figure.
  // Each is independently optional: the ingredient card has all three,
  // while the plate/daily summary only ever has GL and time-to-peak (a
  // single "GI" isn't meaningful averaged across a mixed plate).
  if (gi != null) {
    const giT = giTier(gi);
    rows.push({
      key: "gi",
      label: t("Glycemic index", "شاخص گلایسمی"),
      value: gi,
      unit: "",
      tierLabel: t(giT.label.en, giT.label.fa),
      color: giT.color,
      metric: true,
      info: t(INFO_TEXT.gi.en, INFO_TEXT.gi.fa),
    });
  }
  if (gl != null) {
    const glT = glTier(gl);
    rows.push({
      key: "gl",
      label: t("Glycemic load", "بار گلایسمی"),
      value: round(gl, 1),
      unit: "",
      tierLabel: t(glT.label.en, glT.label.fa),
      color: glT.color,
      metric: true,
      info: t(INFO_TEXT.gl.en, INFO_TEXT.gl.fa),
    });
  }
  if (ttp != null) {
    const ttpT = ttpTier(ttp);
    rows.push({
      key: "ttp",
      label: t("Time to peak", "زمان اوج"),
      value: ttp,
      unit: t(" min", " دقیقه"),
      tierLabel: t(ttpT.label.en, ttpT.label.fa),
      color: ttpT.color,
      metric: true,
      info: t(INFO_TEXT.peak.en, INFO_TEXT.peak.fa),
    });
  }
  return (
    <div style={{ display: "flex", flexDirection: "column", width: "100%" }}>
      {rows.map((r) => {
        // Only Carbs/Protein/Fat can drill down — Fiber and Water are
        // already sub-components shown inline, with nothing further below
        // them. A row is only clickable once its own sub-detail data has
        // actually been supplied by the caller and there's a meaningful
        // amount of it in this portion.
        const drilldown =
          r.key === "carbs" && carbTypes && r.value >= 0.5
            ? () => (
                <>
                  <CarbPie carbs={carbTypes} size={170} lang={lang} />
                  <MiniFunctionalCarbScore quality={functionalCarbQuality} lang={lang} />
                </>
              )
            : r.key === "protein" && aminos && r.value >= 0.5
            ? () => (
                <>
                  <AminoPie aminos={aminos} size={170} lang={lang} />
                  <MiniProteinScore quality={proteinQuality} lang={lang} />
                  <MiniFunctionalProteinScore quality={functionalProteinQuality} lang={lang} />
                </>
              )
            : r.key === "fat" && fatAcids && r.value >= 0.5
            ? () => (
                <>
                  <FatPie fatAcids={fatAcids} size={170} lang={lang} />
                  <MiniFatScore quality={fatQuality} lang={lang} />
                  <MiniFunctionalFatScore quality={functionalFatQuality} lang={lang} />
                </>
              )
            : null;
        const isOpen = expandedKey === r.key && drilldown;
        return (
          <div key={r.label}>
            <div
              style={{
                display: "grid",
                gridTemplateColumns: "12px 18px 112px 1fr",
                alignItems: "center",
                columnGap: 6,
                fontSize: 12.5,
                padding: "5px 0",
                borderBottom: isOpen ? "none" : "0.5px solid #1c1e1f",
              }}
            >
              <span style={{ width: 9, height: 9, borderRadius: "50%", background: r.color, flexShrink: 0 }} />
              <span aria-hidden="true">{MACRO_GROUP_ICONS[r.key]}</span>
              <span style={{ display: "flex", alignItems: "center", whiteSpace: "nowrap" }}>
                {drilldown ? (
                  <button
                    onClick={() => setExpandedKey((k) => (k === r.key ? null : r.key))}
                    aria-expanded={isOpen}
                    style={{
                      display: "flex",
                      alignItems: "center",
                      whiteSpace: "nowrap",
                      background: "transparent",
                      border: "none",
                      padding: 0,
                      margin: 0,
                      font: "inherit",
                      fontSize: 13.5,
                      fontWeight: 500,
                      color: isOpen ? "#8fd9bb" : "#8a8f8f",
                      cursor: "pointer",
                    }}
                  >
                    {r.label}
                    <span
                      aria-hidden="true"
                      style={{
                        display: "inline-block",
                        fontSize: 18,
                        fontWeight: 700,
                        lineHeight: 1,
                        marginInlineStart: 5,
                        color: isOpen ? "#8fd9bb" : "#a9ada9",
                        transition: "transform 0.15s ease",
                        transform: isOpen ? "rotate(180deg)" : "rotate(0deg)",
                      }}
                    >
                      ▾
                    </span>
                  </button>
                ) : (
                  <span style={{ color: "#8a8f8f" }}>{r.label}</span>
                )}
                <InfoIcon text={r.info} />
              </span>
              <span style={{ fontWeight: 500, textAlign: "start" }}>
                {r.metric ? (
                  <>
                    {r.value}
                    {r.unit}
                    <span style={{ color: r.color, fontWeight: 700 }}> · {r.tierLabel}</span>
                  </>
                ) : (
                  <>
                    {round(r.value, r.value < 10 ? 1 : 0)}g
                    {r.pct != null && <span style={{ color: "#6f7373", fontWeight: 400 }}> · {r.pct}%</span>}
                    {showCalories && r.kcal != null && <span style={{ color: "#6f7373", fontWeight: 400 }}> · {round(r.kcal)} kcal</span>}
                  </>
                )}
              </span>
            </div>
            {isOpen && (
              <div
                style={{
                  padding: "10px 0 12px",
                  marginBottom: 2,
                  borderBottom: "0.5px solid #1c1e1f",
                  display: "flex",
                  flexDirection: "column",
                  alignItems: "center",
                }}
              >
                {drilldown()}
              </div>
            )}
          </div>
        );
      })}
    </div>
  );
}

function ProteinQualityBadge({ quality, lang }) {
  const t = (en, fa) => (lang === "fa" ? fa : en);
  if (!quality) return null;
  const { score, limitingKey, rawRatio, digestibility } = quality;
  const tier = qualityTier(score);
  const pct = Math.round(score * 100);
  const pdcaas = Math.round(Math.min(1, rawRatio * digestibility) * 100);
  const diaas = Math.round(rawRatio * digestibility * 100);
  return (
    <div style={{ marginTop: 10, paddingTop: 10, borderTop: "0.5px solid #2a2c2d" }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 5 }}>
        <span style={{ fontSize: 11.5, color: "#8a8f8f", display: "flex", alignItems: "center" }}>
          {t("Amino acid score", "امتیاز اسید آمینه")}
          <InfoIcon text={t(INFO_TEXT.proteinQualityScore.en, INFO_TEXT.proteinQualityScore.fa)} />
        </span>
        <span style={{ fontSize: 11.5, fontWeight: 600, color: tier.color }}>
          {pct}% · {t(tier.label.en, tier.label.fa)}
        </span>
      </div>
      <div style={{ height: 7, borderRadius: 999, background: "#2a2c2d", overflow: "hidden" }}>
        <div style={{ height: "100%", width: `${pct}%`, background: tier.color, borderRadius: 999 }} />
      </div>
      {score < 1 && (
        <div style={{ fontSize: 11, color: "#797d7d", marginTop: 6, lineHeight: 1.5 }}>
          {t(
            `Limiting amino acid: ${AMINO_LABELS[limitingKey].en} — the amount your body can actually use for building protein is capped by whichever essential amino acid is scarcest.`,
            `اسید آمینه محدودکننده: ${AMINO_LABELS[limitingKey].fa} — مقداری که بدن واقعاً می‌تواند برای ساخت پروتئین استفاده کند، توسط کمیاب‌ترین اسید آمینه ضروری محدود می‌شود.`
          )}
        </div>
      )}
      <div style={{ display: "flex", gap: 16, marginTop: 10, fontSize: 12 }}>
        <div>
          <span style={{ color: "#8a8f8f" }}>PDCAAS </span>
          <span style={{ fontWeight: 600 }}>{pdcaas}%</span>
        </div>
        <div>
          <span style={{ color: "#8a8f8f" }}>DIAAS </span>
          <span style={{ fontWeight: 600 }}>{diaas}%</span>
        </div>
      </div>
      <div style={{ fontSize: 10.5, color: "#6f7373", marginTop: 5, lineHeight: 1.5 }}>
        {t(
          "PDCAAS (the old FDA/FAO standard) caps at 100%; DIAAS (FAO's current standard) doesn't, so excellent proteins can exceed 100%. Both add an approximate digestibility factor on top of the amino acid score above.",
          "PDCAAS (استاندارد قدیمی FDA/FAO) سقف ۱۰۰٪ دارد؛ DIAAS (استاندارد فعلی FAO) سقف ندارد و پروتئین‌های عالی می‌توانند بیش از ۱۰۰٪ باشند. هر دو یک ضریب هضم تقریبی را روی امتیاز اسید آمینه بالا اعمال می‌کنند."
        )}
      </div>
    </div>
  );
}

  const color = scoreTierColor(score);

  const ratioText = ratio == null ? "—" : Number.isFinite(ratio) ? `${ratio.toFixed(1)}:1` : "20+:1";
  return (
    <div style={{ marginTop: 10, paddingTop: 10, borderTop: "0.5px solid #2a2c2d" }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 6 }}>

          <InfoIcon
            text={t(
              "An alternate lens on the same fat breakdown: saturated fat is weighted much more lightly (and even more so for foods where a grass-fed/pastured source is plausible), while the omega-6:omega-3 ratio — not just absolute omega-3 — becomes the main driver of the score.",
              "نگاهی جایگزین به همان تفکیک چربی: چربی اشباع وزن بسیار کمتری دارد (و برای خوراکی‌هایی که احتمال منبع علف‌خوار/ارگانیک دارند حتی کمتر)، در حالی که نسبت امگا-۶ به امگا-۳ — نه فقط مقدار مطلق امگا-۳ — عامل اصلی امتیاز می‌شود."
            )}
          />
        </span>
        <span style={{ fontSize: 13, fontWeight: 700, color }}>
          {score}
          <span style={{ fontSize: 11, color: "#8a8f8f", fontWeight: 400 }}>/10</span> · {t(label.en, label.fa)}
        </span>
      </div>
      <div style={{ display: "flex", flexDirection: "column", gap: 4, marginBottom: 8 }}>
        {notes.map((n, i) => (
          <div key={i} style={{ display: "flex", gap: 6, fontSize: 11, color: "#c7c5bc", lineHeight: 1.5 }}>
            <span aria-hidden="true">{n.ok === true ? "✅" : n.ok === false ? "⚠️" : "•"}</span>
            <span>{t(n.text.en, n.text.fa)}</span>
          </div>
        ))}
      </div>
      <div style={{ display: "flex", gap: 14, fontSize: 11, color: "#8a8f8f" }}>
        <span>
          {t("Saturated", "اشباع")} {Math.round(satShare * 100)}%
        </span>
        <span>
          {t("Omega-6:3", "امگا-۶:۳")} {ratioText}
        </span>
        {isPasturedRelevant && <span style={{ color: "#8fd9bb" }}>{t("Sourcing-sensitive", "به منبع حساس")}</span>}
      </div>
      <div style={{ fontSize: 10.5, color: "#6f7373", marginTop: 8, lineHeight: 1.5 }}>
        {t(
          "A second, more recent-research-leaning estimate — draws on the view that saturated fat's risk is more food-matrix/sourcing-dependent than once assumed, and that the omega-6:omega-3 balance matters as much as either fat alone. This is a different interpretive lens, not a more \"correct\" number than the score above; the two are meant to be read together.",
          "برآوردی دوم و متکی بر پژوهش‌های نسبتاً جدیدتر — بر این دیدگاه استوار است که خطر چربی اشباع بیش از آنچه پیش‌تر تصور می‌شد به بافت غذا/منبع آن بستگی دارد و توازن امگا-۶ به امگا-۳ به‌اندازه هر یک از این چربی‌ها به‌تنهایی اهمیت دارد. این یک نگاه تفسیری متفاوت است، نه عددی «درست‌تر» از امتیاز بالا؛ قرار است این دو با هم خوانده شوند."
        )}
      </div>
    </div>
  );
}

function CarbBreakdown({ carbs, lang }) {
  const t = (en, fa) => (lang === "fa" ? fa : en);
  const present = CARB_KEYS_ORDERED.filter((k) => carbs[k] > 0.05);
  if (present.length === 0) {
    return <div style={{ fontSize: 11.5, color: "#797d7d" }}>{t("No carbs in this portion.", "کربوهیدراتی در این وعده نیست.")}</div>;
  }
  return (
    <div>
      {present.map((k) => (
        <CarbTypeRow key={k} carbKey={k} grams={carbs[k]} lang={lang} />
      ))}
    </div>
  );
}

// A second, deliberately different lens on the same carbohydrate — see
// functionalCarbQualityFromProfile above. Shown alongside the sugar/starch/
// fiber pie so this framework's disagreement with plain GI/GL is visible
// rather than hidden behind one "official" number.
function FunctionalCarbBadge({ quality, lang }) {
  const t = (en, fa) => (lang === "fa" ? fa : en);
  if (!quality) return null;
  const { score, fiberRatio, isRefined, isWholeFood, gi } = quality;
  const color = scoreTierColor(score);
  const label = genericScoreLabel(score);
  return (
    <div style={{ marginTop: 10, paddingTop: 10, borderTop: "0.5px solid #2a2c2d" }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 6 }}>
        <span style={{ fontSize: 11.5, color: "#8a8f8f", display: "flex", alignItems: "center" }}>
          {t("Functional-medicine carb score", "امتیاز کربوهیدرات به‌سبک طب عملکردی")}
          <InfoIcon
            text={t(
              "An alternate lens on the same carbohydrate: fiber-to-carb ratio and whole-food vs. refined/isolated sourcing are weighted far more heavily than glycemic index, and a high fructose share is only treated as a concern when it arrives isolated (added sugar, syrup, soda) rather than bound in a whole fruit's fiber.",
              "نگاهی جایگزین به همان کربوهیدرات: نسبت فیبر به کربوهیدرات و منبع خوراکی کامل در برابر تصفیه‌شده/خالص، وزن بسیار بیشتری نسبت به شاخص گلایسمی دارند، و سهم بالای فروکتوز تنها زمانی نگران‌کننده در نظر گرفته می‌شود که به‌صورت خالص (قند افزوده، شربت، نوشابه) باشد نه در بافت فیبردار یک میوه کامل."
            )}
          />
        </span>
        <span style={{ fontSize: 13, fontWeight: 700, color }}>
          {score}
          <span style={{ fontSize: 11, color: "#8a8f8f", fontWeight: 400 }}>/10</span> · {t(label.en, label.fa)}
        </span>
      </div>
      <div style={{ display: "flex", flexDirection: "column", gap: 4, marginBottom: 8 }}>
        {quality.notes.map((n, i) => (
          <div key={i} style={{ display: "flex", gap: 6, fontSize: 11, color: "#c7c5bc", lineHeight: 1.5 }}>
            <span aria-hidden="true">{n.ok === true ? "✅" : n.ok === false ? "⚠️" : "•"}</span>
            <span>{t(n.text.en, n.text.fa)}</span>
          </div>
        ))}
      </div>
      <div style={{ display: "flex", gap: 14, fontSize: 11, color: "#8a8f8f", flexWrap: "wrap" }}>
        <span>
          {t("Fiber/carb", "فیبر/کربوهیدرات")} {Math.round(fiberRatio * 100)}%
        </span>
        <span>{t("GI", "GI")} {gi}</span>
        {isRefined && <span style={{ color: "#d4938f" }}>{t("Refined/isolated", "تصفیه‌شده/خالص")}</span>}
        {isWholeFood && <span style={{ color: "#8fd9bb" }}>{t("Whole food", "خوراکی کامل")}</span>}
      </div>
      <div style={{ fontSize: 10.5, color: "#6f7373", marginTop: 8, lineHeight: 1.5 }}>
        {t(
          "A second, more recent-research-leaning estimate — draws on the view that fiber content and whole-food vs. refined sourcing shape a carbohydrate's real metabolic impact more than glycemic index alone. This is a different interpretive lens, not a more \"correct\" number than GI/GL; the two are meant to be read together.",
          "برآوردی دوم و متکی بر پژوهش‌های نسبتاً جدیدتر — بر این دیدگاه استوار است که محتوای فیبر و منبع خوراکی کامل در برابر تصفیه‌شده، اثر متابولیک واقعی یک کربوهیدرات را بیش از شاخص گلایسمی به‌تنهایی شکل می‌دهند. این یک نگاه تفسیری متفاوت است، نه عددی «درست‌تر» از GI/GL؛ قرار است این دو با هم خوانده شوند."
        )}
      </div>
    </div>
  );
}

function CarbBreakdownSection({ food, grams, lang, t }) {
  const [open, setOpen] = useState(false);
  const totalCarbG = (food.carbs100 + food.soluble100 + food.insoluble100) * grams / 100;
  if (totalCarbG < 0.5) return null;
  const carbs = carbTypesAtPortion(food, grams);
  return (
    <Collapsible
      open={open}
      onToggle={() => setOpen((o) => !o)}
      showLabel={t("Carb Profile", "نمایه کربوهیدرات")}
      hideLabel={t("Hide carb profile", "پنهان کردن نمایه کربوهیدرات")}
      info={t(INFO_TEXT.carbSubtype.en, INFO_TEXT.carbSubtype.fa)}
      compact
    >
      <div style={{ fontSize: 11, color: "#797d7d", marginBottom: 8, lineHeight: 1.5 }}>
        {t(
          "The sugar split (glucose/fructose/sucrose/lactose/maltose) is estimated from typical patterns for this food's source — e.g. fruit → mostly fructose+glucose, milk → lactose — not lab-measured for this specific food. Starch and fiber are this food's own real values.",
          "تقسیم قندها (گلوکز/فروکتوز/ساکارز/لاکتوز/مالتوز) بر اساس الگوی معمول منبع این خوراکی تخمین زده شده — مثلاً میوه ← عمدتاً فروکتوز+گلوکز، شیر ← لاکتوز — نه اندازه‌گیری آزمایشگاهی این خوراکی خاص. نشاسته و فیبر مقادیر واقعی همین خوراکی هستند."
        )}
      </div>
      <CarbPie carbs={carbs} size={140} lang={lang} />
      <div style={{ marginTop: 10, paddingTop: 4, borderTop: "0.5px solid #2a2c2d" }}>
        <CarbBreakdown carbs={carbs} lang={lang} />
      </div>
      <FunctionalCarbBadge quality={computeFunctionalCarbScore(food)} lang={lang} />
    </Collapsible>
  );
}

function Collapsible({ open, onToggle, showLabel, hideLabel, children, info, compact }) {
  return (
    <div>
      <div style={{ display: "inline-flex", alignItems: "center" }}>
        <button
          onClick={onToggle}
          style={{
            display: "inline-flex",
            alignItems: "center",
            gap: compact ? 5 : 6,
            background: open ? "#1c2b25" : "#1a1c1d",
            border: `0.5px solid ${open ? "#1d9e75" : "#3a3d3e"}`,
            color: open ? "#8fd9bb" : "#c7c5bc",
            fontSize: compact ? 12 : 13.5,
            fontWeight: 500,
            cursor: "pointer",
            padding: compact ? "6px 11px" : "9px 14px",
            borderRadius: 999,
            minHeight: compact ? 32 : 40,
          }}
        >
          {open ? hideLabel : showLabel}
          <span
            style={{
              display: "inline-block",
              fontSize: compact ? 9 : 10,
              transition: "transform 0.15s ease",
              transform: open ? "rotate(180deg)" : "rotate(0deg)",
            }}
          >
            ▾
          </span>
        </button>
        <InfoIcon text={info} />
      </div>
      {open && <div style={{ marginTop: 8 }}>{children}</div>}
    </div>
  );
}

// One card per meal slot on the Daily total tab — shows that meal's items,
// calories, and macro totals at a glance, without pulling in the individual

function MealSummaryCard({ slot, foods, plate, lang }) {

    <div

      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: empty ? 2 : 8 }}>

function MacroStat({ label, value }) {

}

function FoodCard({
  food: f,
  mode,
  customGrams,
  plateSlots,
  toggleSlotMembership,
  addToOpenId,
  setAddToOpenId,
  openDetails,
  lang,
  setGramsFor,
  resetGramsFor,
  toggleDetails,
  pieSize,
  swapOpenId,
  setSwapOpenId,
  swapQuery,
  setSwapQuery,
  onSwapFood,
  showAminoAlways,
  onRemove,
  badges,
}) {
  const t = (en, fa) => (lang === "fa" ? fa : en);
  const { grams, carbsAtPortion, gl } = portionInfo(f, mode, customGrams[f.id]);
  const unit = LIQUID_IDS.includes(f.id) ? "ml" : "g";
  const macros = macrosAtPortion(f, grams);
  const micros = microsAtPortion(f, grams);
  // Split at 5% DV: "significant" amounts sit inline right in the main
  // card (no click needed to see them), while trace amounts collapse into
  // "Minor amounts" so they don't crowd out the numbers that matter.
  const microDvItems = MICRO_KEYS_ORDERED.map((k) => {
    const dvPct = microDvPct(k, micros[k]);
    const tier = microTier(k, dvPct);
    return { k, dvPct, color: tier ? MICRO_TIER_STYLE[tier].color : "#8a8f8f" };
  });
  const microSignificant = packChipsByWidth(
    microDvItems.filter((i) => i.dvPct >= 5),
    (i) => estimateMicroChipWidth(t(MICRO_LABELS[i.k].en, MICRO_LABELS[i.k].fa), i.dvPct)
  );
  const microMinor = microDvItems.filter((i) => i.dvPct < 5);
  const isOpen = !!openDetails[f.id];
  const isCustom = customGrams[f.id] != null;
  const swapPanelOpen = swapOpenId === f.id;
  const swapRef = useRef(null);
  const addToPanelOpen = addToOpenId === f.id;
  const addToRef = useRef(null);
  const memberSlots = MEAL_SLOTS.filter((slot) => (plateSlots[slot.id] || []).includes(f.id));
  const aminoProteinG = (f.protein100 * grams) / 100;
  const showAmino = showAminoAlways && aminoProteinG >= 0.5;

  const q = swapQuery.trim().toLowerCase();
  const swapResults = q
    ? FOODS.filter((sf) => sf.id !== f.id && (sf.name.toLowerCase().includes(q) || sf.nameFa.includes(swapQuery.trim()))).slice(0, 8)
    : findSimilarFoods(f, 6);

  function toggleSwap() {
    setSwapOpenId(swapPanelOpen ? null : f.id);
    setSwapQuery("");
  }

  function toggleAddTo() {
    setAddToOpenId(addToPanelOpen ? null : f.id);
  }

  useEffect(() => {
    if (!addToPanelOpen) return;
    function handleClickOutside(e) {
      if (addToRef.current && !addToRef.current.contains(e.target)) {
        setAddToOpenId(null);
      }
    }
    document.addEventListener("mousedown", handleClickOutside);
    document.addEventListener("touchstart", handleClickOutside);
    return () => {
      document.removeEventListener("mousedown", handleClickOutside);
      document.removeEventListener("touchstart", handleClickOutside);
    };
  }, [addToPanelOpen]);

  useEffect(() => {
    if (!swapPanelOpen) return;
    function handleClickOutside(e) {
      if (swapRef.current && !swapRef.current.contains(e.target)) {
        setSwapOpenId(null);
      }
    }
    document.addEventListener("mousedown", handleClickOutside);
    document.addEventListener("touchstart", handleClickOutside);
    return () => {
      document.removeEventListener("mousedown", handleClickOutside);
      document.removeEventListener("touchstart", handleClickOutside);
    };
  }, [swapPanelOpen]);

  return (
    <div style={{ background: "#16181a", border: `0.5px solid ${f.color}`, borderRadius: 12, padding: 14 }}>
      <div ref={swapRef}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", gap: 6, marginBottom: 2 }}>
          <button
            onClick={toggleSwap}
            title={t("Swap for a similar food", "جایگزینی با خوراکی مشابه")}
            style={{
              display: "flex",
              alignItems: "center",
              gap: 8,
              background: swapPanelOpen ? "#1c2b25" : "transparent",
              border: `0.5px solid ${swapPanelOpen ? "#1d9e75" : "transparent"}`,
              borderRadius: 10,
              padding: "6px 8px 6px 6px",
              margin: "-6px -8px 0 -6px",
              cursor: "pointer",
              color: "#e8e6df",
              minHeight: 40,
            }}
          >
            <span style={{ display: "flex", alignItems: "center", gap: 8 }}>
              <span aria-hidden="true" style={{ fontSize: 21, lineHeight: 1 }}>
                {foodEmoji(f)}
              </span>
              <span style={{ display: "flex", flexDirection: "column", alignItems: "flex-start" }}>
                <span style={{ fontSize: 17, fontWeight: 600, lineHeight: 1.25 }}>{t(f.name, f.nameFa)}</span>
                <span style={{ fontSize: 12, fontWeight: 400, color: "#8a8f8f", lineHeight: 1.25 }}>{t(f.nameFa, f.name)}</span>
              </span>
            </span>
            <span
              style={{
                display: "flex",
                alignItems: "center",
                justifyContent: "center",
                width: 28,
                height: 28,
                borderRadius: "50%",
                background: swapPanelOpen ? "#1d9e75" : "#2a2c2d",
                color: swapPanelOpen ? "#0d0f10" : "#c7c5bc",
                fontSize: 16,
                flexShrink: 0,
                transition: "transform 0.15s ease, background 0.15s ease",
                transform: swapPanelOpen ? "rotate(180deg)" : "rotate(0deg)",

            >
              ▾
            </span>
          </button>
          <button
            onClick={onRemove}
            title={t("Remove this food", "حذف این خوراکی")}
            aria-label={t("Remove this food", "حذف این خوراکی")}
            style={{
              display: "flex",
              alignItems: "center",
              justifyContent: "center",

              flexShrink: 0,

          >
            ✕

        <div ref={addToRef} style={{ marginBottom: 8 }}>

          >
            <span>{addToPanelOpen ? "▾" : "▸"}</span>

          </button>

          {addToPanelOpen && (
            <div style={{ background: "#0d0f10", border: "0.5px solid #3a3d3e", borderRadius: 10, padding: 10, marginTop: 8 }}>
              <div style={{ fontSize: 11.5, color: "#8a8f8f", marginBottom: 6 }}>{t("Add this also to my ...", "این را همچنین به ... من هم اضافه کن")}</div>
              <div style={{ display: "flex", flexDirection: "column" }}>
                {MEAL_SLOTS.map((slot) => {

            />
            <div style={{ fontSize: 10.5, color: "#6f7373", margin: "8px 0 4px" }}>
              {q ? t("Search results", "نتایج جستجو") : t("Similar foods", "خوراکی‌های مشابه")}
            </div>
            <div style={{ display: "flex", flexDirection: "column", gap: 3, maxHeight: 220, overflowY: "auto" }}>
              {swapResults.length === 0 && <div style={{ fontSize: 12, color: "#6f7373", padding: "8px 2px" }}>{t("No matches", "موردی یافت نشد")}</div>}
              {swapResults.map((sf) => (
                <button

                      style={{
                        display: "flex",
                        alignItems: "center",
                        justifyContent: "center",
                        width: 24,
                        height: 17,
                        background: "#1a1c1d",
                        border: "0.5px solid #3a3d3e",
                        borderRadius: "0 0 6px 6px",
                        color: "#d4938f",
                        fontSize: 9,
                        lineHeight: 1,
                        cursor: "pointer",
                        padding: 0,
                      }}
                    >
                      ▼
                    </button>
                  </div>
                </div>
                <div style={{ fontSize: 11.5, color: "#797d7d", marginTop: 2 }}>
                  {t(`1 serving = ${f.fdaLabel}`, `هر وعده = ${f.fdaLabelFa}`)}
                </div>
              </div>
            )}
          </div>
        </div>
        <div
          style={{
            display: "flex",
            flexDirection: "column",
            alignItems: "center",
            justifyContent: "center",
            gap: 2,
            flex: "1 1 0",
            minWidth: 160,
            background: "#0d0f10",
            border: "0.5px solid #3a3d3e",
            borderRadius: 10,
            padding: 7,
          }}
        >
          <MiniCurveChart food={f} gl={gl} width={136} height={95} lang={lang} />
          <span style={{ fontSize: 7.5, color: "#6f7373", textTransform: "uppercase", letterSpacing: "0.03em" }}>
            {t("glucose response", "پاسخ قندی")}
          </span>

      </div>

      <div style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: 10 }}>
        <MacroPie macros={macros} size={pieSize} lang={lang} />
        <div style={{ width: "100%", maxWidth: 300 }}>
          <MacroTotals
            macros={macros}
            lang={lang}
            showCalories
            showFiber
            totalGrams={grams}
            carbTypes={carbTypesAtPortion(f, grams)}
            functionalCarbQuality={computeFunctionalCarbScore(f)}
            aminos={aminoAcidsAtPortion(f, grams)}
            proteinQuality={foodProteinQuality(f)}
            functionalProteinQuality={computeFunctionalProteinScore(f)}
            fatAcids={fatAcidsAtPortion(f, grams)}
            fatQuality={computeFatQualityScore(f)}
            functionalFatQuality={computeFunctionalFatScore(f)}
            gi={f.gi}
            gl={gl}
            ttp={f.ttp}
          />
        </div>
      </div>

      {showAmino && (
        <div style={{ marginTop: 12, paddingTop: 12, borderTop: "0.5px solid #2a2c2d" }}>
          <div style={{ fontSize: 11.5, color: "#8a8f8f", marginBottom: 8 }}>{t("Amino acid profile", "نمایه اسیدهای آمینه")}</div>
          <div style={{ display: "flex", justifyContent: "center" }}>
            <AminoPie aminos={aminoAcidsAtPortion(f, grams)} size={pieSize} lang={lang} />
          </div>
          <ProteinQualityBadge quality={foodProteinQuality(f)} lang={lang} />
        </div>
      )}

      {microSignificant.length > 0 && (
        <div style={{ marginTop: 12, paddingTop: 12, borderTop: "0.5px solid #2a2c2d" }}>
          <div style={{ fontSize: 11, color: "#797d7d", marginBottom: 6, display: "flex", alignItems: "center" }}>
            {t("Micronutrients", "ریزمغذی‌ها")}
            <InfoIcon text={t(INFO_TEXT.microDv.en, INFO_TEXT.microDv.fa)} />
          </div>
          <div style={{ display: "flex", flexWrap: "wrap", gap: 6 }}>
            {microSignificant.map(({ k, dvPct, color }) => (
              <InfoIcon key={k} text={t(MICRO_INFO[k].en, MICRO_INFO[k].fa)}>
                <div style={{ display: "flex", alignItems: "center", gap: 4, background: "#0d0f10", border: `0.5px solid ${color}`, borderRadius: 999, padding: "4px 9px 4px 7px", minHeight: 26 }}>
                  <span style={{ fontSize: 11 }}>{MICRO_ICONS[k]}</span>
                  <span style={{ fontSize: 10.5, fontWeight: 500 }}>{t(MICRO_LABELS[k].en, MICRO_LABELS[k].fa)}</span>
                  <span style={{ fontSize: 10, color, fontWeight: 700 }}>{dvPct}%</span>
                </div>
              </InfoIcon>
            ))}
          </div>
        </div>
      )}

      <div style={{ display: "flex", flexWrap: "wrap", gap: 8, marginTop: 12, paddingTop: 12, borderTop: "0.5px solid #2a2c2d" }}>
        {microMinor.length > 0 && (
          <Collapsible
            open={isOpen}
            onToggle={() => toggleDetails(f.id)}
            showLabel={t("Minor amounts", "مقادیر کم")}
            hideLabel={t("Hide minor amounts", "پنهان کردن مقادیر کم")}
            info={t(INFO_TEXT.microDv.en, INFO_TEXT.microDv.fa)}
            compact
          >
            {microMinor.map(({ k, dvPct }) => (
              <MicroRow
                key={k}
                icon={MICRO_ICONS[k]}
                label={t(MICRO_LABELS[k].en, MICRO_LABELS[k].fa)}
                value={micros[k]}
                unit={MICRO_LABELS[k].unit}
                dvPct={dvPct}
                info={t(MICRO_INFO[k].en, MICRO_INFO[k].fa)}
              />
            ))}
          </Collapsible>
        )}

        {!showAminoAlways && <AminoAcidSection food={f} grams={grams} lang={lang} t={t} />}
        <CarbBreakdownSection food={f} grams={grams} lang={lang} t={t} />
        <FatAcidSection food={f} grams={grams} lang={lang} t={t} />
      </div>
    </div>
  );
}

function Compare() {
  const initial = useMemo(() => readInitialState() || readPersistedState(), []);
  const [lang, setLang] = useState(initial ? initial.lang : "en");
  const [mode, setMode] = useState(initial ? initial.mode : "fda");
  const [query, setQuery] = useState("");
  const [commandFeedback, setCommandFeedback] = useState(null);
  const [showSuggestions, setShowSuggestions] = useState(false);
  const [activeIndex, setActiveIndex] = useState(-1);
  const [browseOpen, setBrowseOpen] = useState(false);
  const [presetsOpen, setPresetsOpen] = useState(false);
  const [menuOpen, setMenuOpen] = useState(false);
  const [tourStep, setTourStep] = useState(-1);
  const [tourRect, setTourRect] = useState(null);
  const [plateSlots, setPlateSlots] = useState(() => {
    if (initial && initial.plateSlots) return initial.plateSlots;
    const s = emptyPlateSlots();
    s.breakfast = DEFAULT_BREAKFAST_IDS;
    s.snack = DEFAULT_SNACK_IDS;
    return s;
  });
  const [activeSlot, setActiveSlot] = useState(initial && initial.activeSlot ? initial.activeSlot : "breakfast");
  // `plateIds` / `setPlateIds` keep the same shape as before (a plain array
  // + setter) so all the existing plate logic below reads/writes the
  // *currently active* meal slot without needing to know slots exist.
  // A no-op setter on the Daily total tab keeps that tab strictly read-only.
  const plateIds = activeSlot === DAILY_TAB_ID ? [] : plateSlots[activeSlot] || [];
  function setPlateIds(updater) {
    if (activeSlot === DAILY_TAB_ID) return;
    setPlateSlots((prev) => ({
      ...prev,
      [activeSlot]: typeof updater === "function" ? updater(prev[activeSlot] || []) : updater,
    }));
  }
  const [customGrams, setCustomGrams] = useState(initial && initial.customGrams ? initial.customGrams : {});
  // Union of every food across every slot, deduped — used only for the
  // shareable URL and localStorage snapshot, never for rendering (each
  // tab renders strictly from its own slot array, see `selected` below).
  const allPlatedIds = useMemo(() => {
    const seen = [];
    MEAL_SLOT_IDS.forEach((slotId) => {
      (plateSlots[slotId] || []).forEach((id) => {
        if (!seen.includes(id)) seen.push(id);
      });
    });
    return seen;
  }, [plateSlots]);
  const isDailyTab = activeSlot === DAILY_TAB_ID;
  const activeSlotMeta = MEAL_SLOTS.find((s) => s.id === activeSlot);
  const [openDetails, setOpenDetails] = useState({});
  const [swapOpenId, setSwapOpenId] = useState(null);
  const [addToOpenId, setAddToOpenId] = useState(null);
  const [removingIds, setRemovingIds] = useState([]);

  // Gives the card a moment to visually collapse (shrink + fade) before
  // actually removing the food from state, so the card below smoothly
  // slides up into its place instead of the list just jumping.
  function requestRemoveFood(id) {
    setRemovingIds((prev) => (prev.includes(id) ? prev : [...prev, id]));
    setTimeout(() => {
      toggle(id);
      setRemovingIds((prev) => prev.filter((x) => x !== id));
    }, 260);
  }
  const tabScrollRef = useRef(null);
  const [canScrollTabsLeft, setCanScrollTabsLeft] = useState(false);
  const [canScrollTabsRight, setCanScrollTabsRight] = useState(false);

  function updateTabScrollState() {
    const el = tabScrollRef.current;
    if (!el) return;
    setCanScrollTabsLeft(el.scrollLeft > 4);
    setCanScrollTabsRight(el.scrollLeft + el.clientWidth < el.scrollWidth - 4);
  }

  useEffect(() => {
    updateTabScrollState();
    const el = tabScrollRef.current;
    if (!el) return;
    const onScroll = () => updateTabScrollState();
    el.addEventListener("scroll", onScroll);
    window.addEventListener("resize", onScroll);
    return () => {
      el.removeEventListener("scroll", onScroll);
      window.removeEventListener("resize", onScroll);
    };
  }, []);

  function scrollTabs(dir) {
    const el = tabScrollRef.current;
    if (!el) return;
    el.scrollBy({ left: dir * 180, behavior: "smooth" });
  }
  const [swapQuery, setSwapQuery] = useState("");
  const [plateAminoOpen, setPlateAminoOpen] = useState(false);
  const [plateFatOpen, setPlateFatOpen] = useState(false);
  const [plateCarbOpen, setPlateCarbOpen] = useState(false);
  const [plateMicroMinorOpen, setPlateMicroMinorOpen] = useState(false);
  const [combinedResponseOpen, setCombinedResponseOpen] = useState(false);
  const [shareStatus, setShareStatus] = useState("idle");
  const canvasRef = useRef(null);
  const chartRef = useRef(null);
  const plateCanvasRef = useRef(null);
  const plateChartRef = useRef(null);
  const chartJsLoaded = useRef(false);
  const [, setTick] = useState(0);

  const t = (en, fa) => (lang === "fa" ? fa : en);

  // Each meal tab's card list is that slot's own plate array — tabs don't
  // share a global "comparison" list, so adding/removing a food in one
  // meal never touches another meal's cards.
  const selected = useMemo(
    () => plateIds.map((id) => FOOD_BY_ID[id]).filter(Boolean),
    [plateIds]
  );
  const plateFoods = selected;

  // Browse-all list is grouped by macro dominance and independent of the
  // search box — it's a separate way to explore, not a filtered view.
  const browseGroups = useMemo(() => {
    const groups = { carb: [], protein: [], fat: [], mixed: [] };
    FOODS.forEach((f) => groups[macroGroup(f)].push(f));
    return groups;
  }, []);

  // Autocomplete suggestions for the search box (top N matches)
  const suggestions = useMemo(() => {
    const q = query.trim().toLowerCase();
    if (!q) return [];
    return FOODS.filter((f) => f.name.toLowerCase().includes(q) || f.nameFa.includes(query.trim())).slice(0, 8);
  }, [query]);

  // Lets a food card add/remove itself from any specific slot directly,
  // regardless of which tab is currently active — used by the "Add this
  // also to my ..." picker so a food can be in several meals at once
  // without switching tabs each time.
  function toggleSlotMembership(foodId, slotId) {
    setPlateSlots((prev) => {
      const arr = prev[slotId] || [];
      const next = arr.includes(foodId) ? arr.filter((x) => x !== foodId) : [...arr, foodId];
      return { ...prev, [slotId]: next };
    });
  }

  // Each meal tab has its own independent card list — this only ever
  // touches the currently active slot's array, never any other slot.
  function toggle(id) {
    setPlateIds((prev) => {
      if (prev.includes(id)) {
        return prev.filter((x) => x !== id);
      }
      const next = [id, ...prev];
      if (next.length > MAX_SELECT) next.pop();
      return next;
    });
  }

  function selectSuggestion(f) {
    toggle(f.id);
    setQuery("");
    setShowSuggestions(false);
    setActiveIndex(-1);
  }

  function handleSearchKeyDown(e) {
    if (e.key === "Enter") {
      // Command parsing runs before the ordinary suggestion-select path
      // (and before the "no suggestions, do nothing" early return below),
      // since a full sentence like "combine X, Y and Z into a plate"
      // won't match any food name and would otherwise never reach Enter.
      if (tryRunPlateCommand(query)) {
        e.preventDefault();
        return;
      }
    }
    if (!showSuggestions || suggestions.length === 0) return;
    if (e.key === "ArrowDown") {
      e.preventDefault();
      setActiveIndex((i) => (i + 1) % suggestions.length);
    } else if (e.key === "ArrowUp") {
      e.preventDefault();
      setActiveIndex((i) => (i - 1 + suggestions.length) % suggestions.length);
    } else if (e.key === "Enter") {
      e.preventDefault();
      const pick = suggestions[activeIndex] || suggestions[0];
      if (pick) selectSuggestion(pick);
    } else if (e.key === "Escape") {
      setShowSuggestions(false);
    }
  }

  useEffect(() => {
    if (!commandFeedback) return;
    const timer = setTimeout(() => setCommandFeedback(null), 4500);
    return () => clearTimeout(timer);
  }, [commandFeedback]);

  function toggleDetails(id) {
    setOpenDetails((o) => ({ ...o, [id]: !o[id] }));
  }

  function swapFood(oldId, newId) {
    if (oldId === newId || !FOOD_BY_ID[newId]) {
      setSwapOpenId(null);
      return;
    }
    // Scoped to the active slot only, same as every other add/remove —
    // swapping a food in Breakfast shouldn't reach into Lunch or Snack.
    setPlateIds((prev) => {
      if (!prev.includes(oldId)) return prev;
      if (prev.includes(newId)) return prev.filter((id) => id !== oldId);
      return prev.map((id) => (id === oldId ? newId : id));
    });
    setCustomGrams((prev) => {
      if (!(oldId in prev)) return prev;
      const next = { ...prev };
      next[newId] = next[oldId];
      delete next[oldId];
      return next;
    });
    setOpenDetails((prev) => {
      if (!(oldId in prev)) return prev;
      const next = { ...prev };
      next[newId] = next[oldId];
      delete next[oldId];
      return next;
    });
    setSwapOpenId(null);
    setSwapQuery("");
  }

  function applyPreset(preset) {
    // presets are allowed to exceed MAX_SELECT — a dish's real ingredient
    // list shouldn't be truncated just to fit the manual-pick cap.
    // The Daily total tab is read-only, so a preset picked there lands in
    // Breakfast instead of silently doing nothing.
    const targetSlot = activeSlot === DAILY_TAB_ID ? "breakfast" : activeSlot;
    setPlateSlots((prev) => ({ ...prev, [targetSlot]: preset.foods }));
    if (activeSlot === DAILY_TAB_ID) setActiveSlot("breakfast");
    setPresetsOpen(false);
  }

  // Recognizes and runs a typed natural-language plate command (see
  // parsePlateCommand above). Returns true if the text was recognized as a
  // command attempt at all — even one that matched nothing — so the caller
  // knows not to fall through to ordinary food-name search handling.
  function tryRunPlateCommand(text) {
    const termsText = parsePlateCommand(text);
    if (termsText == null) return false;
    const terms = splitFoodTerms(termsText);
    if (terms.length === 0) return false;

    const matched = [];
    const unmatched = [];
    const seen = new Set();
    terms.forEach((term) => {
      const food = findFoodByTerm(term);
      if (food && !seen.has(food.id)) {
        seen.add(food.id);
        matched.push(food);
      } else if (!food) {
        unmatched.push(term);
      }
    });

    if (matched.length === 0) {
      setCommandFeedback({
        ok: false,
        message: t(`Couldn't find any of: ${terms.join(", ")}`, `هیچ‌کدام از این موارد پیدا نشد: ${terms.join("، ")}`),
      });
      return true;
    }

    // Same "plate command" behavior as applying a preset — replaces the
    // target slot outright (allowed to exceed MAX_SELECT) rather than
    // merging with whatever was already there, since "combine X, Y, Z into
    // a plate" reads as building that exact plate.
    const targetSlot = activeSlot === DAILY_TAB_ID ? "breakfast" : activeSlot;
    setPlateSlots((prev) => ({ ...prev, [targetSlot]: matched.map((f) => f.id) }));
    if (activeSlot === DAILY_TAB_ID) setActiveSlot("breakfast");
    setQuery("");
    setShowSuggestions(false);
    setActiveIndex(-1);

    const matchedNames = matched.map((f) => t(f.name, f.nameFa)).join(t(", ", "، "));
    const message =
      unmatched.length > 0
        ? t(`Added: ${matchedNames} · not found: ${unmatched.join(", ")}`, `افزوده شد: ${matchedNames} · پیدا نشد: ${unmatched.join("، ")}`)
        : t(`Added to plate: ${matchedNames}`, `به بشقاب افزوده شد: ${matchedNames}`);
    setCommandFeedback({ ok: unmatched.length === 0, message });
    return true;
  }

  function addIngredientFromBrowse(food) {
    // Purely additive (unlike the old toggle-based checklist): picking a
    // food already in the *current* meal just closes the list instead of
    // removing it, so this always reads as "add", never "remove".
    if (!plateIds.includes(food.id)) {
      toggle(food.id);
    }
    setBrowseOpen(false);
  }

  useEffect(() => {
    if (typeof window === "undefined" || !/^https?:/.test(window.location.protocol)) return;
    try {
      const url = new URL(window.location.href);
      url.searchParams.set("foods", allPlatedIds.join(","));
      url.searchParams.set("plate", (plateSlots.breakfast || []).join(","));
      url.searchParams.set("mode", mode);
      url.searchParams.set("lang", lang);
      window.history.replaceState({}, "", url.toString());
    } catch (e) {
      // ignore
    }
  }, [allPlatedIds, plateSlots, mode, lang]);

  useEffect(() => {
    writePersistedState({ selectedIds: allPlatedIds, plateSlots, activeSlot, mode, lang, customGrams });
  }, [allPlatedIds, plateSlots, activeSlot, mode, lang, customGrams]);

  function resetToDefaults() {
    const s = emptyPlateSlots();
    s.breakfast = DEFAULT_BREAKFAST_IDS;
    s.snack = DEFAULT_SNACK_IDS;
    setPlateSlots(s);
    setActiveSlot("breakfast");
    setCustomGrams({});
    setMode("fda");
    clearPersistedState();
    setMenuOpen(false);
  }

  async function handleShare() {
    const text =
      activeSlot === DAILY_TAB_ID
        ? buildDailyShareText(plateSlots, mode, lang, customGrams)
        : buildShareText(selected, plateIds, mode, lang, customGrams);
    await copyText(text);
    setShareStatus("copied");
    setTimeout(() => setShareStatus("idle"), 2000);
  }

  function startTour() {
    setPresetsOpen(false);
    setBrowseOpen(false);
    setTourStep(0);
  }

  useEffect(() => {
    if (tourStep < 0) return;
    const step = TOUR_STEPS[tourStep];
    if (!step) return;
    const el = document.getElementById(step.id);
    if (!el) {
      setTourRect(null);
      return;
    }
    el.scrollIntoView({ behavior: "smooth", block: "center" });
    const measure = () => {
      const r = el.getBoundingClientRect();
      setTourRect({ top: r.top, left: r.left, width: r.width, height: r.height });
    };
    const timer = setTimeout(measure, 320);
    window.addEventListener("resize", measure);
    return () => {
      clearTimeout(timer);
      window.removeEventListener("resize", measure);
    };
  }, [tourStep]);

  function setGramsFor(id, grams) {
    setCustomGrams((prev) => ({ ...prev, [id]: grams }));
  }
  function resetGramsFor(id) {
    setCustomGrams((prev) => {
      const next = { ...prev };
      delete next[id];
      return next;
    });
  }

  // Load Chart.js + the datalabels plugin (for in-slice gram labels)
  useEffect(() => {
    function ready() {
      chartJsLoaded.current = true;
      setTick((x) => x + 1);
    }
    if (window.Chart && window.ChartDataLabels) {
      ready();
      return;
    }
    const s1 = document.createElement("script");
    s1.src = "https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js";
    s1.onload = () => {
      const s2 = document.createElement("script");
      s2.src = "https://cdnjs.cloudflare.com/ajax/libs/chartjs-plugin-datalabels/2.2.0/chartjs-plugin-datalabels.min.js";
      s2.onload = ready;
      document.body.appendChild(s2);
    };
    document.body.appendChild(s1);
  }, []);

  // Response curve chart
  useEffect(() => {
    if (!chartJsLoaded.current || !window.Chart || !canvasRef.current) return;
    const labels = [];
    for (let tt = 0; tt <= 200; tt += 5) labels.push(tt);

    const datasets = selected.map((f) => {
      const { gl } = portionInfo(f, mode, customGrams[f.id]);
      return {
        label: lang === "fa" ? f.nameFa : f.name,
        data: curvePoints(f, gl),
        borderColor: f.color,
        backgroundColor: "transparent",
        borderWidth: 2.5,
        pointRadius: 0,
        tension: 0.3,
      };
    });

    if (chartRef.current) chartRef.current.destroy();
    chartRef.current = new window.Chart(canvasRef.current, {
      type: "line",
      data: { labels, datasets },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        interaction: { mode: "index", intersect: false },
        plugins: {
          legend: { display: true, labels: { color: "#c7c5bc", font: { size: 12 }, usePointStyle: true, boxWidth: 8 } },
          tooltip: { titleColor: "#e8e6df", bodyColor: "#e8e6df", backgroundColor: "#16181a", borderColor: "#3a3d3e", borderWidth: 1 },
          datalabels: { display: false },
        },
        scales: {
          x: {
            title: { display: true, text: t("minutes after eating", "دقیقه پس از خوردن"), color: "#8a8f8f" },
            ticks: { color: "#797d7d", maxTicksLimit: 9 },
            grid: { color: "#222425" },
          },
          y: {
            title: { display: true, text: t("blood glucose rise", "افزایش قند خون"), color: "#8a8f8f" },
            ticks: { color: "#797d7d" },
            grid: { color: "#222425" },
            beginAtZero: true,
          },
        },
      },
    });
    return () => chartRef.current && chartRef.current.destroy();
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [selected, lang, mode, customGrams, chartJsLoaded.current]);

  // Daily total tab: flatten every slot's foods (duplicates across slots
  // count twice, on purpose — that's more food actually eaten that day),
  // plus a per-slot summary for the "by meal" list and a true time-of-day
  // curve that layers each slot's own response at its clock time.
  const dailyFoodsFlat = useMemo(() => {
    if (activeSlot !== DAILY_TAB_ID) return [];
    return MEAL_SLOTS.flatMap((s) => (plateSlots[s.id] || []).map((id) => FOOD_BY_ID[id]).filter(Boolean));
  }, [activeSlot, plateSlots]);

  const dailyCurveInfo = useMemo(() => {
    if (activeSlot !== DAILY_TAB_ID) return null;
    return computeDailyCurve(plateSlots, mode, customGrams);
  }, [activeSlot, plateSlots, mode, customGrams]);

  const mealCardData = useMemo(() => {
    return MEAL_SLOTS.map((s) => {

      const foods = ids.map((id) => FOOD_BY_ID[id]).filter(Boolean);
      if (foods.length === 0) return { slot: s, foods: [], plate: null };
      const p = computePlate(foods, mode, customGrams);
      return { slot: s, foods, plate: p };

  const plate = useMemo(() => {
    if (activeSlot === DAILY_TAB_ID) {
      if (dailyFoodsFlat.length === 0) return null;
      const p = computePlate(dailyFoodsFlat, mode, customGrams);
      return { ...p, curve: dailyCurveInfo ? dailyCurveInfo.curve : p.curve };
    }
    return plateFoods.length > 0 ? computePlate(plateFoods, mode, customGrams) : null;
  }, [activeSlot, dailyFoodsFlat, dailyCurveInfo, plateFoods, mode, customGrams]);
  const bestBadges = useMemo(() => computeBestBadges(selected, mode, customGrams), [selected, mode, customGrams]);
  // Same 5% DV split used on individual food cards: "significant" amounts
  // sit inline in the main summary, trace amounts collapse into "Minor
  // amounts" so they don't crowd out the numbers that matter.
  const plateMicroSplit = useMemo(() => {
    if (!plate) return { significant: [], minor: [] };
    const items = MICRO_KEYS_ORDERED.map((k) => {
      const dvPct = microDvPct(k, plate.micros[k]);
      const tier = microTier(k, dvPct);
      return { k, dvPct, color: tier ? MICRO_TIER_STYLE[tier].color : "#8a8f8f" };
    });
    return {
      significant: packChipsByWidth(
        items.filter((i) => i.dvPct >= 5),
        (i) => estimateMicroChipWidth(lang === "fa" ? MICRO_LABELS[i.k].fa : MICRO_LABELS[i.k].en, i.dvPct)
      ),
      minor: items.filter((i) => i.dvPct < 5),
    };
  }, [plate, lang]);
  const dailyScore = useMemo(() => {
    if (activeSlot !== DAILY_TAB_ID || !plate) return null;
    return computeDailyScore(plate, mealCardData, dailyCurveInfo);
  }, [activeSlot, plate, mealCardData, dailyCurveInfo]);
  const microCoverage = useMemo(() => {
    if (activeSlot !== DAILY_TAB_ID || !plate) return null;
    return computeMicroCoverageScore(plate.micros);
  }, [activeSlot, plate]);
  const fiberScore = useMemo(() => {
    if (activeSlot !== DAILY_TAB_ID || !plate) return null;
    return computeFiberScore(plate.macros.soluble, plate.macros.insoluble);
  }, [activeSlot, plate]);

  // Plate response curve — the same chart doubles as the Daily total tab's
  // 24h curve, swapping to clock-time labels and a wider window in that mode.
  useEffect(() => {
    if (!chartJsLoaded.current || !window.Chart || !plateCanvasRef.current || !plate) return;
    const isDaily = activeSlot === DAILY_TAB_ID && dailyCurveInfo;
    const labels = isDaily ? dailyCurveInfo.labels : Array.from({ length: 41 }, (_, i) => i * 5);
    const curveData = isDaily ? dailyCurveInfo.curve : plate.curve;

    if (plateChartRef.current) plateChartRef.current.destroy();
    plateChartRef.current = new window.Chart(plateCanvasRef.current, {
      type: "line",
      data: {
        labels,
        datasets: [
          {
            label: isDaily ? t("Whole day", "کل روز") : t("Whole plate", "کل بشقاب"),
            data: curveData,
            borderColor: "#e8e6df",
            backgroundColor: "rgba(232,230,223,0.08)",
            fill: true,
            borderWidth: 2.5,
            pointRadius: 0,
            tension: 0.3,

      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: { display: false },
          tooltip: {
            titleColor: "#e8e6df",
            bodyColor: "#e8e6df",
            backgroundColor: "#16181a",
            borderColor: "#3a3d3e",
            borderWidth: 1,
            callbacks: isDaily ? { title: (items) => formatClock(labels[items[0].dataIndex], lang) } : undefined,
          },
          datalabels: { display: false },
        },
        scales: {
          x: {
            title: { display: true, text: isDaily ? t("time of day", "ساعت روز") : t("minutes after eating", "دقیقه پس از خوردن"), color: "#8a8f8f" },
            ticks: {
              color: "#797d7d",
              maxTicksLimit: 9,
              callback: isDaily ? (val, idx) => formatClock(labels[idx], lang) : undefined,
            },
            grid: { color: "#222425" },
          },
          y: {
            title: { display: true, text: isDaily ? t("blood glucose rise across the day", "افزایش قند خون در طول روز") : t("blood glucose rise", "افزایش قند خون"), color: "#8a8f8f" },
            ticks: { color: "#797d7d" },
            grid: { color: "#222425" },
            beginAtZero: true,
          },
        },
      },
    });
    return () => plateChartRef.current && plateChartRef.current.destroy();
    // eslint-disable-next-line react-hooks/exhaustive-deps

        {canScrollTabsRight && (

        {!isDailyTab && browseOpen && (

              <div style={{ fontSize: 12, color: "#8a8f8f", marginBottom: 2, display: "flex", alignItems: "center", justifyContent: "center" }}>

                <InfoIcon text={t(INFO_TEXT.dailyCalories.en, INFO_TEXT.dailyCalories.fa)} />
              </div>
              <div style={{ fontSize: 34, fontWeight: 600, lineHeight: 1.1 }}>

            <div style={{ display: "grid", gridTemplateColumns: "1fr", gap: 12 }}>

        ) : selected.length === 0 ? (
          <div style={{ color: "#8a8f8f", fontSize: 13, padding: "40px 0", textAlign: "center" }}>

// Small "ⓘ" toggle next to a label — tap to reveal a one-line explanation
// of what that number means, tap again (or elsewhere) to dismiss. Kept
// deliberately tiny and inline so it doesn't compete visually with the
// number itself.
function InfoIcon({ text, onOpenChange, children }) {
  const [open, setOpenRaw] = useState(false);
  const ref = useRef(null);
  const popupRef = useRef(null);
  // Default assumes plenty of room below-and-right of the "i". Corrected
  // below once the popup has actually rendered and we know if it's
  // spilling past a screen edge.
  const [adjust, setAdjust] = useState({ shiftX: 0, openUpward: false });
  const setOpen = (updater) => {
    setOpenRaw((prev) => {
      const next = typeof updater === "function" ? updater(prev) : updater;
      if (onOpenChange) onOpenChange(next);
      return next;
    });
  };

  useEffect(() => {
    if (!open) return;
    function handleClickOutside(e) {
      if (ref.current && !ref.current.contains(e.target)) setOpen(false);
    }
    document.addEventListener("mousedown", handleClickOutside);
    document.addEventListener("touchstart", handleClickOutside);
    return () => {
      document.removeEventListener("mousedown", handleClickOutside);
      document.removeEventListener("touchstart", handleClickOutside);
    };
  }, [open]);

  // Keep the popup on-screen: it first renders at its default position
  // (opens downward, left edge aligned with the "i"), then this measures
  // where it actually landed and nudges it back within the viewport if it
  // spilled past the right, left, or bottom edge — common for an "i" that
  // sits near the edge of a narrow phone screen or near the bottom of a
  // card. Runs before paint, so there's no visible jump.
  useLayoutEffect(() => {
    if (!open || !popupRef.current) {
      setAdjust({ shiftX: 0, openUpward: false });
      return;
    }
    function measure() {
      const margin = 8;
      const rect = popupRef.current.getBoundingClientRect();
      let shiftX = 0;
      if (rect.right > window.innerWidth - margin) {
        shiftX = -(rect.right - (window.innerWidth - margin));
      } else if (rect.left < margin) {
        shiftX = margin - rect.left;
      }
      const openUpward = rect.bottom > window.innerHeight - margin;
      setAdjust({ shiftX, openUpward });
    }
    measure();
    window.addEventListener("resize", measure);
    return () => window.removeEventListener("resize", measure);
  }, [open]);

  if (!text) return children ?? null;

  return (
    <span ref={ref} style={{ position: "relative", display: "inline-flex", verticalAlign: "middle" }}>
      <button
        onClick={(e) => {
          e.stopPropagation();
          setOpen((o) => !o);
        }}
        aria-label="Info"
        style={
          children
            ? { display: "inline-flex", background: "transparent", border: "none", padding: 0, margin: 0, font: "inherit", color: "inherit", cursor: "pointer", textAlign: "inherit" }
            : {
                display: "inline-flex",
                alignItems: "center",
                justifyContent: "center",
                width: 15,
                height: 15,
                borderRadius: "50%",
                background: "transparent",
                border: "1px solid #5a5d5d",
                color: "#8a8f8f",
                fontSize: 9.5,
                fontStyle: "italic",
                fontFamily: "Georgia, serif",
                lineHeight: 1,
                cursor: "pointer",
                marginInlineStart: 4,
                flexShrink: 0,
                padding: 0,
              }
        }
      >
        {children || "i"}
      </button>
      {open && (
        <div
          ref={popupRef}
          style={{
            position: "absolute",
            zIndex: 60,
            ...(adjust.openUpward ? { bottom: "calc(100% + 6px)" } : { top: "calc(100% + 6px)" }),
            insetInlineStart: 0,
            transform: adjust.shiftX ? `translateX(${adjust.shiftX}px)` : undefined,
            width: 210,
            maxWidth: "62vw",
            background: "#16181a",
            border: "0.5px solid #3a3d3e",
            borderRadius: 8,
            padding: "9px 11px",
            fontSize: 11,
            fontWeight: 400,
            color: "#c7c5bc",
            lineHeight: 1.5,
            boxShadow: "0 6px 16px rgba(0,0,0,0.4)",
            whiteSpace: "normal",
            textAlign: "start",
          }}
        >
          {text}
        </div>
      )}
    </span>
  );
}

// Shared semicircular gauge renderer — needle sweeps from left (low end of
// range) to right (high end), colored by whatever tier color the caller
// hands in, so GI, GL, and time-to-peak all read the same visual language.
function GaugeArc({ frac, color, size = 22 }) {
  const clampedFrac = Math.max(0, Math.min(1, frac));
  const angleDeg = clampedFrac * 180; // 0deg = right/high, 180deg = left/low
  const angleRad = (angleDeg * Math.PI) / 180;
  const cx = 20;
  const cy = 19;
  const r = 15;
  const needleX = cx + r * Math.cos(angleRad);
  const needleY = cy - r * Math.sin(angleRad);
  return (
    <svg
      width={size}
      height={size * 0.62}
      viewBox="0 0 40 22"
      aria-hidden="true"
      style={{ flexShrink: 0, transform: "scale(-1, -1)" }}
    >
      <path d={`M ${cx - r} ${cy} A ${r} ${r} 0 0 1 ${cx + r} ${cy}`} fill="none" stroke="#3a3d3e" strokeWidth="3" strokeLinecap="round" />
      <line x1={cx} y1={cy} x2={needleX} y2={needleY} stroke={color} strokeWidth="2.5" strokeLinecap="round" />
      <circle cx={cx} cy={cy} r="2.5" fill={color} />
    </svg>
  );
}

// "Time to peak" gauge — needle sweeps from left (slow, gradual rise) to
// right (fast, quick spike) as ttp goes from slow to fast, so the icon
// itself communicates the number's meaning at a glance.
function TimeToPeakIcon({ ttp, size = 22 }) {
  const MIN_TTP = 15;
  const MAX_TTP = 120;
  const clamped = Math.max(MIN_TTP, Math.min(MAX_TTP, ttp));
  // frac: 0 = fastest (short ttp, right), 1 = slowest (long ttp, left) —
  // matches GaugeArc's own 0=right/1=left convention directly.
  const speedFrac = (clamped - MIN_TTP) / (MAX_TTP - MIN_TTP);
  const color = ttp <= 35 ? "#1d9e75" : ttp <= 70 ? "#e0a83c" : "#7fa3d1";
  return <GaugeArc frac={speedFrac} color={color} size={size} />;
}

// Glycemic index gauge — GI has a fixed, well-known 0-100 scale (100 =
// pure glucose), so the needle position is directly GI/100.
function GiIcon({ gi, size = 22 }) {
  return <GaugeArc frac={gi / 100} color={giTier(gi).color} size={size} />;
}

// Glycemic load gauge — GL isn't capped the way GI is, but values above
// ~30 are rare even for large mixed plates, so that's used as the gauge's
// practical "full" end; anything higher just pins the needle at max.
function GlIcon({ gl, size = 22 }) {
  return <GaugeArc frac={gl / 30} color={glTier(gl).color} size={size} />;
}

function MicroRow({ icon, label, value, unit, dvPct, info }) {
  return (
    <div style={{ display: "flex", justifyContent: "space-between", gap: 8, fontSize: 12.5, padding: "3px 0" }}>

// Shows only the micronutrients actually worth a person's attention (>=10%
// DV) as compact icon chips, colored by whether it's a "get more of this"
// win or (for sodium) a "watch out" caution. Everything below that
// threshold is tucked behind a "+N more" toggle instead of cluttering the
// default view with 3% DV trace amounts.
function MicroHighlights({ micros, lang }) {
  const t = (en, fa) => (lang === "fa" ? fa : en);
  const [showAll, setShowAll] = useState(true);
  const items = MICRO_KEYS_ORDERED.map((k) => ({ k, dvPct: microDvPct(k, micros[k]), tier: microTier(k, microDvPct(k, micros[k])) }));
  const highlighted = items.filter((i) => i.tier).sort((a, b) => b.dvPct - a.dvPct);
  const rest = items.filter((i) => !i.tier);

  if (highlighted.length === 0) {
    return <div style={{ fontSize: 12, color: "#6f7373" }}>{t("No standout micronutrients in this portion.", "ریزمغذی برجسته‌ای در این مقدار وجود ندارد.")}</div>;
  }

  return (
    <div>
      <div style={{ display: "flex", flexWrap: "wrap", gap: 7 }}>
        {highlighted.map(({ k, dvPct, tier }) => {
          const style = MICRO_TIER_STYLE[tier];
          return (
            <div
              key={k}
              style={{ display: "flex", alignItems: "center", gap: 5, background: "#0d0f10", border: `0.5px solid ${style.color}`, borderRadius: 999, padding: "6px 12px 6px 9px", minHeight: 32 }}
            >
              <span style={{ fontSize: 13 }}>{MICRO_ICONS[k]}</span>
              <span style={{ fontSize: 12.5, fontWeight: 500 }}>{t(MICRO_LABELS[k].en, MICRO_LABELS[k].fa)}</span>
              <span style={{ fontSize: 12, color: style.color, fontWeight: 700 }}>{dvPct}%</span>
              <InfoIcon text={t(MICRO_INFO[k].en, MICRO_INFO[k].fa)} />
            </div>
          );
        })}
      </div>
      {rest.length > 0 && (
        <div style={{ marginTop: 8 }}>
          <Collapsible
            open={showAll}
            onToggle={() => setShowAll((o) => !o)}
            showLabel={t(`+${rest.length} more (minor amounts)`, `+${rest.length} مورد دیگر (مقدار کم)`)}
            hideLabel={t("Hide minor amounts", "پنهان کردن مقادیر کم")}
          >
            {rest.map(({ k, dvPct }) => (
              <MicroRow
                key={k}
                icon={MICRO_ICONS[k]}
                label={t(MICRO_LABELS[k].en, MICRO_LABELS[k].fa)}
                value={micros[k]}
                unit={MICRO_LABELS[k].unit}
                dvPct={dvPct}
                info={t(MICRO_INFO[k].en, MICRO_INFO[k].fa)}
              />
            ))}
          </Collapsible>
        </div>
      )}
    </div>
  );
}

      </div>
    </div>
  );
}
